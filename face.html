<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Face Scanner</title>

  <!--
    QUAN TRỌNG: Load human.js từ CDN unpkg thay vì jsdelivr
    unpkg ổn định hơn cho package này
  -->
  <!-- Dùng đúng file esm-nobundle compile sẵn, không phụ thuộc tfjs riêng -->
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/human/dist/human.js"></script>
<script>
  // Debug: xem human.js export ra gì
  window.addEventListener('load', () => {
    console.log('=== HUMAN.JS DEBUG ===');
    console.log('window.Human:', typeof window.Human, window.Human);
    console.log('window.human:', typeof window.human, window.human);
    console.log('Human keys:', window.Human ? Object.keys(window.Human) : 'N/A');
  });
</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }

    #video-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); filter: brightness(1.1) contrast(1.05); }

    #guide-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 2; }
    #guide-reticle {
      width: 70vw; max-width: 280px; aspect-ratio: 3/4;
      border: 3px dashed rgba(255,255,255,0.8); border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.65); transition: all 0.3s ease;
    }
    #guide-reticle.active {
      border-color: #10b981; border-style: solid;
      box-shadow: 0 0 20px rgba(16,185,129,0.5), 0 0 0 9999px rgba(0,0,0,0.65);
    }
    #guide-reticle.error {
      border-color: #ef4444; border-style: solid;
      box-shadow: 0 0 20px rgba(239,68,68,0.5), 0 0 0 9999px rgba(0,0,0,0.65);
    }

    #status-bar {
      position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 340px;
      background: rgba(31,41,55,0.95); backdrop-filter: blur(8px);
      padding: 14px 16px; border-radius: 12px; text-align: center;
      font-weight: 600; font-size: 15px; z-index: 3;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s;
    }
    #status-bar.warning { background: rgba(146,64,14,0.92); }
    #status-bar.success { background: rgba(4,120,87,0.92); }
    #status-bar.error   { background: rgba(185,28,28,0.92); }

    /* Progress bar */
    #progress-wrap {
      position: absolute; bottom: 22%; left: 50%; transform: translateX(-50%);
      width: 80%; max-width: 300px; z-index: 3;
    }
    #progress-track { width:100%; height:6px; background:rgba(255,255,255,0.2); border-radius:3px; overflow:hidden; }
    #progress-fill  { height:100%; width:0%; background:linear-gradient(90deg,#6366f1,#10b981); border-radius:3px; transition:width 0.4s ease; }
    #progress-label { text-align:center; font-size:12px; color:rgba(255,255,255,0.65); margin-top:5px; }

    #action-area { position: absolute; bottom: 5%; left: 0; width: 100%; display: flex; justify-content: center; z-index: 3; padding: 0 20px; }
    #btnRetry {
      padding: 16px 24px; border-radius: 12px; border: none; cursor: pointer;
      font-weight: 700; font-size: 16px; width: 100%; max-width: 250px;
      background: linear-gradient(135deg,#ef4444,#dc2626); color: #fff; display: none;
    }
    #btnRetry:active { transform: scale(0.96); }
  </style>
</head>
<body>

<div id="status-bar">Đang khởi tạo...</div>
<div id="video-wrapper"><video id="video" autoplay muted playsinline></video></div>
<div id="guide-overlay"><div id="guide-reticle"></div></div>

<div id="progress-wrap">
  <div id="progress-track"><div id="progress-fill"></div></div>
  <div id="progress-label"></div>
</div>

<div id="action-area">
  <button id="btnRetry" type="button">🔄 Thử Lại</button>
</div>

<script>
  // =========================================================
  // CẤU HÌNH — chỉnh BASE_URL trỏ đúng repo GitHub Pages bạn
  // VD: 'https://ten-user.github.io/ten-repo/models'
  // =========================================================
  const MODEL_BASE_URL = 'https://namcole1991-web.github.io/face-scanner/models';
  // Nếu bạn muốn fallback dùng CDN khi models chưa có trên GitHub:
  // const MODEL_BASE_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/human/models';

  // =========================================================

  const video       = document.getElementById('video');
  const statusEl    = document.getElementById('status-bar');
  const reticle     = document.getElementById('guide-reticle');
  const btnRetry    = document.getElementById('btnRetry');
  const progressFill  = document.getElementById('progress-fill');
  const progressLabel = document.getElementById('progress-label');
  const progressWrap  = document.getElementById('progress-wrap');

  let human        = null;
  let maNV         = '';
  let faceData     = null;
  let workMode     = 'VERIFY';
  let scanInterval = null;
  let isProcessing = false;
  let goodFrames   = 0;

  // ---- Nhận message từ trang cha ----
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'INIT') {
      maNV     = e.data.maNV || '';
      workMode = e.data.mode  || 'VERIFY';
      faceData = e.data.faceData ? JSON.parse(e.data.faceData) : null;
    }
    if (e.data?.type === 'ENROLL_RESULT') {
      if (e.data.success) {
        setStatus('✅ Đã lưu khuôn mặt!', 'success');
        stopCamera();
      } else {
        setStatus('❌ Lỗi lưu: ' + e.data.message, 'error');
        reticle.className = 'error';
        showRetry();
      }
    }
  });

  window.addEventListener('load', () => {
    window.parent.postMessage({ type: 'IFRAME_READY' }, '*');
    initHuman();
  });

  // ---- Helpers ----
  function send(type, payload) { window.parent.postMessage({ type, ...payload }, '*'); }
  function setStatus(msg, cls = '') { statusEl.textContent = msg; statusEl.className = cls; }
  function stopCamera() { video.srcObject?.getTracks().forEach(t => t.stop()); }
  function showRetry()  { btnRetry.style.display = 'block'; }
  function hideRetry()  { btnRetry.style.display = 'none'; }
  function setProgress(pct, label) {
    progressWrap.style.display = 'block';
    progressFill.style.width   = pct + '%';
    progressLabel.textContent  = label;
  }
  function hideProgress() {
    progressWrap.style.display = 'none';
  }

async function initHuman() {
    try {
      setStatus('Đang tải AI...', 'warning');
      setProgress(5, 'Chuẩn bị...');

      // ---- FIX CHÍNH: Xử lý các cách export khác nhau của human.js ----
      let HumanClass;
      if (typeof Human !== 'undefined') {
        // Trường hợp 1: export trực tiếp (các version cũ)
        HumanClass = Human;
      } else if (typeof human !== 'undefined') {
        // Trường hợp 2: export thường là object thay vì class
        HumanClass = human.Human || human.default || human;
      } else if (typeof window.Human !== 'undefined') {
        HumanClass = window.Human;
      } else if (typeof window.human !== 'undefined') {
        HumanClass = window.human?.Human || window.human?.default || window.human;
      } else {
        throw new Error('Không tìm thấy thư viện Human.js! Kiểm tra CDN.');
      }

      console.log('[Human] Detected export:', typeof HumanClass, HumanClass);

      // Cấu hình
      const config = {
        modelBasePath: MODEL_BASE_URL,
        backend: 'webgl',
        face: {
          enabled: true,
          detector:    { enabled: true, rotation: true, return: true, minConfidence: 0.4 },
          mesh:        { enabled: true  },
          description: { enabled: true  },
          liveness:    { enabled: true  },
          emotion:     { enabled: false },
          iris:        { enabled: false },
          age:         { enabled: false },
          gender:      { enabled: false },
        },
        body:         { enabled: false },
        hand:         { enabled: false },
        object:       { enabled: false },
        gesture:      { enabled: false },
        segmentation: { enabled: false },
        filter: { enabled: true, equalization: true, width: 0 },
        async:  true,
        warmup: 'none',
      };

      // Thử new HumanClass() trước, nếu lỗi thì thử cách gọi khác
      try {
        human = new HumanClass(config);
      } catch (constructErr) {
        console.warn('[Human] new() failed, trying .default:', constructErr);
        if (HumanClass.default) {
          human = new HumanClass.default(config);
        } else if (typeof HumanClass === 'object' && HumanClass.Human) {
          human = new HumanClass.Human(config);
        } else {
          throw new Error('Không thể khởi tạo Human: ' + constructErr.message);
        }
      }

      console.log('[Human] Instance created:', human);

      // Lắng nghe tiến trình tải model
      if (human.events?.addEventListener) {
        human.events.addEventListener('load', (evt) => {
          const pct = Math.round((evt.loaded / Math.max(evt.total, 1)) * 70) + 10;
          setProgress(pct, `Tải model... ${evt.loaded}/${evt.total}`);
        });
      }

      setProgress(10, 'Đang tải models...');
      await human.load();
      setProgress(85, 'Khởi động engine...');
      await human.warmup();
      setProgress(100, 'Hoàn tất!');
      setTimeout(hideProgress, 500);

      // Mở camera
      setStatus('Đang mở Camera...', 'warning');
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      video.srcObject = stream;
      video.onloadeddata = () => {
        video.play();
        setStatus('Đưa mặt vào khung hình', '');
        startScan();
      };

    } catch (err) {
      console.error('initHuman error:', err);
      hideProgress();

      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        setStatus('❌ Camera bị chặn! Hãy cấp quyền và thử lại.', 'error');
      } else if (err.name === 'NotFoundError') {
        setStatus('❌ Không tìm thấy Camera.', 'error');
      } else if (String(err).includes('404') || String(err).includes('model')) {
        setStatus('❌ Không tải được models! Kiểm tra thư mục /models.', 'error');
      } else if (String(err).includes('webgl') || String(err).includes('WebGL')) {
        setStatus('⚠️ WebGL lỗi, đang thử CPU...', 'warning');
        retryWithCPU();
        return;
      } else {
        setStatus('❌ Lỗi: ' + err.message, 'error');
      }
      reticle.className = 'error';
      showRetry();
    }
  }

  // Fallback CPU khi WebGL lỗi
  async function retryWithCPU() {
    try {
      human.config.backend = 'cpu';
      await human.load();
      await human.warmup();
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' }, audio: false
      });
      video.srcObject = stream;
      video.onloadeddata = () => { video.play(); setStatus('Đưa mặt vào khung hình', ''); startScan(); };
    } catch (err2) {
      setStatus('❌ Lỗi khởi tạo: ' + err2.message, 'error');
      reticle.className = 'error';
      showRetry();
    }
  }

function checkOcclusion(face) {
    const result = { glasses: false, mask: false, message: '' };

    if (!face.mesh || face.mesh.length < 468) return result;

    const mesh = face.mesh;

    // ============================================
    // HELPER
    // ============================================
    const pt = (i) => mesh[i] || [0, 0, 0];

    // Khoảng cách Euclidean 2D giữa 2 điểm
    const dist2D = (a, b) => Math.sqrt(
        Math.pow(pt(a)[0] - pt(b)[0], 2) +
        Math.pow(pt(a)[1] - pt(b)[1], 2)
    );

    // ============================================
    // TÍNH CHIỀU CAO MẶT (chuẩn hóa)
    // Dùng để normalize các khoảng cách
    // Trán (10) → Cằm (152)
    // ============================================
    const faceHeight = dist2D(10, 152);
    if (faceHeight < 30) return result; // Mặt quá nhỏ, bỏ qua

    // ============================================
    // PHÁT HIỆN KÍNH
    // Dùng Eye Aspect Ratio (EAR) — tỉ lệ cao/rộng mắt
    //
    // KHÔNG đeo kính: EAR bình thường 0.20 ~ 0.40
    // ĐEO kính: frame kính làm các điểm mesh
    // vùng mí mắt bị "kéo" → EAR bất thường
    //
    // Thực tế: kính làm tăng khoảng cách vertical
    // của vùng quanh mắt so với horizontal
    // → EAR tăng bất thường > 0.42
    //
    // Ngoài ra dùng thêm: khoảng cách mắt-lông mày
    // Kính có gọng → đẩy lông mày lên, tăng khoảng cách
    // ============================================

    // --- Mắt TRÁI ---
    // Theo MediaPipe Face Mesh 468 landmarks:
    // Mí trên: 159, 158, 157, 173
    // Mí dưới: 145, 144, 163, 7
    // Góc trong: 133, góc ngoài: 33
    const leftEyeVertical1 = dist2D(159, 145); // điểm trên-dưới giữa
    const leftEyeVertical2 = dist2D(158, 153); // điểm trên-dưới lệch
    const leftEyeHorizontal = dist2D(33, 133); // chiều ngang mắt
    const leftEAR = leftEyeHorizontal > 0
        ? (leftEyeVertical1 + leftEyeVertical2) / (2 * leftEyeHorizontal)
        : 0;

    // --- Mắt PHẢI ---
    // Mí trên: 386, 385, 384, 398
    // Mí dưới: 374, 373, 390, 249
    // Góc trong: 362, góc ngoài: 263
    const rightEyeVertical1 = dist2D(386, 374);
    const rightEyeVertical2 = dist2D(385, 380);
    const rightEyeHorizontal = dist2D(362, 263);
    const rightEAR = rightEyeHorizontal > 0
        ? (rightEyeVertical1 + rightEyeVertical2) / (2 * rightEyeHorizontal)
        : 0;

    const avgEAR = (leftEAR + rightEAR) / 2;

    // --- Khoảng cách lông mày → mắt ---
    // Lông mày trái: 70 (giữa), Mí trên trái: 159
    // Lông mày phải: 300 (giữa), Mí trên phải: 386
    const leftBrowEyeDist  = dist2D(70, 159)  / faceHeight;
    const rightBrowEyeDist = dist2D(300, 386) / faceHeight;
    const avgBrowEyeDist   = (leftBrowEyeDist + rightBrowEyeDist) / 2;

    console.log('[Glasses] leftEAR:', leftEAR.toFixed(3),
                'rightEAR:', rightEAR.toFixed(3),
                'avgEAR:', avgEAR.toFixed(3),
                'browEyeDist:', avgBrowEyeDist.toFixed(3));

    // Kính gọng dày làm avgBrowEyeDist tăng (> 0.12)
    // hoặc làm EAR tăng bất thường (> 0.38) do frame kính
    if (avgBrowEyeDist > 0.16 || avgEAR > 0.42) {
    result.glasses = true;
}

    // ============================================
    // PHÁT HIỆN KHẨU TRANG / CHE MIỆNG
    //
    // Ý tưởng chính:
    // 1. Khoảng cách mũi → cằm (noseChinDist)
    //    Bình thường: 35~45% chiều cao mặt
    //    Khẩu trang: landmarks miệng/cằm bị đẩy → ratio giảm
    //
    // 2. Lip visibility: khoảng cách môi trên → môi dưới
    //    Bình thường: 3~8% chiều cao mặt
    //    Che miệng: landmarks bị flatten → ratio rất nhỏ < 2%
    //
    // 3. Mouth width ratio: chiều rộng miệng / chiều rộng mặt
    //    Khẩu trang làm thu hẹp vùng miệng
    // ============================================

    // Khoảng cách mũi dưới (4) → cằm (152)
    const noseChinDist  = dist2D(4, 152) / faceHeight;

    // Môi trên giữa (13) → Môi dưới giữa (14)
    const lipHeight     = dist2D(13, 14) / faceHeight;

    // Góc miệng trái (61) → Góc miệng phải (291)
    const mouthWidth    = dist2D(61, 291);
    // Chiều rộng mặt: gò má trái (234) → gò má phải (454)
    const faceWidth     = dist2D(234, 454);
    const mouthWidthRatio = faceWidth > 0 ? mouthWidth / faceWidth : 0.5;

    // Điểm phân cách mũi-miệng: dưới vách ngăn mũi (2) → môi trên (0)
    const philtrumDist  = dist2D(2, 0) / faceHeight;

    console.log('[Mask] noseChinDist:', noseChinDist.toFixed(3),
                'lipHeight:', lipHeight.toFixed(3),
                'mouthWidthRatio:', mouthWidthRatio.toFixed(3),
                'philtrumDist:', philtrumDist.toFixed(3));

    // Điều kiện phát hiện khẩu trang / che miệng:
    // - lipHeight < 0.025: môi gần như không thấy (bị che)
    // - mouthWidthRatio < 0.35: miệng quá hẹp so với mặt
    // - noseChinDist < 0.30: khoảng mũi-cằm bị thu ngắn
    const isMouthCovered =
    (lipHeight < 0.010) ||
    (mouthWidthRatio < 0.28 && noseChinDist < 0.28) ||
    (noseChinDist < 0.24);

    if (isMouthCovered) {
        result.mask = true;
    }

    // ============================================
    // TỔNG HỢP MESSAGE
    // ============================================
    if (result.glasses && result.mask) {
        result.message = '🕶️😷 Vui lòng THÁO KÍNH và THÁO KHẨU TRANG!';
    } else if (result.glasses) {
        result.message = '🕶️ Vui lòng THÁO KÍNH ra!';
    } else if (result.mask) {
        result.message = '😷 Vui lòng THÁO KHẨU TRANG / bỏ tay khỏi miệng!';
    }

    return result;
}

// ---- Vòng quét chính (đã tích hợp kiểm tra occlusion) ----
function startScan() {
    if (scanInterval) clearInterval(scanInterval);
    isProcessing = false;
    goodFrames   = 0;
    reticle.className = '';
    hideRetry();

    scanInterval = setInterval(async () => {
        if (isProcessing || !human) return;

        const result = await human.detect(video);
        const faces  = result?.face || [];

        // Không thấy mặt
        if (faces.length === 0) {
            setStatus('👀 Không tìm thấy khuôn mặt', 'warning');
            reticle.className = '';
            goodFrames = 0;
            return;
        }

        // Nhiều mặt
        if (faces.length > 1) {
            setStatus('👥 Nhiều người! Hãy đứng 1 mình.', 'warning');
            reticle.className = '';
            goodFrames = 0;
            return;
        }

        const face = faces[0];

        // Kiểm tra khoảng cách
        const videoW = video.videoWidth || 640;
        const faceW  = face.box?.[2] || 0;
        const ratio  = faceW / videoW;

        if (ratio < 0.18) {
            setStatus('👋 Đưa mặt lại GẦN hơn', 'warning');
            reticle.className = ''; goodFrames = 0; return;
        }
        if (ratio > 0.70) {
            setStatus('🤚 Đưa mặt ra XA hơn', 'warning');
            reticle.className = ''; goodFrames = 0; return;
        }

        // Kiểm tra góc nghiêng
        const yaw   = face.rotation?.angle?.yaw   || 0;
        const pitch = face.rotation?.angle?.pitch || 0;
        if (Math.abs(yaw) > 0.28 || Math.abs(pitch) > 0.28) {
            setStatus('👤 Nhìn THẲNG vào camera', 'warning');
            reticle.className = ''; goodFrames = 0; return;
        }

        // =============================================
        // KIỂM TRA KÍNH + KHẨU TRANG
        // Chỉ áp dụng khi VERIFY (xác thực điểm danh)
        // ENROLL cho phép đăng ký không cần kiểm tra
        // =============================================
       // MỚI — áp dụng cho cả ENROLL và VERIFY
const occlusion = checkOcclusion(face);
if (occlusion.glasses || occlusion.mask) {
    setStatus(occlusion.message, 'error');
    reticle.className = 'error';
    goodFrames = 0;
    return;
}

        // Kiểm tra liveness
        const liveness = face.liveness ?? 1;
        if (liveness < 0.35) {
            setStatus('🚫 Phát hiện ảnh giả mạo!', 'error');
            reticle.className = 'error'; goodFrames = 0; return;
        }

        // Kiểm tra embedding
        if (!face.embedding || face.embedding.length === 0) {
            setStatus('⏳ Đang phân tích...', '');
            return;
        }

        // Tích lũy frame tốt
        goodFrames++;
        reticle.className = 'active';
        setStatus(`✅ Giữ yên... (${goodFrames}/3)`, 'success');

        if (goodFrames < 3) return;

        // Đủ 3 frame — xử lý
        clearInterval(scanInterval);
        isProcessing = true;

        const embedding = Array.from(face.embedding);

        if (workMode === 'ENROLL') {
            doEnroll(embedding);
        } else {
            doVerify(embedding);
        }

    }, 350);
}

  // ---- Đăng ký khuôn mặt ----
  function doEnroll(embedding) {
    setStatus('⏳ Đang lưu sinh trắc học...', 'warning');
    send('ENROLL', { maNV, descriptor: JSON.stringify(embedding) });
  }

  // ---- Xác thực khuôn mặt ----
  function doVerify(currentEmbedding) {
    setStatus('⏳ Đang đối chiếu...', 'warning');

    if (!faceData) {
      setStatus('❌ Chưa có dữ liệu khuôn mặt đã đăng ký!', 'error');
      reticle.className = 'error';
      showRetry();
      return;
    }

    // Human.js dùng Similarity (0→1), cao hơn = giống hơn
    // Ngưỡng > 0.60 = khớp (tương đương euclidean < 0.5 của face-api)
    const similarity = human.match.similarity(currentEmbedding, faceData);
    console.log('[FaceVerify] Similarity:', similarity);

    if (similarity > 0.60) {
      setStatus('✅ Nhận diện thành công!', 'success');
      reticle.className = 'active';
      send('VERIFIED', { maNV, distance: similarity });
      stopCamera();
    } else {
      setStatus(`❌ Không khớp! (${(similarity * 100).toFixed(1)}%)`, 'error');
      reticle.className = 'error';
      showRetry();
      send('FAILED', { maNV, distance: similarity });
    }
  }

  btnRetry.onclick = () => {
    hideRetry();
    setStatus('Đưa mặt vào khung hình', '');
    // Nếu camera đã tắt (sau VERIFIED/error nghiêm trọng), khởi động lại
    if (!video.srcObject || !video.srcObject.active) {
      initHuman();
    } else {
      startScan();
    }
  };
</script>
