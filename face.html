<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Face Scanner</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, sans-serif; background: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    #status { color: #4338ca; font-weight: 500; text-align: center; margin-bottom: 12px; min-height: 48px; padding: 0 8px; font-size: 14px; }
    #status.error { color: #ef4444; }
    #video-wrapper { background: #1f2937; border-radius: 12px; overflow: hidden; margin-bottom: 16px; position: relative;}
    video { display: block; transform: scaleX(-1); }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; }
    #btnEnroll { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    #btnVerify { background: linear-gradient(135deg,#10b981,#059669); color: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #btnRetry { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  </style>
</head>
<body>

<div id="status">Đang tải thư viện AI...</div>

<div id="video-wrapper">
  <video id="video" width="320" height="240" autoplay muted playsinline></video>
</div>

<div class="btn-row" id="btn-normal">
  <button id="btnEnroll" disabled>Đăng ký mặt</button>
  <button id="btnVerify" disabled>Xác thực</button>
</div>
<div class="btn-row" id="btn-error" style="display:none">
  <button id="btnRetry">🔄 Thử Lại Camera</button>
</div>

<script>
  const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
  
  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const btnEnroll = document.getElementById('btnEnroll');
  const btnVerify = document.getElementById('btnVerify');
  const btnNormal = document.getElementById('btn-normal');
  const btnError = document.getElementById('btn-error');

  let maNV = '';
  let faceData = null;
  let userRole = ''; // Biến để nhớ ai đang đăng nhập

  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'INIT') {
        maNV = e.data.maNV || '';
        userRole = e.data.role || '';
        faceData = e.data.faceData ? new Float32Array(JSON.parse(e.data.faceData)) : null;

        // Nếu là Nhân viên/Sinh viên thì ẩn hết nút bấm đi cho gọn
        if (userRole !== 'ADMIN') {
            btnEnroll.style.display = 'none';
            btnVerify.style.display = 'none'; 
        }
    }

    if (e.data && e.data.type === 'ENROLL_RESULT') {
        if (e.data.success) {
            setStatus('✅ Đã lưu khuôn mặt vào hệ thống!');
        } else {
            setStatus('❌ Lỗi lưu: ' + e.data.message, true);
        }
    }
  });

  window.addEventListener('load', () => {
    window.parent.postMessage({ type: 'IFRAME_READY' }, '*');
  });

  function sendToParent(type, payload) {
    window.parent.postMessage({ type, ...payload }, '*');
  }

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.className = isError ? 'error' : '';
  }

  let modelsLoaded = false;

  async function init() {
    setStatus('Đang tải cấu hình AI...');
    btnNormal.style.display = 'flex';
    btnError.style.display = 'none';

    try {
      if (!modelsLoaded) {
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);
        modelsLoaded = true;
      }
      setStatus('Đang bật Camera...');

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: 'user' },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      btnEnroll.disabled = false;
      btnVerify.disabled = false;

      // LOGIC TỰ ĐỘNG QUÉT DÀNH CHO SINH VIÊN/NHÂN VIÊN
      if (userRole !== 'ADMIN') {
         setStatus('Đang tự động quét... Vui lòng giữ yên đầu!');
         // Hẹn giờ 1.5 giây để Camera lấy nét cho nét rồi mới tự động ấn "Xác thực"
         setTimeout(() => {
            btnVerify.click();
         }, 1500);
      } else {
         setStatus('Vui lòng nhìn thẳng vào camera...');
      }

    } catch (err) {
      console.error(err);
      btnNormal.style.display = 'none';
      btnError.style.display = 'flex';
      setStatus('Lỗi hoặc Trình duyệt chặn Camera.', true);
    }
  }

  document.getElementById('btnRetry').onclick = init;

  btnEnroll.onclick = async () => {
    setStatus('Đang quét khuôn mặt để đăng ký...');
    const det = await faceapi
      .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
      .withFaceLandmarks()
      .withFaceDescriptor();

    if (det) {
      const descriptorStr = JSON.stringify(Array.from(det.descriptor));
      sendToParent('ENROLL', { maNV, descriptor: descriptorStr });
      setStatus('✅ Đã gửi dữ liệu khuôn mặt để lưu!');
    } else {
      setStatus('⚠️ Không tìm thấy khuôn mặt rõ nét, hãy thử lại.', true);
    }
  };

  btnVerify.onclick = async () => {
    if (!faceData) {
      setStatus('❌ Sinh viên chưa đăng ký khuôn mặt!', true);
      return;
    }
    setStatus('Đang phân tích khuôn mặt...');
    const det = await faceapi
      .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
      .withFaceLandmarks()
      .withFaceDescriptor();

    if (det) {
      const distance = faceapi.euclideanDistance(det.descriptor, faceData);
      if (distance < 0.55) {
        setStatus('✅ Nhận diện thành công!');
        sendToParent('VERIFIED', { maNV, distance });
      } else {
        setStatus(`❌ Khuôn mặt không khớp! Vui lòng thử lại.`, true);
        sendToParent('FAILED', { maNV, distance });
      }
    } else {
      setStatus('⚠️ Camera không thấy rõ mặt. Vui lòng di chuyển ra chỗ sáng.', true);
      // Tự động quét lại sau 2 giây nếu không thấy mặt
      if (userRole !== 'ADMIN') {
         setTimeout(() => btnVerify.click(), 2000);
      }
    }
  };

  // KHẮC PHỤC LỖI "faceapi is not defined"
  // Vòng lặp chờ thư viện tải xong 100% rồi mới chạy init()
  let checkLoad = setInterval(() => {
     if (typeof faceapi !== 'undefined') {
         clearInterval(checkLoad);
         init();
     }
  }, 100);

</script>
</body>
</html>
