<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Face Scanner (Human AI)</title>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/human/dist/human.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, sans-serif; background: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    #status { color: #4338ca; font-weight: 500; text-align: center; margin-bottom: 12px; min-height: 48px; padding: 0 8px; font-size: 14px; }
    #status.error { color: #ef4444; }
    #video-wrapper { background: #1f2937; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    video { display: block; transform: scaleX(-1); }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; }
    #btnEnroll { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    #btnVerify { background: linear-gradient(135deg,#10b981,#059669); color: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #btnRetry { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  </style>
</head>
<body>

<div id="status">Đang khởi tạo AI...</div>

<div id="video-wrapper">
  <video id="video" width="320" height="240" autoplay muted playsinline></video>
</div>

<div class="btn-row" id="btn-normal">
  <button id="btnEnroll" disabled>Đăng ký mặt</button>
  <button id="btnVerify" disabled>Xác thực</button>
</div>
<div class="btn-row" id="btn-error" style="display:none">
  <button id="btnRetry">🔄 Thử Lại Camera</button>
</div>

<script>
  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const btnEnroll = document.getElementById('btnEnroll');
  const btnVerify = document.getElementById('btnVerify');
  const btnNormal = document.getElementById('btn-normal');
  const btnError = document.getElementById('btn-error');

  let maNV = '';
  let faceData = null; 

  const humanConfig = {
    modelBasePath: 'https://vladmandic.github.io/human/models/', 
    face: {
      enabled: true,
      detector: { return: true, rotation: true },
      mesh: { enabled: true },
      description: { enabled: true },
      antispoof: { enabled: true },
      liveness: { enabled: true }
    },
    body: { enabled: false },
    hand: { enabled: false },
    gesture: { enabled: false }
  };

  // SỬA LẠI DÒNG NÀY (Thêm .Human)
  const human = new Human.Human(humanConfig);

  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'INIT') {
        maNV = e.data.maNV || '';
        faceData = e.data.faceData ? Object.values(JSON.parse(e.data.faceData)) : null;
        
        if (e.data.role !== 'ADMIN') {
            btnEnroll.style.display = 'none';
        }
    }

    if (e.data && e.data.type === 'ENROLL_RESULT') {
        if (e.data.success) {
            setStatus('✅ Đã lưu khuôn mặt vào hệ thống!');
        } else {
            setStatus('❌ Lỗi lưu: ' + e.data.message, true);
        }
    }
  });

  window.addEventListener('load', () => {
    window.parent.postMessage({ type: 'IFRAME_READY' }, '*');
  });

  function sendToParent(type, payload) {
    window.parent.postMessage({ type, ...payload }, '*');
  }

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.className = isError ? 'error' : '';
  }

  async function init() {
    setStatus('Đang tải AI models siêu tốc...');
    btnNormal.style.display = 'flex';
    btnError.style.display = 'none';

    try {
      await human.load(); 
      setStatus('Đang yêu cầu quyền Camera...');

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: 'user' },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      video.onloadeddata = async () => {
         await human.detect(video);
         setStatus('Vui lòng nhìn thẳng vào camera...');
         btnEnroll.disabled = false;
         btnVerify.disabled = false;
      };

    } catch (err) {
      console.error(err);
      btnNormal.style.display = 'none';
      btnError.style.display = 'flex';
      setStatus('Lỗi hoặc Trình duyệt chặn Camera.', true);
    }
  }

  document.getElementById('btnRetry').onclick = init;

  async function getFaceData() {
     const result = await human.detect(video);
     if (result.face && result.face.length > 0) {
        return result.face[0];
     }
     return null;
  }

  btnEnroll.onclick = async () => {
    setStatus('Đang phân tích khuôn mặt...');
    const face = await getFaceData();

    if (face && face.embedding) {
      const descriptorStr = JSON.stringify(Array.from(face.embedding));
      sendToParent('ENROLL', { maNV, descriptor: descriptorStr });
      setStatus('✅ Đã gửi dữ liệu khuôn mặt để lưu!');
    } else {
      setStatus('⚠️ Không tìm thấy khuôn mặt rõ nét.', true);
    }
  };

  btnVerify.onclick = async () => {
    if (!faceData || faceData.length === 0) {
      setStatus('❌ Sinh viên chưa đăng ký khuôn mặt!', true);
      return;
    }

    setStatus('Đang xác thực...');
    const face = await getFaceData();

    if (face && face.embedding) {
      if (face.real < 0.5) {
         setStatus('❌ Phát hiện ảnh giả mạo! Vui lòng dùng người thật.', true);
         return;
      }

      const match = human.match(face.embedding, faceData);
      
      if (match.similarity > 0.55) {
        setStatus(`✅ Xác thực thành công! (${(match.similarity * 100).toFixed(0)}%)`);
        sendToParent('VERIFIED', { maNV, distance: match.distance });
      } else {
        setStatus(`❌ Khuôn mặt không khớp! (${(match.similarity * 100).toFixed(0)}%)`, true);
        sendToParent('FAILED', { maNV, distance: match.distance });
      }
    } else {
      setStatus('⚠️ Không tìm thấy khuôn mặt.', true);
    }
  };

  init();
</script>
</body>
</html>
