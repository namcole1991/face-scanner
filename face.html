<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Face Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
    
    #video-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    
    #guide-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 2; }
    #guide-reticle { width: 70vw; max-width: 280px; aspect-ratio: 3/4; border: 3px dashed rgba(255,255,255,0.8); border-radius: 50%; box-shadow: 0 0 0 9999px rgba(0,0,0,0.65); transition: all 0.3s ease; }
    #guide-reticle.active { border-color: #10b981; border-style: solid; box-shadow: 0 0 20px rgba(16,185,129,0.5), 0 0 0 9999px rgba(0,0,0,0.65); }
    #guide-reticle.error { border-color: #ef4444; border-style: solid; box-shadow: 0 0 20px rgba(239,68,68,0.5), 0 0 0 9999px rgba(0,0,0,0.65); }

    #status-bar { position: absolute; top: 5%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 340px; background: rgba(31,41,55,0.95); backdrop-filter: blur(8px); padding: 14px 16px; border-radius: 12px; text-align: center; font-weight: 600; font-size: 15px; z-index: 3; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s; }
    #status-bar.warning { background: rgba(180,83,9,0.9); }
    #status-bar.success { background: rgba(4,120,87,0.9); }
    #status-bar.error { background: rgba(185,28,28,0.9); }

    #action-area { position: absolute; bottom: 5%; left: 0; width: 100%; display: flex; justify-content: center; z-index: 3; padding: 0 20px; }
    #btnRetry { padding: 16px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; font-size: 16px; width: 100%; max-width: 250px; background: linear-gradient(135deg,#ef4444,#dc2626); color: #fff; display: none; }
    #btnRetry:active { transform: scale(0.96); }

    #progress-bar { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); width: 80%; max-width: 300px; z-index: 3; display: none; }
    #progress-bar.show { display: block; }
    #progress-track { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
    #progress-fill { height: 100%; background: linear-gradient(90deg, #10b981, #34d399); border-radius: 3px; width: 0%; transition: width 0.3s ease; }
    #progress-label { text-align: center; font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 6px; }
  </style>
</head>
<body>

<div id="status-bar">Đang khởi tạo...</div>
<div id="video-wrapper"><video id="video" autoplay muted playsinline></video></div>
<div id="guide-overlay"><div id="guide-reticle"></div></div>
<div id="progress-bar"><div id="progress-track"><div id="progress-fill"></div></div><div id="progress-label"></div></div>
<div id="action-area"><button id="btnRetry" type="button">🔄 Thử Lại</button></div>

<script>
  // ---- MODELS CDN ----
  // Dùng CDN ổn định nhất cho face-api.js models
  const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';

  const video    = document.getElementById('video');
  const statusEl = document.getElementById('status-bar');
  const reticle  = document.getElementById('guide-reticle');
  const btnRetry = document.getElementById('btnRetry');
  const progressBar   = document.getElementById('progress-bar');
  const progressFill  = document.getElementById('progress-fill');
  const progressLabel = document.getElementById('progress-label');

  let maNV     = '';
  let faceData = null;   // Float32Array hoặc Array parsed từ JSON
  let workMode = 'VERIFY';

  let scanInterval  = null;
  let isProcessing  = false;
  let goodFrames    = 0;
  const NEEDED_FRAMES = 3; // Số frame liên tiếp đạt yêu cầu trước khi xử lý

  // ---- NHẬN TÍN HIỆU TỪ TRANG CHA ----
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'INIT') {
      maNV     = e.data.maNV || '';
      workMode = e.data.mode || 'VERIFY';
      faceData = e.data.faceData ? JSON.parse(e.data.faceData) : null;
    }
    if (e.data?.type === 'ENROLL_RESULT') {
      if (e.data.success) {
        setStatus('✅ Đã lưu khuôn mặt thành công!', 'success');
        stopCamera();
      } else {
        setStatus('❌ Lỗi lưu: ' + e.data.message, 'error');
        reticle.className = 'error';
        showRetry();
      }
    }
  });

  window.addEventListener('load', () => {
    window.parent.postMessage({ type: 'IFRAME_READY' }, '*');
    init();
  });

  // ---- HELPERS ----
  function sendToParent(type, payload) {
    window.parent.postMessage({ type, ...payload }, '*');
  }
  function setStatus(msg, cls = '') {
    statusEl.textContent = msg;
    statusEl.className = cls;
  }
  function stopCamera() {
    const stream = video.srcObject;
    if (stream) stream.getTracks().forEach(t => t.stop());
  }
  function showRetry() {
    btnRetry.style.display = 'block';
  }
  function hideRetry() {
    btnRetry.style.display = 'none';
  }
  function setProgress(pct, label) {
    progressBar.className = 'show';
    progressFill.style.width = pct + '%';
    progressLabel.textContent = label;
  }
  function hideProgress() {
    progressBar.className = '';
    progressFill.style.width = '0%';
  }

  // ---- KHỞI TẠO ----
  async function init() {
    try {
      // Tải models cần thiết
      setStatus('Đang tải model (1/3)...', 'warning');
      setProgress(10, 'Tải SSD MobileNet...');
      await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);

      setStatus('Đang tải model (2/3)...', 'warning');
      setProgress(50, 'Tải Face Landmark...');
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);

      setStatus('Đang tải model (3/3)...', 'warning');
      setProgress(80, 'Tải Face Recognition...');
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

      setProgress(100, 'Hoàn tất!');
      setTimeout(hideProgress, 600);

      // Mở camera
      setStatus('Đang mở camera...', 'warning');
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      video.srcObject = stream;
      video.onloadeddata = () => {
        video.play();
        setStatus('Đưa mặt vào khung hình', '');
        startScan();
      };

    } catch (err) {
      console.error('Init error:', err);
      hideProgress();
      // Phân loại lỗi rõ ràng hơn
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        setStatus('❌ Trình duyệt chặn Camera! Hãy cấp quyền và thử lại.', 'error');
      } else if (err.name === 'NotFoundError') {
        setStatus('❌ Không tìm thấy Camera trên thiết bị.', 'error');
      } else {
        setStatus('❌ Lỗi tải AI: ' + err.message, 'error');
      }
      reticle.className = 'error';
      showRetry();
    }
  }

  // ---- VÒNG QUÉT ----
  function startScan() {
    if (scanInterval) clearInterval(scanInterval);
    isProcessing = false;
    goodFrames   = 0;
    reticle.className = '';
    hideRetry();

    scanInterval = setInterval(async () => {
      if (isProcessing) return;

      // Phát hiện khuôn mặt + landmark + descriptor trong 1 lần
      const detection = await faceapi
        .detectSingleFace(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 }))
        .withFaceLandmarks()
        .withFaceDescriptor();

      if (!detection) {
        setStatus('👀 Không tìm thấy khuôn mặt', 'warning');
        reticle.className = '';
        goodFrames = 0;
        return;
      }

      // Kiểm tra kích thước mặt (khoảng cách)
      const box   = detection.detection.box;
      const ratio = box.width / (video.videoWidth || 640);
      if (ratio < 0.18) {
        setStatus('👋 Đưa mặt lại GẦN hơn', 'warning');
        reticle.className = '';
        goodFrames = 0;
        return;
      }
      if (ratio > 0.7) {
        setStatus('🤚 Đưa mặt ra XA hơn', 'warning');
        reticle.className = '';
        goodFrames = 0;
        return;
      }

      // Kiểm tra độ thẳng mặt qua landmarks
      const lm   = detection.landmarks;
      const nose = lm.getNose();
      const jaw  = lm.getJawOutline();
      // Tính xem mũi có nằm giữa hàm không (phát hiện quay nghiêng)
      const jawLeft  = jaw[0].x;
      const jawRight = jaw[jaw.length - 1].x;
      const noseX    = nose[3].x; // đỉnh mũi
      const center   = (jawLeft + jawRight) / 2;
      const jawWidth = jawRight - jawLeft;
      const offset   = Math.abs(noseX - center) / jawWidth;

      if (offset > 0.20) {
        setStatus('👤 Nhìn THẲNG vào camera', 'warning');
        reticle.className = '';
        goodFrames = 0;
        return;
      }

      // Đạt yêu cầu
      goodFrames++;
      reticle.className = 'active';

      if (goodFrames < NEEDED_FRAMES) {
        setStatus(`✅ Giữ yên... (${goodFrames}/${NEEDED_FRAMES})`, 'success');
        return;
      }

      // Đủ frame — xử lý
      clearInterval(scanInterval);
      isProcessing = true;

      const embedding = Array.from(detection.descriptor); // Float32Array → Array

      if (workMode === 'ENROLL') {
        doEnroll(embedding);
      } else {
        doVerify(embedding);
      }

    }, 400); // Quét mỗi 400ms — nhẹ hơn so với human.js
  }

  // ---- ĐĂNG KÝ ----
  function doEnroll(embedding) {
    setStatus('⏳ Đang lưu dữ liệu sinh trắc...', 'warning');
    const descriptorStr = JSON.stringify(embedding);
    sendToParent('ENROLL', { maNV, descriptor: descriptorStr });
  }

  // ---- XÁC THỰC ----
  function doVerify(currentEmbedding) {
    setStatus('⏳ Đang đối chiếu...', 'warning');

    if (!faceData) {
      setStatus('❌ Chưa có dữ liệu khuôn mặt!', 'error');
      reticle.className = 'error';
      showRetry();
      return;
    }

    // face-api.js dùng Euclidean distance (nhỏ hơn = giống hơn)
    // Ngưỡng thường dùng: < 0.5 là khớp, < 0.4 rất chắc chắn
    const storedDescriptor = new Float32Array(faceData);
    const currentDescriptor = new Float32Array(currentEmbedding);
    const distance = faceapi.euclideanDistance(storedDescriptor, currentDescriptor);

    console.log('[FaceVerify] Euclidean distance:', distance);

    if (distance < 0.5) {
      setStatus('✅ Nhận diện thành công!', 'success');
      reticle.className = 'active';
      sendToParent('VERIFIED', { maNV, distance });
      stopCamera();
    } else {
      setStatus('❌ Khuôn mặt không khớp! (dist=' + distance.toFixed(3) + ')', 'error');
      reticle.className = 'error';
      showRetry();
      sendToParent('FAILED', { maNV, distance });
    }
  }

  btnRetry.onclick = () => {
    hideRetry();
    setStatus('Đưa mặt vào khung hình', '');
    startScan();
  };
</script>
</body>
</html>
