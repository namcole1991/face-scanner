<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Face Scanner</title>

  <!-- Version 2.3.2 cố định, dùng new Human() trực tiếp -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/human@2.3.2/dist/human.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }

    #video-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
      filter: brightness(1.1) contrast(1.05); }

    #guide-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; z-index: 2; }
    #guide-reticle {
      width: 70vw; max-width: 280px; aspect-ratio: 3/4;
      border: 3px dashed rgba(255,255,255,0.8); border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.65); transition: all 0.3s ease;
    }
    #guide-reticle.active {
      border-color: #10b981; border-style: solid;
      box-shadow: 0 0 20px rgba(16,185,129,0.5), 0 0 0 9999px rgba(0,0,0,0.65);
    }
    #guide-reticle.error {
      border-color: #ef4444; border-style: solid;
      box-shadow: 0 0 20px rgba(239,68,68,0.5), 0 0 0 9999px rgba(0,0,0,0.65);
    }

    #status-bar {
      position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 340px;
      background: rgba(31,41,55,0.95); backdrop-filter: blur(8px);
      padding: 14px 16px; border-radius: 12px; text-align: center;
      font-weight: 600; font-size: 15px; z-index: 3;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s;
    }
    #status-bar.warning { background: rgba(146,64,14,0.92); }
    #status-bar.success { background: rgba(4,120,87,0.92); }
    #status-bar.error   { background: rgba(185,28,28,0.92); }

    #progress-wrap {
      position: absolute; bottom: 22%; left: 50%; transform: translateX(-50%);
      width: 80%; max-width: 300px; z-index: 3; display: none;
    }
    #progress-track { width:100%; height:6px; background:rgba(255,255,255,0.2);
      border-radius:3px; overflow:hidden; }
    #progress-fill  { height:100%; width:0%;
      background: linear-gradient(90deg,#6366f1,#10b981);
      border-radius:3px; transition: width 0.4s ease; }
    #progress-label { text-align:center; font-size:12px;
      color:rgba(255,255,255,0.65); margin-top:5px; }

    #action-area { position: absolute; bottom: 5%; left: 0; width: 100%;
      display: flex; justify-content: center; z-index: 3; padding: 0 20px; }
    #btnRetry {
      padding: 16px 24px; border-radius: 12px; border: none; cursor: pointer;
      font-weight: 700; font-size: 16px; width: 100%; max-width: 250px;
      background: linear-gradient(135deg,#ef4444,#dc2626); color: #fff; display: none;
    }
    #btnRetry:active { transform: scale(0.96); }
  </style>
</head>
<body>

<div id="status-bar">Đang khởi tạo...</div>
<div id="video-wrapper"><video id="video" autoplay muted playsinline></video></div>
<div id="guide-overlay"><div id="guide-reticle"></div></div>
<div id="progress-wrap">
  <div id="progress-track"><div id="progress-fill"></div></div>
  <div id="progress-label"></div>
</div>
<div id="action-area">
  <button id="btnRetry" type="button">🔄 Thử Lại</button>
</div>

<script>
  // =============================================================
  // Models CDN — version 2.3.2 có sẵn models trên jsdelivr
  // KHÔNG cần tải models về GitHub, dùng CDN trực tiếp
  // =============================================================
  const MODEL_BASE_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/human@2.3.2/models';

  // =============================================================

  const video        = document.getElementById('video');
  const statusEl     = document.getElementById('status-bar');
  const reticle      = document.getElementById('guide-reticle');
  const btnRetry     = document.getElementById('btnRetry');
  const progressWrap  = document.getElementById('progress-wrap');
  const progressFill  = document.getElementById('progress-fill');
  const progressLabel = document.getElementById('progress-label');

  let human        = null;
  let maNV         = '';
  let faceData     = null;
  let workMode     = 'VERIFY';
  let scanInterval = null;
  let isProcessing = false;
  let goodFrames   = 0;

  // ---- Nhận message từ trang cha ----
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'INIT') {
      maNV     = e.data.maNV     || '';
      workMode = e.data.mode     || 'VERIFY';
      faceData = e.data.faceData ? JSON.parse(e.data.faceData) : null;
    }
    if (e.data?.type === 'ENROLL_RESULT') {
      if (e.data.success) {
        setStatus('✅ Đã lưu khuôn mặt!', 'success');
        stopCamera();
      } else {
        setStatus('❌ Lỗi lưu: ' + e.data.message, 'error');
        reticle.className = 'error';
        showRetry();
      }
    }
  });

  window.addEventListener('load', () => {
    window.parent.postMessage({ type: 'IFRAME_READY' }, '*');
    initHuman();
  });

  // ---- Helpers ----
  function send(type, payload) {
    window.parent.postMessage({ type, ...payload }, '*');
  }
  function setStatus(msg, cls = '') {
    statusEl.textContent = msg;
    statusEl.className   = cls;
  }
  function stopCamera() {
    video.srcObject?.getTracks().forEach(t => t.stop());
  }
  function showRetry() { btnRetry.style.display = 'block'; }
  function hideRetry() { btnRetry.style.display = 'none';  }
  function setProgress(pct, label) {
    progressWrap.style.display = 'block';
    progressFill.style.width   = pct + '%';
    progressLabel.textContent  = label;
  }
  function hideProgress() {
    progressWrap.style.display = 'none';
  }

  // ---- Khởi tạo Human.js v2.3.2 ----
  async function initHuman() {
    try {
      setStatus('Đang tải AI...', 'warning');
      setProgress(5, 'Chuẩn bị...');

      // Version 2.x export trực tiếp qua window.Human
      // Không cần workaround phức tạp như v3
      if (typeof Human === 'undefined') {
        throw new Error('Thư viện Human.js chưa load xong. Kiểm tra CDN.');
      }

      const config = {
        modelBasePath: MODEL_BASE_URL,

        // Chỉ bật face — tắt hết để nhẹ và nhanh
        face: {
          enabled:     true,
          detector:    { enabled: true,  minConfidence: 0.4, rotation: true },
          mesh:        { enabled: true  },
          description: { enabled: true  }, // Lấy embedding — BẮT BUỘC
          liveness:    { enabled: true  }, // Chống ảnh giả
          emotion:     { enabled: false },
          iris:        { enabled: false },
          age:         { enabled: false },
          gender:      { enabled: false },
        },
        body:         { enabled: false },
        hand:         { enabled: false },
        object:       { enabled: false },
        gesture:      { enabled: false },
        segmentation: { enabled: false },

        filter: {
          enabled:      true,
          equalization: true, // Tự cân bằng sáng
        },

        backend: 'webgl', // Nhanh nhất, fallback CPU bên dưới
        async:   true,
        warmup:  'none',  // Warmup thủ công
      };

      // Khởi tạo — v2.x dùng new Human() trực tiếp
      human = new Human(config);

      // Theo dõi tiến trình load model
      human.events.addEventListener('load', (evt) => {
        const pct = Math.round((evt.loaded / Math.max(evt.total, 1)) * 70) + 10;
        setProgress(pct, `Tải model ${evt.loaded}/${evt.total}...`);
      });

      // Load models
      setProgress(10, 'Đang tải models...');
      await human.load();

      // Warmup — compile WebGL shaders lần đầu
      setProgress(88, 'Khởi động engine...');
      await human.warmup();

      setProgress(100, 'Sẵn sàng!');
      setTimeout(hideProgress, 500);

      // Mở camera
      setStatus('Đang mở Camera...', 'warning');
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width:  { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });
      video.srcObject = stream;
      video.onloadeddata = () => {
        video.play();
        setStatus('Đưa mặt vào khung hình', '');
        startScan();
      };

    } catch (err) {
      console.error('[initHuman] Error:', err);
      hideProgress();

      // Phân loại lỗi rõ ràng
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        setStatus('❌ Camera bị chặn! Hãy cấp quyền rồi thử lại.', 'error');
      } else if (err.name === 'NotFoundError') {
        setStatus('❌ Không tìm thấy Camera trên thiết bị.', 'error');
      } else if (String(err).includes('webgl') || String(err).includes('WebGL')) {
        // Tự động fallback sang CPU
        setStatus('⚠️ WebGL không khả dụng, đang dùng CPU...', 'warning');
        retryWithCPU();
        return;
      } else if (String(err).includes('404') || String(err).includes('model')) {
        setStatus('❌ Không tải được models từ CDN. Kiểm tra mạng.', 'error');
      } else {
        setStatus('❌ Lỗi: ' + err.message, 'error');
      }
      reticle.className = 'error';
      showRetry();
    }
  }

  // Fallback CPU khi WebGL lỗi
  async function retryWithCPU() {
    try {
      human.config.backend = 'cpu';
      await human.load();
      await human.warmup();
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' }, audio: false
      });
      video.srcObject = stream;
      video.onloadeddata = () => {
        video.play();
        setStatus('Đưa mặt vào khung hình (CPU mode)', '');
        startScan();
      };
    } catch (err2) {
      setStatus('❌ Lỗi khởi tạo: ' + err2.message, 'error');
      reticle.className = 'error';
      showRetry();
    }
  }

  // ---- Vòng quét chính ----
  function startScan() {
    if (scanInterval) clearInterval(scanInterval);
    isProcessing = false;
    goodFrames   = 0;
    reticle.className = '';
    hideRetry();

    scanInterval = setInterval(async () => {
      if (isProcessing || !human) return;

      const result = await human.detect(video);
      const faces  = result?.face || [];

      // Không thấy mặt
      if (faces.length === 0) {
        setStatus('👀 Không tìm thấy khuôn mặt', 'warning');
        reticle.className = '';
        goodFrames = 0;
        return;
      }

      // Nhiều mặt
      if (faces.length > 1) {
        setStatus('👥 Nhiều người! Hãy đứng 1 mình.', 'warning');
        reticle.className = '';
        goodFrames = 0;
        return;
      }

      const face = faces[0];

      // Kiểm tra khoảng cách (kích thước mặt)
      const videoW = video.videoWidth || 640;
      const faceW  = face.box?.[2] || 0;
      const ratio  = faceW / videoW;

      if (ratio < 0.18) {
        setStatus('👋 Đưa mặt lại GẦN hơn', 'warning');
        reticle.className = ''; goodFrames = 0; return;
      }
      if (ratio > 0.70) {
        setStatus('🤚 Đưa mặt ra XA hơn', 'warning');
        reticle.className = ''; goodFrames = 0; return;
      }

      // Kiểm tra góc nghiêng đầu
      const yaw   = face.rotation?.angle?.yaw   || 0;
      const pitch = face.rotation?.angle?.pitch || 0;
      if (Math.abs(yaw) > 0.28 || Math.abs(pitch) > 0.28) {
        setStatus('👤 Nhìn THẲNG vào camera', 'warning');
        reticle.className = ''; goodFrames = 0; return;
      }

      // Kiểm tra chống giả mạo
      const liveness = face.liveness ?? 1;
      if (liveness < 0.35) {
        setStatus('🚫 Phát hiện ảnh giả mạo!', 'error');
        reticle.className = 'error'; goodFrames = 0; return;
      }

      // Kiểm tra embedding tồn tại
      if (!face.embedding || face.embedding.length === 0) {
        setStatus('⏳ Đang phân tích khuôn mặt...', '');
        return;
      }

      // Tích lũy frame tốt
      goodFrames++;
      reticle.className = 'active';
      setStatus(`✅ Giữ yên... (${goodFrames}/3)`, 'success');

      if (goodFrames < 3) return;

      // Đủ 3 frame liên tiếp — xử lý
      clearInterval(scanInterval);
      isProcessing = true;

      const embedding = Array.from(face.embedding);

      if (workMode === 'ENROLL') {
        doEnroll(embedding);
      } else {
        doVerify(embedding);
      }

    }, 350);
  }

  // ---- Đăng ký khuôn mặt ----
  function doEnroll(embedding) {
    setStatus('⏳ Đang lưu sinh trắc học...', 'warning');
    send('ENROLL', { maNV, descriptor: JSON.stringify(embedding) });
  }

  // ---- Xác thực khuôn mặt ----
  function doVerify(currentEmbedding) {
    setStatus('⏳ Đang đối chiếu...', 'warning');

    if (!faceData) {
      setStatus('❌ Chưa có dữ liệu khuôn mặt!', 'error');
      reticle.className = 'error';
      showRetry();
      return;
    }

    // human.match.similarity trả về 0→1, cao hơn = giống hơn
    // Ngưỡng > 0.60 là khớp
    const similarity = human.match.similarity(currentEmbedding, faceData);
    console.log('[FaceVerify] Similarity:', similarity);

    if (similarity > 0.60) {
      setStatus('✅ Nhận diện thành công!', 'success');
      reticle.className = 'active';
      send('VERIFIED', { maNV, distance: similarity });
      stopCamera();
    } else {
      setStatus(`❌ Không khớp! (${(similarity * 100).toFixed(1)}%)`, 'error');
      reticle.className = 'error';
      showRetry();
      send('FAILED', { maNV, distance: similarity });
    }
  }

  // ---- Nút Thử Lại ----
  btnRetry.onclick = () => {
    hideRetry();
    // Camera đã tắt thì khởi động lại toàn bộ
    if (!video.srcObject || !video.srcObject.active) {
      initHuman();
    } else {
      startScan();
    }
  };
</script>
</body>
</html>
