            const [toast, setToast] = useState({ open: false, msg: '', severity: 'success' });
            const isMobile = useMediaQuery(theme.breakpoints.down('sm'));
            
            const loadData = () => {
                setLoading(true);
                callServer('getSalaryBoard', month, year).then(res => {
                    setData(res || []);
                    setLoading(false);
                }).catch(() => setLoading(false));
            };

            useEffect(() => {
                loadData();
            }, [month, year]);

            const handleGenerate = () => {
                setGenerating(true);
                setToast({ open: true, msg: 'Đang tạo bảng lương, vui lòng chờ...', severity: 'info' });
                callServer('generateSalaryBoard', month, year).then(res => {
                    setGenerating(false);
                    if (res && res.success) {
                        setData(res.data);
                        setToast({ open: true, msg: 'Đã tạo bảng lương dự kiến. Vui lòng kiểm tra và Lưu.', severity: 'success' });
                    } else {
                        setToast({ open: true, msg: (res && res.message) || 'Bảng lương tháng này đã lưu, không thể tính lại.', severity: 'warning' });
                    }
                }).catch(() => {
                    setGenerating(false);
                    setToast({ open: true, msg: 'Lỗi khi tạo bảng lương', severity: 'error' });
                });
            };

            const handleSave = () => {
                if (!data || data.length === 0) return;
                setSaving(true);
                callServer('saveSalaryBoard', data).then(res => {
                    setSaving(false);
                    if (res.success) {
                        setToast({ open: true, msg: 'Đã lưu bảng lương chính thức', severity: 'success' });
                        loadData();
                    } else {
                        setToast({ open: true, msg: res.message, severity: 'error' });

                    setSaving(false);
                    setToast({ open: true, msg: 'Lỗi kết nối', severity: 'error' });

                                    <CardContent>
                                        <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 1 }}>
                                            <Box>
                                                <Typography variant="subtitle1" fontWeight="bold">{row.hoTen}</Typography>
                                                <Typography variant="body2" color="textSecondary">{row.maNV} • {row.ngayCong} ngày công</Typography>
                                            </Box>
                                            <Chip label={row.trangThai} size="small" color={row.trangThai === 'Đã Thanh Toán' ? 'success' : 'warning'} />

                                        <Grid container spacing={1} sx={{ mb: 2 }}>
                                            <Grid item xs={6}><Typography variant="caption" color="textSecondary">Lương CB</Typography><Typography variant="body2">{formatCurrency(row.luongCoBan)}</Typography></Grid>
                                            <Grid item xs={6}><Typography variant="caption" color="textSecondary">Phụ cấp</Typography><Typography variant="body2">{formatCurrency(row.phuCap)}</Typography></Grid>
                                            <Grid item xs={6}><Typography variant="caption" color="textSecondary">Khấu trừ</Typography><Typography variant="body2" color="error">{formatCurrency(row.khauTru)}</Typography></Grid>
                                            <Grid item xs={6}><Typography variant="caption" color="textSecondary">Tổng nhận</Typography><Typography variant="body2" fontWeight="bold" color="primary">{formatCurrency(row.tongLuong)}</Typography></Grid>
                                        </Grid>
                                        <FormControl fullWidth size="small">

                                                onChange={e => handleChangeStatus(row.maNV, e.target.value)}
                                                sx={{ mb: 1, color: row.trangThai === 'Đã Thanh Toán' ? 'success.main' : 'warning.main' }}
                                            >
                                                <MenuItem value="Chưa Thanh Toán">Chưa Thanh Toán</MenuItem>
                                                <MenuItem value="Đã Thanh Toán">Đã Thanh Toán</MenuItem>
                                            </Select>
                                        </FormControl>
                                        <Typography variant="caption" color="textSecondary" display="block">Ghi chú: {row.ghiChu}</Typography>
                                    </CardContent>
                                </Card>
                            ))}
                        </Box>
                    ) : (
                        <Paper sx={{ overflow: 'hidden', borderRadius: 2 }}>
                            <TableContainer sx={{ maxHeight: '70vh' }}>
                                <Table stickyHeader size="small">
                                    <TableHead>
                                        <TableRow>
                                            <TableCell>Mã NV</TableCell>
                                            <TableCell sx={{minWidth: 150}}>Họ Tên</TableCell>
                                            <TableCell align="center">Ngày Công</TableCell>
                                            <TableCell align="right">Lương Cơ Bản</TableCell>
                                            <TableCell align="right">Phụ Cấp</TableCell>
                                            <TableCell align="right">Khấu Trừ</TableCell>
                                            <TableCell align="right">Tổng Nhận</TableCell>
                                            <TableCell>Trạng Thái</TableCell>
                                            <TableCell sx={{minWidth: 150}}>Ghi Chú</TableCell>
                                        </TableRow>
                                    </TableHead>
                                    <TableBody>
                                        {loading ? (
                                            <TableRow><TableCell colSpan={9} align="center" sx={{py: 3}}><CircularProgress size={24} /></TableCell></TableRow>
                                        ) : data.length === 0 ? (
                                            <TableRow><TableCell colSpan={9} align="center" sx={{py: 3, color: 'text.secondary'}}>Chưa có dữ liệu tháng này. Bấm "Tính Lương" để tạo.</TableCell></TableRow>
                                        ) : data.map((row, idx) => (
                                            <TableRow key={idx} hover sx={{ bgcolor: row.trangThai === 'Đã Thanh Toán' ? '#f0fdf4' : 'inherit' }}>
                                                <TableCell>{row.maNV}</TableCell>
                                                <TableCell>{row.hoTen}</TableCell>
                                                <TableCell align="center">{row.ngayCong}</TableCell>
                                                <TableCell align="right">{formatCurrency(row.luongCoBan)}</TableCell>
                                                <TableCell align="right">{formatCurrency(row.phuCap)}</TableCell>
                                                <TableCell align="right" sx={{color: 'error.main'}}>{formatCurrency(row.khauTru)}</TableCell>
                                                <TableCell align="right" sx={{fontWeight: 'bold', color: 'primary.main'}}>{formatCurrency(row.tongLuong)}</TableCell>
                                                <TableCell>
                                                    <Select
                                                        size="small"
                                                        value={row.trangThai || 'Chưa Thanh Toán'}
                                                        onChange={e => handleChangeStatus(row.maNV, e.target.value)}
                                                        sx={{
                                                            minWidth: 150,
                                                            color: row.trangThai === 'Đã Thanh Toán' ? 'success.main' : 'warning.main',
                                                            '& .MuiOutlinedInput-notchedOutline': { borderColor: 'transparent' }
                                                        }}
                                                    >
                                                        <MenuItem value="Chưa Thanh Toán">Chưa Thanh Toán</MenuItem>
                                                        <MenuItem value="Đã Thanh Toán">Đã Thanh Toán</MenuItem>
                                                    </Select>
                                                </TableCell>
                                                <TableCell><Typography variant="caption">{row.ghiChu}</Typography></TableCell>
                                            </TableRow>
                                        ))}
                                    </TableBody>
                                </Table>
                            </TableContainer>
                        </Paper>
                    )}
                    <Snackbar open={toast.open} autoHideDuration={4000} onClose={() => setToast({ ...toast, open: false })}>
                        <Alert severity={toast.severity} variant="filled">{toast.msg}</Alert>
                    </Snackbar>
                </Box>
            );
        };

// --- LOGIN COMPONENT ---
        const Login = ({ onSuccess }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            // Đăng nhập bằng Tài khoản/Mật khẩu (Cũ)
            const handleLogin = () => {
                if (!username || !password) {
                    setError('Vui lòng nhập đầy đủ thông tin');
                    return;
                }
                setLoading(true);
                setError('');
                callServer('login', username, password).then(res => {
                    setLoading(false);
                    if (res.success) {
                        onSuccess(res);
                    } else {
                        setError(res.message || 'Đăng nhập thất bại');
                    }
                }).catch(err => {
                    setLoading(false);
                    setError('Lỗi kết nối');
                });
            };

            // Đăng nhập bằng Google Firebase
            const handleGoogleLogin = () => {
                setLoading(true);
                setError('');
                auth.signInWithPopup(googleProvider)
                    .then((result) => {
                        const email = result.user.email;
                        
                        // Gọi xuống Apps Script kiểm tra email
                        callServer('loginWithGoogle', email).then(res => {
                            setLoading(false);
                            if (res && res.success) {
                                onSuccess(res);
                            } else {
                                setError(res.message || 'Email này chưa được cấp quyền truy cập!');
                                auth.signOut(); // Đăng xuất nếu không có quyền
                            }
                        }).catch(() => {
                            setLoading(false);
                            setError('Lỗi kết nối server khi kiểm tra quyền.');
                            auth.signOut();
                        });
                    })
                    .catch((error) => {
                        setLoading(false);
                        setError('Lỗi đăng nhập Google: ' + error.message);
                    });
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') handleLogin();
            };

            return (
                <Box sx={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', bgcolor: '#f3f4f6' }}>
                    <Container maxWidth="xs">
                        <Zoom in={true} style={{ transitionDelay: '100ms' }}>
                            <Card sx={{ p: 4, borderRadius: 4, boxShadow: '0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1)' }}>
                                <Box sx={{ textAlign: 'center', mb: 4 }}>
                                    <Box sx={{ width: 64, height: 64, bgcolor: theme.palette.primary.main, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', mx: 'auto', mb: 2, boxShadow: '0 4px 6px -1px rgba(79, 70, 229, 0.4)' }}>
                                        <span className="material-icons" style={{ fontSize: 32, color: 'white' }}>lock</span>
                                    </Box>
                                    <Typography variant="h5" fontWeight="800" color="textPrimary" sx={{ letterSpacing: '-0.5px' }}>Đăng Nhập Quản Lý Ký Túc Xá</Typography>
                                    <Typography variant="body2" color="textSecondary" sx={{ mt: 1 }}>Hệ thống quản lý nội bộ</Typography>
                                </Box>

                                <Stack spacing={3}>
                                    {error && (
                                        <Zoom in={true}><Alert severity="error" variant="filled" sx={{ borderRadius: 2 }}>{error}</Alert></Zoom>
                                    )}
                                    <TextField
                                        label="Tên đăng nhập"
                                        fullWidth
                                        variant="outlined"
                                        value={username}
                                        onChange={e => setUsername(e.target.value)}
                                        onKeyDown={handleKeyDown}
                                        InputProps={{
                                            startAdornment: <span className="material-icons" style={{ color: '#9ca3af', marginRight: 8 }}>person</span>,
                                            sx: { borderRadius: 2 }
                                        }}
                                    />
                                    <TextField
                                        label="Mật khẩu"
                                        type="password"
                                        fullWidth
                                        variant="outlined"
                                        value={password}
                                        onChange={e => setPassword(e.target.value)}
                                        onKeyDown={handleKeyDown}
                                        InputProps={{
                                            startAdornment: <span className="material-icons" style={{ color: '#9ca3af', marginRight: 8 }}>key</span>,
                                            sx: { borderRadius: 2 }
                                        }}
                                    />
                                    <Button
                                        variant="contained"
                                        size="large"
                                        onClick={handleLogin}
                                        disabled={loading}
                                        sx={{
                                            py: 1.5,
                                            borderRadius: 2,
                                            fontWeight: 700,
                                            fontSize: '1rem',
                                            bgcolor: theme.palette.primary.main,
                                            '&:hover': { bgcolor: theme.palette.primary.dark }
                                        }}
                                    >
                                        {loading ? <CircularProgress size={24} color="inherit" /> : 'ĐĂNG NHẬP'}
                                    </Button>

                                    <Divider><Typography variant="caption" color="textSecondary">HOẶC</Typography></Divider>

                                    <Button 
                                        variant="outlined" 
                                        size="large" 
                                        onClick={handleGoogleLogin} 
                                        disabled={loading} 
                                        sx={{ 
                                            py: 1.5, 
                                            borderRadius: 2, 
                                            fontWeight: 600, 
                                            color: '#374151', 
                                            borderColor: '#d1d5db', 
                                            '&:hover': { bgcolor: '#f9fafb' } 
                                        }}
                                    >
                                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style={{width: 20, marginRight: 10}} alt="Google"/>
                                        Đăng nhập bằng Google
                                    </Button>
                                </Stack>
                            </Card>
                        </Zoom>
                    </Container>
                </Box>
            );
        };

        const GlobalLoading = ({ open }) => (
            <Backdrop
                sx={{
                    color: '#fff',
                    zIndex: (theme) => theme.zIndex.drawer + 999,
                    backdropFilter: 'blur(4px)',
                    backgroundColor: 'rgba(255, 255, 255, 0.4)'
                }}
                open={open}
            >
                <Box sx={{
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: 'center',
                    gap: 3,
                    p: 5,
                    borderRadius: 4,
                    bgcolor: 'rgba(255,255,255,0.9)',
                    boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1)'
                }}>
                    <CircularProgress size={60} thickness={4} sx={{ color: '#4338ca' }} />
                    <Typography variant="h6" sx={{ color: '#3730a3', fontWeight: 600, letterSpacing: 0.5 }}>
                        Đang tải dữ liệu...
                    </Typography>
                </Box>
            </Backdrop>
        );

        const App = () => {
            const [view, setView] = useState('dashboard');
            // User Data State - Restore from localStorage if available
            const [user, setUser] = useState(() => {
                try {
                    const saved = localStorage.getItem('hrms_user');
                    return saved ? JSON.parse(saved) : null;
                } catch (e) {
                    return null;
                }
            });

            const [data, setData] = useState({
                stats: { totalEmployees: 0, presentToday: 0, onLeaveToday: 0, pendingLeaves: 0, charts: { growth: [], dept: [], leaveStatus: [], leaveType: [], position: [] } },
                employees: [], leaves: [], departments: [], positions: [], attendance: [], settings: {}
            });
            const [loading, setLoading] = useState(false);

            // Confirm Dialog State
            const [confirmState, setConfirmState] = useState({ open: false, title: '', content: '', onConfirm: () => { } });

            // ... (rest of App state) ...

            const confirmAction = (title, content, action) => {
                setConfirmState({ open: true, title, content, onConfirm: () => { action(); setConfirmState(prev => ({ ...prev, open: false })); } });
            };

            // Fetch Data Function - Triggered only after login
            const fetchData = () => {
                setLoading(true);
                fetchAllData().then(res => {
                    if (!res) {
                        setLoading(false);
                        return;
                    }
                    setData({
                        stats: res.dashboardStats || {},
                        employees: res.employees || [],
                        leaves: res.leaves || [],
                        departments: res.departments || [],
                        positions: res.positions || [],
                        attendance: res.attendance || [],
                        settings: res.settings || {}
                    });
                    setLoading(false);
                }).catch(err => { console.error(err); setLoading(false); });
            };

            // Fetch data when user logs in
            useEffect(() => {
                if (user) {
                    fetchData();
                    // Set default view based on role
                    if (user.role === 'EMPLOYEE') setView('gps_checkin');
                    else setView('dashboard');
                }
            }, [user]);

            // Refresh data when entering Dashboard
            useEffect(() => {
                if (user && view === 'dashboard') {
                    fetchData();
                }
            }, [view]);

            // Helper to update parts of state
            const setEmployees = (newValOrFunc) => setData(prev => ({ ...prev, employees: typeof newValOrFunc === 'function' ? newValOrFunc(prev.employees) : newValOrFunc }));
            const setLeaves = (newValOrFunc) => setData(prev => ({ ...prev, leaves: typeof newValOrFunc === 'function' ? newValOrFunc(prev.leaves) : newValOrFunc }));
            const setDepartments = (newValOrFunc) => setData(prev => ({ ...prev, departments: typeof newValOrFunc === 'function' ? newValOrFunc(prev.departments) : newValOrFunc }));
            const setPositions = (newValOrFunc) => setData(prev => ({ ...prev, positions: typeof newValOrFunc === 'function' ? newValOrFunc(prev.positions) : newValOrFunc }));

            const ctxValue = { ...data, loading, setLoading, setEmployees, setLeaves, setDepartments, setPositions, confirmAction, user };

            // Render Login if not authenticated
            if (!user) {
                return (
                    <ThemeProvider theme={theme}>
                        <CssBaseline />
                        <Login onSuccess={(res) => {
                            const userData = { ...res.user, role: res.role };
                            localStorage.setItem('hrms_user', JSON.stringify(userData));
                            setUser(userData);
                        }} />
                    </ThemeProvider>
                );
            }

            return (
                <DataContext.Provider value={ctxValue}>
                    <ThemeProvider theme={theme}>
                        <CssBaseline />
                        <MainLayout setView={setView} currentView={view} user={user} setUser={setUser} settings={data.settings}>
                            {user.role === 'ADMIN' && view === 'dashboard' && <Dashboard />}
                            {user.role === 'ADMIN' && view === 'timekeeping' && <Timekeeping />}
                            {user.role === 'ADMIN' && view === 'calendar' && <CalendarView />}
                            {user.role === 'ADMIN' && view === 'employees' && <EmployeeList />}
                            {user.role === 'ADMIN' && view === 'departments' && <DepartmentManager />}
                            {user.role === 'ADMIN' && view === 'positions' && <PositionManager />}
                            {user.role === 'ADMIN' && view === 'salary_settings' && <SalarySettings />}
                            {user.role === 'ADMIN' && view === 'salary_calculation' && <SalaryBoard />}
                            {user.role === 'ADMIN' && view === 'gps_settings' && <GPSSettings />}
                            {user.role === 'EMPLOYEE' && view === 'gps_checkin' && <GPSCheckIn />}
                            {((user.role === 'ADMIN' && view === 'leave') || (user.role === 'EMPLOYEE' && view === 'leave')) && <LeaveRequests />}
                        </MainLayout>
                        <ConfirmDialog open={confirmState.open} title={confirmState.title} content={confirmState.content} onConfirm={confirmState.onConfirm} onCancel={() => setConfirmState(prev => ({ ...prev, open: false }))} />
                        <GlobalLoading open={loading} />
                    </ThemeProvider>
                </DataContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
