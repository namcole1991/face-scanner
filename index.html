const callServer = async (func, ...args) => {
    try {
        const response = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: func, args: args })
        });
        
        const json = await response.json();
        if (json.success) {
            return json.data;
        } else {
            throw new Error(json.error);
        }
    } catch (err) {
        console.error(`[API Error] calling ${func}:`, err);
        throw err;
    }
};

        const GenericSimpleManager = ({ title, fetchFunc, addFunc, deleteFunc, idField, nameField, labelId, labelName }) => {
            const { departments, setDepartments, positions, setPositions, confirmAction } = React.useContext(DataContext);
            const [items, setItems] = useState([]); // Local state for items, will be updated from context if needed
            const [loading, setLoading] = useState(true); // Local loading for initial fetch
            const [open, setOpen] = useState(false);
            const [form, setForm] = useState({ id: '', name: '', desc: '' });
            const [toast, setToast] = useState({ open: false, msg: '' });
            const isMobile = useMediaQuery(theme.breakpoints.down('sm'));

            // Determine which data to use from context
            useEffect(() => {
                if (fetchFunc === 'getDepartments') {
                    setItems(departments);
                } else if (fetchFunc === 'getPositions') {
                    setItems(positions);
                }
                setLoading(false); // Data is loaded via App component's getAllData
            }, [departments, positions, fetchFunc]);


            const handleSubmit = () => {
                const payload = { [idField]: form.id, [nameField]: form.name, moTa: form.desc };

                // Optimistic UI Update
                const tempId = Date.now();
                const newItem = { ...payload, [idField]: form.id || `temp-${tempId}` };

                if (fetchFunc === 'getDepartments') {
                    setDepartments(prev => [newItem, ...prev]);
                } else if (fetchFunc === 'getPositions') {
                    setPositions(prev => [newItem, ...prev]);
                }

                setOpen(false); setForm({ id: '', name: '', desc: '' });
                setToast({ open: true, msg: 'Đang xử lý...' });

                callServer(addFunc, payload).then(() => {
                    setToast({ open: true, msg: 'Thành công!' });
                    // Re-fetch all data to ensure consistency, or update context directly if server returns full object
                    fetchAllData().then(data => {
                        if (fetchFunc === 'getDepartments') setDepartments(data.departments);
                        if (fetchFunc === 'getPositions') setPositions(data.positions);
                    });
                }).catch(() => {
                    setToast({ open: true, msg: 'Lỗi khi thêm!' });
                    // Revert optimistic update
                    if (fetchFunc === 'getDepartments') {
                        setDepartments(prev => prev.filter(item => item[idField] !== newItem[idField]));
                    } else if (fetchFunc === 'getPositions') {
                        setPositions(prev => prev.filter(item => item[idField] !== newItem[idField]));
                    }
                });
            };

            const handleDelete = (id) => {
                const performDelete = () => {
                    // Optimistic UI Update
                    const prevItems = [...items];
                    if (fetchFunc === 'getDepartments') {
                        setDepartments(prev => prev.filter(item => item[idField] !== id));
                    } else if (fetchFunc === 'getPositions') {
                        setPositions(prev => prev.filter(item => item[idField] !== id));
                    }
                    setToast({ open: true, msg: 'Đang xóa...' });

                    callServer(deleteFunc, id).then(() => {
                        setToast({ open: true, msg: 'Đã xóa!' });
                        // Re-fetch all data to ensure consistency
                        fetchAllData().then(data => {
                            if (fetchFunc === 'getDepartments') setDepartments(data.departments);
                            if (fetchFunc === 'getPositions') setPositions(data.positions);
                        });
                    }).catch(() => {
                        setToast({ open: true, msg: 'Lỗi khi xóa!' });
                        // Revert optimistic update
                        if (fetchFunc === 'getDepartments') {
                            setDepartments(prevItems);
                        } else if (fetchFunc === 'getPositions') {
                            setPositions(prevItems);

            const checkDuplicate = (field, value) => {
                if (!value) return false;
                return employees.some(e => 
                    e[field] && e[field].toLowerCase() === value.toLowerCase() && 
                    (mode === 'add' || e.maNV !== form.maNV) 
                );
            };

            const isDuplicateMSSV = checkDuplicate('maNV', form.maNV);
            const isDuplicateCCCD = checkDuplicate('cccd', form.cccd);

            const isDuplicateEmail = checkDuplicate('email', form.email);

            const isMissingRequiredFields = 
                !form.maNV || !form.hoTen || !form.cccd || !form.soDienThoai || 
                !form.namSinh || !form.email || !form.queQuan || 
                !form.danToc || !form.tonGiao || !form.dienChinhSach || 
                !form.phongBan || !form.chucVu || !form.ngayVaoLam ||

                    queQuan: '', cccd: '', danToc: 'Kinh', tonGiao: 'Không', dienChinhSach: '10. Khác',

            const handleSubmit = () => {

                } else {

            // Optimistic Approve
            const handleApprove = (id, status) => {
                const action = status === 'Đã Duyệt' ? 'Duyệt' : 'Từ chối';

                const performApprove = () => {
                    const prev = [...leaves];
                    const newLeaves = leaves.map(l => l.maDon === id ? { ...l, trangThai: status } : l);
                    setLeaves(newLeaves);
                    setToast({ open: true, msg: 'Đang cập nhật...' });

                    callServer('approveLeaveRequest', id, status).then(() => {
                        setToast({ open: true, msg: `Đã ${action} thành công!` });
                    }).catch(() => {
                        setLeaves(prev);
                        setToast({ open: true, msg: 'Lỗi cập nhật!' });
                    });
                }

                confirmAction(`Xác nhận ${action}`, `Bạn có chắc chắn muốn ${action.toLowerCase()} đơn này không?`, performApprove);
            };

            // Standard Add
            const handleSubmit = () => {
                // For employee, auto-fill maNV if missing (though form usually has it)
                const submitForm = { ...form, maNV: user.role === 'EMPLOYEE' ? user.maNV : form.maNV };

                if (!submitForm.maNV || !submitForm.tuNgay || !submitForm.denNgay) return;

                const tempRequest = { ...submitForm, maDon: `temp-${Date.now()}`, trangThai: 'Chờ Duyệt', ngayTao: new Date().toISOString().split('T')[0] };
                const prev = [...leaves];

                    if (res && !res.success) {

                        setLeaves(prev); // Revert optimistic update
                        return;

                    setToast({ open: true, msg: 'Đã gửi đơn!' });

        const CalendarView = () => {

            const [selectedDay, setSelectedDay] = useState(null);

                const month = currentDate.month() + 1;
                callServer('getCalendarEvents', month, year).then(res => {
                    if (res) {
                        setHolidays(res.holidays || []);
                        setAttendance(res.attendance || []);
                        setLocalLeaves(res.leaves || []);
                    }
                }).catch(console.error);
            }, [currentDate]);

            // Calendar Logic
            const startOfMonth = currentDate.clone().startOf('month');
            const endOfMonth = currentDate.clone().endOf('month');
            const emptySlots = startOfMonth.day() === 0 ? 6 : startOfMonth.day() - 1;

            const daysInMonth = currentDate.daysInMonth();

            const days = [];
            for (let i = 0; i < emptySlots; i++) days.push(null);
            for (let i = 1; i <= daysInMonth; i++) {
                days.push(currentDate.clone().date(i));
            }

            const prevMonth = () => setCurrentDate(prev => prev.clone().subtract(1, 'months'));
            const nextMonth = () => setCurrentDate(prev => prev.clone().add(1, 'months'));
            const goToToday = () => setCurrentDate(moment());

            const getEventsForDay = (dateMoment) => {
                if (!dateMoment) return { leaves: [], holiday: null, attendanceIssues: [], summary: { leave: 0, late: 0, absent: 0 } };

                const dateStr = dateMoment.format('YYYY-MM-DD');

                // Holiday Check
                const holiday = holidays.find(h => h.date === dateStr);

                // Leave Check
                // Leave Check
                const dayLeaves = localLeaves.filter(l => {
                    if (!l.trangThai || l.trangThai.trim() !== 'Đã Duyệt') return false;
                    // Backend sends YYYY-MM-DD strings. dateStr is also YYYY-MM-DD.
                    // String comparison is sufficient and robust for yyyy-mm-dd format.
                    return dateStr >= l.tuNgay && dateStr <= l.denNgay;
                });

                // Attendance Check
                const dayAtt = attendance.filter(a => a.date === dateStr);
                const issues = dayAtt.filter(a => a.trangThai === 'Vắng' || a.trangThai === 'Đi Muộn');

                return {
                    leaves: dayLeaves,
                    holiday,
                    attendanceIssues: issues,
                    summary: {
                        leave: dayLeaves.length,
                        late: issues.filter(x => x.trangThai === 'Đi Muộn').length,
                        absent: issues.filter(x => x.trangThai === 'Vắng').length,
                    }
                };
            };

            const handleDayClick = (dateMoment) => {
                if (!dateMoment) return;
                const events = getEventsForDay(dateMoment);
                setSelectedDay({
                    date: dateMoment.toDate(), // keep for dialog title
                    ...events
                });
                setOpenDialog(true);
            };

            const dayNames = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];

            return (
                <Box>
                    <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', mb: 3 }}>
                        <Typography variant="h5" color="textPrimary">Lịch Làm Việc</Typography>
                        <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                            <Button size="small" variant="outlined" onClick={goToToday} sx={{ mr: 1 }}>Hôm nay</Button>
                            <IconButton onClick={prevMonth}><span className="material-icons">chevron_left</span></IconButton>
                            <Typography variant="h6" sx={{ minWidth: 140, textAlign: 'center' }}>Tháng {currentDate.format('M / YYYY')}</Typography>
                            <IconButton onClick={nextMonth}><span className="material-icons">chevron_right</span></IconButton>
                        </Box>
                    </Box>

                    <Paper sx={{ p: 2, borderRadius: 3 }}>
                        <Grid container spacing={1} sx={{ mb: 1 }}>
                            {dayNames.map((d, i) => (
                                <Grid item xs={1.7} key={i}>
                                    <Box sx={{ p: 1, textAlign: 'center', fontWeight: 'bold', color: '#6b7280', bgcolor: '#f3f4f6', borderRadius: 1 }}>{d}</Box>
                                </Grid>
                            ))}
                        </Grid>

                        <Grid container spacing={1}>
                            {days.map((dateMoment, i) => {
                                const { holiday, summary } = getEventsForDay(dateMoment);
                                const isToday = dateMoment && dateMoment.isSame(moment(), 'day');
                                const isWeekend = dateMoment && (dateMoment.day() === 0 || dateMoment.day() === 6);

                                return (
                                    <Grid item xs={1.7} key={i}>
                                        <Paper
                                            variant="outlined"
                                            sx={{
                                                height: 110,
                                                p: 1,
                                                bgcolor: !dateMoment ? 'transparent' : (isToday ? '#eff6ff' : '#fff'),
                                                borderColor: isToday ? 'primary.main' : '#e5e7eb',
                                                borderStyle: !dateMoment ? 'none' : 'solid',
                                                cursor: dateMoment ? 'pointer' : 'default',
                                                display: 'flex',
                                                flexDirection: 'column',
                                                overflow: 'hidden',
                                                transition: 'all 0.2s',
                                                '&:hover': { bgcolor: dateMoment ? '#f9fafb' : 'transparent', boxShadow: dateMoment ? 1 : 0 }
                                            }}
                                            onClick={() => handleDayClick(dateMoment)}
                                        >
                                            {dateMoment && (
                                                <>
                                                    <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.5 }}>
                                                        <Typography variant="body2" fontWeight={isToday ? 'bold' : 'normal'} color={isToday ? 'primary' : isWeekend ? 'error' : 'textPrimary'}>
                                                            {dateMoment.date()}
                                                        </Typography>
                                                    </Box>

                                                    <Box sx={{ display: 'flex', flexDirection: 'column', gap: 0.5 }}>
                                                        {holiday && (
                                                            <Chip label={holiday.name} size="small" sx={{ height: 20, fontSize: 10, bgcolor: '#fee2e2', color: '#dc2626', fontWeight: 600 }} />
                                                        )}

                                                        {/* SUMMARY CHIPS */}
                                                        {summary.leave > 0 && (
                                                            <Chip label={`${summary.leave} Nghỉ`} size="small" sx={{ height: 20, fontSize: 10, bgcolor: '#fff7ed', color: '#c2410c', border: '1px solid #ffedd5', justifyContent: 'flex-start', px: 0.5, '& .MuiChip-label': { px: 1 } }} />
                                                        )}
                                                        {summary.late > 0 && (
                                                            <Chip label={`${summary.late} Muộn`} size="small" sx={{ height: 20, fontSize: 10, bgcolor: '#fef9c3', color: '#854d0e', border: '1px solid #facc15', justifyContent: 'flex-start', px: 0.5, '& .MuiChip-label': { px: 1 } }} />
                                                        )}
                                                        {summary.absent > 0 && (
                                                            <Chip label={`${summary.absent} Vắng`} size="small" sx={{ height: 20, fontSize: 10, bgcolor: '#fee2e2', color: '#991b1b', border: '1px solid #fca5a5', justifyContent: 'flex-start', px: 0.5, '& .MuiChip-label': { px: 1 } }} />
                                                        )}
                                                    </Box>
                                                </>
                                            )}
                                        </Paper>
                                    </Grid>
                                );
                            })}
                        </Grid>
                    </Paper>

                    {/* DETAIL DIALOG */}
                    <Dialog open={openDialog} onClose={() => setOpenDialog(false)} maxWidth="xs" fullWidth PaperProps={{ sx: { borderRadius: 3 } }}>
                        <DialogTitle sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                            <span className="material-icons" style={{ color: '#3b82f6' }}>calendar_today</span>
                            {selectedDay?.date && `Ngày ${selectedDay.date.getDate()} tháng ${selectedDay.date.getMonth() + 1}`}
                        </DialogTitle>
                        <Divider />
                        <DialogContent>
                            {selectedDay?.holiday && (
                                <Box sx={{ mb: 2, p: 1.5, bgcolor: '#fef2f2', borderRadius: 2, color: '#dc2626', display: 'flex', alignItems: 'center', gap: 1 }}>
                                    <span className="material-icons" style={{ fontSize: 20 }}>celebration</span>
                                    <Typography variant="subtitle2" fontWeight="bold">{selectedDay.holiday.name}</Typography>
                                </Box>
                            )}

                            {/* LEAVES LIST */}
                            {selectedDay?.leaves.length > 0 && (
                                <Box sx={{ mb: 2 }}>
                                    <Typography variant="subtitle2" sx={{ mb: 1, fontWeight: 'bold' }}>Nghỉ Phép ({selectedDay.leaves.length})</Typography>
                                    <List dense sx={{ bgcolor: '#fff7ed', borderRadius: 2 }}>
                                        {selectedDay.leaves.map((l, i) => {
                                            const emp = employees.find(e => e.maNV === l.maNV);
                                            return (
                                                <ListItem key={i}>
                                                    <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5 }}>
                                                        <Avatar sx={{ width: 28, height: 28, fontSize: 12, bgcolor: '#f97316' }}>{emp?.hoTen?.charAt(0)}</Avatar>
                                                        <Box>
                                                            <Typography variant="body2" fontWeight="600">{emp?.hoTen}</Typography>
                                                            <Typography variant="caption" display="block" color="textSecondary">{l.loaiNghi}</Typography>
                                                        </Box>
                                                    </Box>
                                                </ListItem>
                                            );
                                        })}
                                    </List>
                                </Box>
                            )}

                            {/* ATTENDANCE ISSUES LIST */}
                            {selectedDay?.attendanceIssues.length > 0 && (
                                <Box>
                                    <Typography variant="subtitle2" sx={{ mb: 1, fontWeight: 'bold' }}>Vắng / Đi Muộn ({selectedDay.attendanceIssues.length})</Typography>
                                    <List dense sx={{ bgcolor: '#fef2f2', borderRadius: 2 }}>
                                        {selectedDay.attendanceIssues.map((a, i) => {
                                            const emp = employees.find(e => e.maNV === a.maNV);
                                            const isLate = a.trangThai === 'Đi Muộn';
                                            return (
                                                <ListItem key={i}>
                                                    <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5 }}>
                                                        <Avatar sx={{ width: 28, height: 28, fontSize: 12, bgcolor: isLate ? '#eab308' : '#ef4444' }}>{emp?.hoTen?.charAt(0)}</Avatar>
                                                        <Box>
                                                            <Typography variant="body2" fontWeight="600">{emp?.hoTen}</Typography>
                                                            <Typography variant="caption" display="block" color="textSecondary">{isLate ? 'Đi Muộn' : 'Vắng mặt'}</Typography>
                                                        </Box>
                                                    </Box>
                                                </ListItem>
                                            );
                                        })}
                                    </List>
                                </Box>
                            )}

                            {/* EMPTY STATE */}
                            {(!selectedDay?.leaves.length && !selectedDay?.attendanceIssues.length && !selectedDay?.holiday) && (
                                <Box sx={{ p: 4, textAlign: 'center', color: 'text.secondary' }}>
                                    <Typography variant="body2">Không có sự kiện đặc biệt hôm nay.</Typography>
                                </Box>
                            )}

                        </DialogContent>
                        <DialogActions>
                            <Button onClick={() => setOpenDialog(false)}>Đóng</Button>
                        </DialogActions>
                    </Dialog>
                </Box>
            );
        };

        // --- TIMEKEEPING VIEW ---
        const Timekeeping = () => {
            const { employees, leaves } = React.useContext(DataContext);
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [attendanceData, setAttendanceData] = useState({}); // { [maNV]: { trangThai, gioVao, gioRa, ghiChu } }
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState({ open: false, msg: '' });

            // Fetch attendance for date
            useEffect(() => {
                setLoading(true);
                const dateStr = selectedDate.toISOString().split('T')[0];
                callServer('getAttendance', dateStr).then(data => {
                    const mapping = {};
                    data.forEach(x => mapping[x.maNV] = x);
                    setAttendanceData(mapping);
                    setLoading(false);
                }).catch(() => setLoading(false));
            }, [selectedDate]);

            const handleDateChange = (days) => {
                const newDate = new Date(selectedDate);
                newDate.setDate(selectedDate.getDate() + days);
                setSelectedDate(newDate);
            };

            const getEmployeeLeaveStatus = (maNV) => {
                const dateStr = selectedDate.toISOString().split('T')[0];
                const checkDate = new Date(selectedDate);
                checkDate.setHours(0, 0, 0, 0);

                return leaves.find(l => {
                    if (l.maNV !== maNV || l.trangThai !== 'Đã Duyệt') return false;
                    const start = new Date(l.tuNgay); start.setHours(0, 0, 0, 0);
                    const end = new Date(l.denNgay); end.setHours(0, 0, 0, 0);
                    return checkDate >= start && checkDate <= end;
                });
            };

            const handleStatusChange = (maNV, newStatus) => {
                setAttendanceData(prev => ({
                    ...prev,
                    [maNV]: { ...prev[maNV], maNV, trangThai: newStatus }
                }));
            };

            const handleInputChange = (maNV, field, value) => {
                setAttendanceData(prev => ({
                    ...prev,
                    [maNV]: { ...prev[maNV], maNV, [field]: value }
                }));
            };

            const markAllPresent = () => {
                const newData = { ...attendanceData };
                employees.forEach(e => {
                    const leave = getEmployeeLeaveStatus(e.maNV);
                    // Only mark present if not already marked and not on leave
                    if (!newData[e.maNV] && !leave) {
                        newData[e.maNV] = { maNV: e.maNV, trangThai: 'Có Mặt', gioVao: '08:00', gioRa: '17:30', ghiChu: '' };
                    }
                });
                setAttendanceData(newData);
            };

            const handleSave = () => {
                setLoading(true);
                const dateStr = selectedDate.toISOString().split('T')[0];
                // Convert mapping to array
                const records = Object.values(attendanceData).map(x => ({
                    maNV: x.maNV,
                    trangThai: x.trangThai || 'Vắng',
                    gioVao: x.gioVao || '',
                    gioRa: x.gioRa || '',
                    ghiChu: x.ghiChu || ''
                }));

                callServer('saveAttendance', dateStr, records).then(() => {
                    setToast({ open: true, msg: 'Đã lưu Điểm danh!' });
                    setLoading(false);
                }).catch(() => {
                    setToast({ open: true, msg: 'Lỗi khi lưu!' });
                    setLoading(false);
                });
            };

            const isSameDate = (d1, d2) => d1.getDate() === d2.getDate() && d1.getMonth() === d2.getMonth() && d1.getFullYear() === d2.getFullYear();
            const today = new Date();
            const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
            const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);

            return (
                <Box>
                    <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', mb: 3 }}>
                        <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                            <IconButton onClick={() => handleDateChange(-1)} size="small"><span className="material-icons">chevron_left</span></IconButton>
                            <Typography variant="h5" color="textPrimary">Điểm danh {selectedDate.toLocaleDateString('vi-VN')}</Typography>
                            <IconButton onClick={() => handleDateChange(1)} size="small"><span className="material-icons">chevron_right</span></IconButton>
                        </Box>
                        <Box sx={{ display: 'flex', gap: 1 }}>
                            <Button variant={isSameDate(selectedDate, yesterday) ? "contained" : "outlined"} onClick={() => setSelectedDate(yesterday)}>Hôm Qua</Button>
                            <Button variant={isSameDate(selectedDate, today) ? "contained" : "outlined"} onClick={() => setSelectedDate(today)}>Hôm Nay</Button>
                            <Button variant={isSameDate(selectedDate, tomorrow) ? "contained" : "outlined"} onClick={() => setSelectedDate(tomorrow)}>Ngày Mai</Button>
                        </Box>
                    </Box>

                    <Paper sx={{ p: 2, mb: 3, borderRadius: 3 }}>
                        <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', mb: 2 }}>
                            <Typography variant="subtitle1" fontWeight="bold">Danh sách nhân viên</Typography>
                            <Box sx={{ display: 'flex', gap: 1 }}>
                                <Button variant="contained" color="primary" onClick={markAllPresent}>Điểm danh tất cả</Button>
                                <Button variant="contained" color="success" onClick={handleSave} disabled={loading}>
                                    {loading ? <CircularProgress size={24} color="inherit" /> : 'Lưu Dữ Liệu'}
                                </Button>
                            </Box>
                        </Box>

                        <TableContainer sx={{ maxHeight: '60vh' }}>
                            <Table stickyHeader size="small">
                                <TableHead>
                                    <TableRow>
                                        <TableCell>Nhân Viên</TableCell>
                                        <TableCell>Trạng Thái</TableCell>
                                        <TableCell>Giờ Vào - Ra</TableCell>
                                        <TableCell>Ghi Chú</TableCell>
                                    </TableRow>
                                </TableHead>
                                <TableBody>
                                    {employees.length === 0 ? (
                                        <TableRow><TableCell colSpan={4} align="center" sx={{ py: 3, color: 'text.secondary' }}>Chưa có dữ liệu nhân viên để điểm danh</TableCell></TableRow>
                                    ) : employees.map(emp => {
                                        const record = attendanceData[emp.maNV] || {};
                                        const leave = getEmployeeLeaveStatus(emp.maNV);
                                        const status = leave ? 'NghiPhep' : (record.trangThai || '');

                                        return (
                                            <TableRow key={emp.maNV} hover>
                                                <TableCell>
                                                    <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5 }}>
                                                        <Avatar sx={{ width: 32, height: 32 }}>{emp.hoTen.charAt(0)}</Avatar>
                                                        <Box>
                                                            <Typography variant="subtitle2">{emp.hoTen}</Typography>
                                                            <Typography variant="caption" color="textSecondary">{emp.maNV}</Typography>
                                                        </Box>
                                                    </Box>
                                                </TableCell>
                                                <TableCell>
                                                    <Box sx={{ display: 'flex', gap: 0.5 }}>
                                                        <Chip
                                                            label="Có mặt"
                                                            clickable
                                                            color={status === 'Có Mặt' ? 'success' : 'default'}
                                                            onClick={() => !leave && handleStatusChange(emp.maNV, 'Có Mặt')}
                                                            variant={status === 'Có Mặt' ? 'filled' : 'outlined'}
                                                            sx={{ opacity: leave ? 0.5 : 1 }}
                                                        />
                                                        <Chip
                                                            label="Đi muộn"
                                                            clickable
                                                            color={status === 'Đi Muộn' ? 'warning' : 'default'}
                                                            onClick={() => !leave && handleStatusChange(emp.maNV, 'Đi Muộn')}
                                                            variant={status === 'Đi Muộn' ? 'filled' : 'outlined'}
                                                            sx={{ opacity: leave ? 0.5 : 1 }}
                                                        />
                                                        {leave ? (
                                                            <Chip label="Nghỉ Phép" color="info" variant="filled" />
                                                        ) : (
                                                            <Chip
                                                                label="Vắng"
                                                                clickable
                                                                color={status === 'Vắng' ? 'error' : 'default'}
                                                                onClick={() => handleStatusChange(emp.maNV, 'Vắng')}
                                                                variant={status === 'Vắng' ? 'filled' : 'outlined'}
                                                            />
                                                        )}
                                                    </Box>
                                                </TableCell>
                                                <TableCell>
                                                    <Box sx={{ display: 'flex', gap: 1, alignItems: 'center' }}>
                                                        <TextField
                                                            type="time"
                                                            size="small"
                                                            variant="standard"
                                                            value={record.gioVao || ''}
                                                            onChange={(e) => handleInputChange(emp.maNV, 'gioVao', e.target.value)}
                                                            disabled={status !== 'Có Mặt' && status !== 'Đi Muộn'}
                                                        />
                                                        <Typography>-</Typography>
                                                        <TextField
                                                            type="time"
                                                            size="small"
                                                            variant="standard"
                                                            value={record.gioRa || ''}
                                                            onChange={(e) => handleInputChange(emp.maNV, 'gioRa', e.target.value)}
                                                            disabled={status !== 'Có Mặt' && status !== 'Đi Muộn'}
                                                        />
                                                    </Box>
                                                </TableCell>
                                                <TableCell>
                                                    <TextField
                                                        size="small"
                                                        variant="standard"
                                                        placeholder="..."
                                                        value={record.ghiChu || (leave ? leave.lyDo : '')}
                                                        onChange={(e) => handleInputChange(emp.maNV, 'ghiChu', e.target.value)}
                                                    />
                                                </TableCell>
                                            </TableRow>
                                        );
                                    })}
                                </TableBody>
                            </Table>
                        </TableContainer>
                    </Paper>
                    <Snackbar open={toast.open} autoHideDuration={3000} onClose={() => setToast({ ...toast, open: false })}><Alert severity={toast.msg.includes('Lỗi') ? 'error' : 'success'} variant="filled">{toast.msg}</Alert></Snackbar>
                </Box>
            );
        };

const GPSSettings = () => {
    const [form, setForm] = useState({ latitude: '', longitude: '', radius: 200, address: '', time_start: '07:00', time_end: '18:00' });
    const [loading, setLoading] = useState(true);
    const [saving, setSaving] = useState(false);
    const [toast, setToast] = useState({ open: false, msg: '', severity: 'success' });
    const [detecting, setDetecting] = useState(false);

    useEffect(() => {
        callServer('getOfficeLocation').then(res => {
            if (res) {
                setForm({
                    latitude: res.latitude || '',
                    longitude: res.longitude || '',
                    radius: res.radius || 200,
                    address: res.address || '',
                    time_start: res.time_start || '07:00',
                    time_end: res.time_end || '18:00'
                });
            }
            setLoading(false);
        }).catch(() => setLoading(false));
    }, []);

    const handleDetectLocation = () => {
        if (!navigator.geolocation) {
            setToast({ open: true, msg: 'Trình duyệt không hỗ trợ GPS', severity: 'error' });
            return;
        }
        setDetecting(true);
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                setForm(prev => ({
                    ...prev,
                    latitude: pos.coords.latitude.toFixed(6),
                    longitude: pos.coords.longitude.toFixed(6)
                }));
                setDetecting(false);
                setToast({ open: true, msg: 'Đã lấy tọa độ hiện tại!', severity: 'success' });
            },
            (err) => {
                setDetecting(false);
                setToast({ open: true, msg: 'Không thể lấy vị trí: ' + err.message, severity: 'error' });
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    };

const handleSave = () => {
        if (!form.latitude || !form.longitude) {
            setToast({ open: true, msg: 'Vui lòng nhập tọa độ', severity: 'error' });
            return;
        }
        // Đã xóa điều kiện chặn (form.time_start >= form.time_end) để cho phép ca qua đêm
        if (!form.time_start || !form.time_end) {
            setToast({ open: true, msg: 'Vui lòng chọn đầy đủ thời gian', severity: 'error' });
            return;
        }
        
        setSaving(true);
        callServer('saveOfficeLocation', {
            latitude: parseFloat(form.latitude),
            longitude: parseFloat(form.longitude),
            radius: parseInt(form.radius),
            address: form.address,
            time_start: form.time_start,
            time_end: form.time_end
        }).then(res => {
            setSaving(false);
            if (res && res.success) {
                setToast({ open: true, msg: 'Đã lưu cài đặt GPS & Thời gian!', severity: 'success' });
            } else {
                setToast({ open: true, msg: 'Lỗi khi lưu!', severity: 'error' });
            }
        }).catch(() => {
            setSaving(false);
            setToast({ open: true, msg: 'Lỗi kết nối!', severity: 'error' });
        });
    };

    const mapUrl = form.latitude && form.longitude
        ? `https://maps.google.com/maps?q=${form.latitude},${form.longitude}&hl=vi&z=16&output=embed`
        : null;

    if (loading) return <Box sx={{ display: 'flex', justifyContent: 'center', p: 10 }}><CircularProgress /></Box>;

    return (
        <Box>
            <Box sx={{ mb: { xs: 2, md: 4 } }}>
                <Typography variant="h5" sx={{ color: '#111827', fontWeight: 700, fontSize: { xs: '1.25rem', md: '1.5rem' } }}>Cài Đặt Điểm Danh</Typography>
                <Typography variant="body2" color="textSecondary" sx={{ mt: 0.5 }}>Thiết lập tọa độ và khoảng thời gian cho phép điểm danh</Typography>
            </Box>

            <Grid container spacing={{ xs: 2, md: 3 }}>
                <Grid item xs={12} md={5}>

                                            size="small"

                                    <Grid item xs={6}>

                                            size="small"

                                size="small"

                                onChange={(e) => setForm({ ...form, address: e.target.value })}
                                placeholder="VD: 123 Nguyễn Huệ, Q1, TP.HCM"

                                        label="Vĩ độ (Latitude)"
                                        fullWidth
                                        size="small"
                                        type="number"
                                        value={form.latitude}

                                        inputProps={{ step: '0.000001' }}
                                    />
                                </Grid>
                                <Grid item xs={6}>
                                    <TextField
                                        label="Kinh độ (Longitude)"
                                        fullWidth
                                        size="small"
                                        type="number"
                                        value={form.longitude}
                                        onChange={(e) => setForm({ ...form, longitude: e.target.value })}
                                        inputProps={{ step: '0.000001' }}
                                    />
                                </Grid>
                            </Grid>

                            <Button
                                variant="outlined"
                                color="secondary"
                                fullWidth
                                startIcon={detecting ? <CircularProgress size={20} /> : <span className="material-icons">gps_fixed</span>}
                                onClick={handleDetectLocation}
                                disabled={detecting}
                            >
                                {detecting ? 'Đang xác định...' : 'Lấy tọa độ hiện tại'}
                            </Button>

                            <Box>
                                <Typography variant="subtitle2" sx={{ mb: 1, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 1 }}>
                                    <span className="material-icons" style={{ fontSize: 18, color: '#f59e0b' }}>radar</span>
                                    Bán kính cho phép: <Chip label={`${form.radius}m`} size="small" color="primary" />
                                </Typography>
                                <Slider
                                    value={form.radius}
                                    onChange={(e, val) => setForm({ ...form, radius: val })}
                                    min={50} max={1000} step={50}
                                    marks={[ { value: 50, label: '50m' }, { value: 200, label: '200m' }, { value: 1000, label: '1km' } ]}
                                    valueLabelDisplay="auto"
                                    valueLabelFormat={(v) => `${v}m`}
                                />

                            <Button
                                variant="contained"
                                color="success"
                                size="large"
                                fullWidth
                                startIcon={saving ? <CircularProgress size={20} color="inherit" /> : <span className="material-icons">save</span>}
                                onClick={handleSave}
                                disabled={saving || !form.latitude || !form.longitude}
                                sx={{ py: 1.5, fontWeight: 700, fontSize: '1rem' }}
                            >
                                {saving ? 'Đang lưu...' : 'Lưu Cài Đặt'}

                    </Paper>

                <Grid item xs={12} md={7}>
                    <Paper sx={{ borderRadius: 3, overflow: 'hidden', boxShadow: 2, height: '100%', minHeight: { xs: 280, md: 450 } }}>

                            <Box sx={{ position: 'relative', height: '100%', minHeight: 400 }}>
                                <iframe src={mapUrl} width="100%" height="100%" frameBorder="0" style={{ border: 0, minHeight: '450px' }} allowFullScreen="" aria-hidden="false" tabIndex="0"></iframe>
                                <Box sx={{ position: 'absolute', bottom: { xs: 8, md: 16 }, left: { xs: 8, md: 16 }, right: { xs: 8, md: 'auto' }, bgcolor: 'rgba(255,255,255,0.95)', backdropFilter: 'blur(4px)', p: { xs: 1.5, md: 2 }, borderRadius: 2, boxShadow: 3 }}>
                                    <Typography variant="caption" color="textSecondary" display="block">📍 Tọa độ văn phòng</Typography>
                                    <Typography variant="body2" fontWeight="bold" sx={{ fontSize: { xs: '0.75rem', md: '0.875rem' } }}>{form.latitude}, {form.longitude}</Typography>
                                    {form.address && <Typography variant="caption" color="textSecondary" sx={{ wordBreak: 'break-word' }}>{form.address}</Typography>}
                                </Box>
                            </Box>
                        ) : (
                            <Box sx={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', p: { xs: 3, md: 4 }, color: 'text.secondary' }}>
                                <span className="material-icons" style={{ fontSize: 64, color: '#d1d5db', marginBottom: 12 }}>map</span>
                                <Typography variant="subtitle1" gutterBottom sx={{ fontWeight: 600 }}>Chưa có tọa độ</Typography>
                                <Typography variant="body2" sx={{ textAlign: 'center' }}>Nhập tọa độ hoặc bấm "Lấy tọa độ hiện tại" để xem bản đồ</Typography>
                            </Box>
                        )}
                    </Paper>
                </Grid>
            </Grid>

            <Snackbar open={toast.open} autoHideDuration={4000} onClose={() => setToast({ ...toast, open: false })}>
                <Alert severity={toast.severity} variant="filled">{toast.msg}</Alert>
            </Snackbar>
        </Box>
    );
};
const GPSCheckIn = () => {
            const { user, employees } = React.useContext(DataContext); 
            const [gpsStatus, setGpsStatus] = useState('idle');
            const [userLocation, setUserLocation] = useState(null);
            const [officeLocation, setOfficeLocation] = useState(null);
            const [distance, setDistance] = useState(null);
            const [checkingIn, setCheckingIn] = useState(false);
            const [todayRecord, setTodayRecord] = useState(null);
            const [result, setResult] = useState(null);
            const [toast, setToast] = useState({ open: false, msg: '', severity: 'success' });
            const [currentTime, setCurrentTime] = useState(new Date());

            const [showFaceScanner, setShowFaceScanner] = useState(false);
            const [scannerMode, setScannerMode] = useState('VERIFY'); 

            const currentEmp = employees.find(e => e.maNV === user.maNV) || user;
            const hasFaceData = !!currentEmp.face_data;

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                callServer('getOfficeLocation').then(res => {
                    if (res) setOfficeLocation(res);
                });
                if (user?.maNV) {
                    callServer('getMyAttendanceToday', user.maNV).then(res => {
                        if (res) setTodayRecord(res);
                    });
                }
            }, [user]);

            const calcDistance = (lat1, lng1, lat2, lng2) => {
                const toRad = (deg) => deg * Math.PI / 180;
                const R = 6371000;
                const dLat = toRad(lat2 - lat1);
                const dLng = toRad(lng2 - lng1);
                const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            };

            const detectLocation = useCallback(() => {
                if (!navigator.geolocation) {
                    setGpsStatus('error');
                    return;
                }
                setGpsStatus('loading');
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const loc = { latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: pos.coords.accuracy };
                        setUserLocation(loc);
                        setGpsStatus('success');
                        if (officeLocation && officeLocation.latitude) {
                            const dist = calcDistance(loc.latitude, loc.longitude, officeLocation.latitude, officeLocation.longitude);
                            setDistance(Math.round(dist));
                        }
                    },
                    (err) => setGpsStatus('error'),
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            }, [officeLocation]);

            useEffect(() => {
                if (officeLocation) detectLocation();
            }, [officeLocation, detectLocation]);

            // KIỂM TRA ĐIỀU KIỆN THỜI GIAN QUA ĐÊM
            const isTimeValid = useMemo(() => {
                if (!officeLocation || !officeLocation.time_start || !officeLocation.time_end) return false;
                const currentStr = currentTime.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false });
                
                const start = officeLocation.time_start;
                const end = officeLocation.time_end;

                if (start <= end) {
                    return currentStr >= start && currentStr <= end;
                } else {
                    return currentStr >= start || currentStr <= end; // Xử lý qua đêm
                }
            }, [currentTime, officeLocation]);

            // TẠO CÂU THÔNG BÁO CẢNH BÁO NGOÀI GIỜ
            const timeWarningMsg = useMemo(() => {
                if (!officeLocation) return '';
                const start = officeLocation.time_start;
                const end = officeLocation.time_end;
                if (start <= end) {
                    return `Hệ thống chỉ cho phép điểm danh từ ${start} hôm nay đến ${end} hôm nay. Vui lòng quay lại sau!`;
                } else {
                    return `Hệ thống chỉ cho phép điểm danh từ ${start} hôm nay đến ${end} hôm sau. Vui lòng quay lại sau!`;
                }
            }, [officeLocation]);

            // TẠO CÂU THÔNG BÁO THỜI GIAN HỢP LỆ (Hôm nay / Ngày mai)
            const validTimeMsg = useMemo(() => {
                if (!officeLocation) return '';
                const start = officeLocation.time_start;
                const end = officeLocation.time_end;
                if (start <= end) {
                    return `💡 Thời gian cho phép điểm danh hôm nay: từ ${start} đến ${end}`;
                } else {
                    return `💡 Thời gian cho phép điểm danh: từ ${start} hôm nay đến ${end} ngày mai.`;
                }
            }, [officeLocation]);

            const isInRange = distance !== null && officeLocation && distance <= officeLocation.radius;
            const isMobile = useMediaQuery(theme.breakpoints.down('sm'));

            const handleEnrollClick = () => {
                setScannerMode('ENROLL');
                setShowFaceScanner(true);
            };

// 1. CẬP NHẬT HÀM BẤM NÚT ĐIỂM DANH
            const handleCheckInClick = () => {
                // Kiểm tra thời gian trước
                if (!isTimeValid) {
                    setToast({ open: true, msg: `❌ Hiện tại đang ngoài giờ điểm danh (${officeLocation?.time_start} - ${officeLocation?.time_end})`, severity: 'error' });
                    return;
                }

                // THÊM MỚI: KIỂM TRA GPS TRƯỚC KHI MỞ CAMERA
                if (!userLocation || gpsStatus !== 'success') {
                    setToast({ open: true, msg: '❌ Chưa lấy được tọa độ GPS. Vui lòng chờ hoặc bật định vị trên thiết bị!', severity: 'error' });
                    return;
                }
                
                if (!isInRange) {
                    setToast({ open: true, msg: `❌ Bạn đang ở ngoài phạm vi KTX (cách ${Math.round(distance)}m, cho phép: ${officeLocation.radius}m). Không thể mở camera điểm danh!`, severity: 'error' });
                    return;
                }

                // Nếu vượt qua hết các điều kiện trên thì mới cho mở Camera
                setScannerMode('VERIFY');
                setShowFaceScanner(true);
            };

            // 2. CẬP NHẬT HÀM XỬ LÝ SAU KHI QUÉT MẶT THÀNH CÔNG
            const handleFaceSuccess = () => {
                setShowFaceScanner(false); 

                if (scannerMode === 'ENROLL') {
                    setToast({ open: true, msg: '✅ Bạn đã đăng ký khuôn mặt thành công. Bây giờ có thể điểm danh.', severity: 'success' });
                    return; 
                }

                // Vì chúng ta đã kiểm tra GPS kỹ ở bước bấm nút rồi, 
                // nên ở đây chỉ cần gọi thẳng lên Server để ghi nhận điểm danh.
                executeCheckInOnServer();
            };

            const handleCancelScanner = () => {
                setShowFaceScanner(false);
                setToast({ open: true, msg: '⚠️ ĐIỂM DANH CHƯA THÀNH CÔNG (Bạn đã hủy xác thực khuôn mặt)', severity: 'warning' });
            };

            

            const executeCheckInOnServer = () => {
                setCheckingIn(true);
                callServer('gpsCheckIn', user.maNV, userLocation.latitude, userLocation.longitude)
                    .then(res => {
                        setCheckingIn(false);
                        setResult(res);
                        if (res.success) {
                            setToast({ open: true, msg: `✅ ${res.message}`, severity: 'success' });
                            callServer('getMyAttendanceToday', user.maNV).then(r => {
                                if (r) setTodayRecord(r);
                            });
                        } else {
                            setToast({ open: true, msg: `❌ ${res.message} - ĐIỂM DANH CHƯA THÀNH CÔNG!`, severity: 'error' });
                        }
                    })
                    .catch(err => {
                        setCheckingIn(false);
                        setToast({ open: true, msg: '❌ Lỗi kết nối máy chủ. ĐIỂM DANH CHƯA THÀNH CÔNG!', severity: 'error' });
                    });
            };

            return (
                <Box>
                    <Box sx={{ mb: { xs: 2, md: 4 } }}>
                        <Typography variant="h5" sx={{ color: '#111827', fontWeight: 700, fontSize: { xs: '1.25rem', md: '1.5rem' } }}>Điểm Danh xác thực GPS & Khuôn Mặt</Typography>
                        <Typography variant="body2" color="textSecondary" sx={{ mt: 0.5 }}>Hệ thống yêu cầu xác thực kép để đảm bảo tính chính xác</Typography>
                    </Box>

                    {!hasFaceData && (
                        <Alert severity="warning" sx={{ mb: 3, borderRadius: 2, fontWeight: 'bold' }}>
                            Tài khoản của bạn chưa có dữ liệu sinh trắc học. Bắt buộc phải đăng ký khuôn mặt trước khi sử dụng chức năng điểm danh!
                        </Alert>
                    )}

                    {/* HIỂN THỊ CẢNH BÁO THỜI GIAN NGOÀI GIỜ */}
                    {hasFaceData && officeLocation && !isTimeValid && (
                        <Alert severity="error" sx={{ mb: 3, borderRadius: 2, fontWeight: 'bold' }}>
                            {timeWarningMsg}
                        </Alert>
                    )}

                    {/* HIỂN THỊ THÔNG BÁO THỜI GIAN HỢP LỆ */}
                    {hasFaceData && officeLocation && isTimeValid && !todayRecord && (
                        <Alert severity="info" sx={{ mb: 3, borderRadius: 2, fontWeight: 'bold' }}>
                            {validTimeMsg}
                        </Alert>
                    )}

                    <Grid container spacing={{ xs: 2, md: 3 }}>
                        <Grid item xs={12} md={7}>
                            <Paper sx={{
                                borderRadius: { xs: 3, md: 4 }, overflow: 'hidden', boxShadow: 3,
                                background: 'linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%)',
                                color: 'white', position: 'relative'
                            }}>
                                <Box sx={{ p: { xs: 2.5, sm: 3, md: 4 }, position: 'relative', zIndex: 1 }}>
                                    <Box sx={{ textAlign: 'center', mb: { xs: 2.5, md: 4 } }}>
                                        <Typography sx={{ fontWeight: 800, letterSpacing: { xs: 1, md: 2 }, fontFamily: 'monospace', fontSize: { xs: '2rem', sm: '2.5rem', md: '3.5rem' }, lineHeight: 1.1 }}>
                                            {currentTime.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                                        </Typography>
                                        <Typography variant="body2" sx={{ opacity: 0.7, mt: { xs: 0.5, md: 1 }, fontSize: { xs: '0.75rem', md: '0.875rem' } }}>
                                            {currentTime.toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                                        </Typography>
                                    </Box>

                                    {hasFaceData && (
                                        <Box sx={{ display: 'flex', flexDirection: 'column', alignItems: 'center', mb: { xs: 2.5, md: 4 } }}>
                                            <div className="gps-pulse-wrapper" style={{ marginBottom: 16 }}>
                                                {gpsStatus === 'success' && <div className={`gps-pulse-ring ${isInRange ? '' : 'error'}`} />}
                                                {gpsStatus === 'loading' ? (
                                                    <CircularProgress size={40} sx={{ color: 'white' }} />
                                                ) : (
                                                    <div className={`gps-pulse-dot ${gpsStatus === 'success' && isInRange ? '' : 'error'}`} style={{ width: 40, height: 40 }} />
                                                )}
                                            </div>

                                            {gpsStatus === 'idle' && <Typography variant="body2" sx={{ opacity: 0.7 }}>Đang khởi tạo GPS...</Typography>}
                                            {gpsStatus === 'loading' && <Typography variant="body2" sx={{ opacity: 0.7 }}>Đang xác định vị trí...</Typography>}
                                            {gpsStatus === 'error' && (
                                                <Box sx={{ textAlign: 'center' }}>
                                                    <Typography variant="body2" color="error.light">Không thể xác định vị trí</Typography>
                                                    <Button size="small" onClick={detectLocation} sx={{ color: 'white', mt: 1 }} startIcon={<span className="material-icons">refresh</span>}>Thử lại</Button>
                                                </Box>
                                            )}
                                            {gpsStatus === 'success' && distance !== null && (
                                                <Box sx={{ textAlign: 'center' }} className="fade-in-up">
                                                    <Typography variant="h5" sx={{ fontWeight: 700, color: isInRange ? '#34d399' : '#fca5a5' }}>
                                                        {distance < 1000 ? `${distance}m` : `${(distance / 1000).toFixed(1)}km`}
                                                    </Typography>
                                                    <Typography variant="body2" sx={{ opacity: 0.7, mt: 0.5 }}>
                                                        {isInRange ? '✅ Trong phạm vi' : `❌ Ngoài phạm vi (cần ≤ ${officeLocation?.radius}m)`}
                                                    </Typography>
                                                </Box>
                                            )}
                                        </Box>
                                    )}

                                    <Box sx={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2, mt: hasFaceData ? 0 : 4 }}>
                                        {!hasFaceData ? (
                                            <Button
                                                variant="contained"
                                                size="large"
                                                onClick={handleEnrollClick}
                                                fullWidth={isMobile}
                                                sx={{
                                                    px: { xs: 4, md: 6 }, py: { xs: 1.5, md: 2 }, borderRadius: { xs: 3, md: 4 },
                                                    fontWeight: 800, fontSize: { xs: '1rem', md: '1.2rem' },
                                                    background: 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)',
                                                    boxShadow: '0 10px 30px -5px rgba(245, 158, 11, 0.5)'
                                                }}
                                                startIcon={<span className="material-icons">face_retouching_natural</span>}
                                            >
                                                ĐĂNG KÝ KHUÔN MẶT
                                            </Button>
                                        ) : (
                                            <Button
                                                variant="contained"
                                                size="large"
                                                // Khóa nút nếu đang xử lý, HOẶC đã có dữ liệu hôm nay, HOẶC ngoài giờ
                                                disabled={checkingIn || !!todayRecord || !isTimeValid} 
                                                onClick={handleCheckInClick}
                                                fullWidth={isMobile}
                                                sx={{
                                                    px: { xs: 4, md: 6 }, py: { xs: 1.5, md: 2 }, borderRadius: { xs: 3, md: 4 },
                                                    fontWeight: 800, fontSize: { xs: '1rem', md: '1.2rem' },
                                                    // Màu Xanh Lá (Đã điểm danh), Xanh Đậm (Hợp lệ), Xám (Ngoài giờ)
                                                    background: todayRecord 
                                                        ? 'linear-gradient(135deg, #10b981 0%, #059669 100%)' 
                                                        : (isTimeValid ? 'linear-gradient(135deg, #4338ca 0%, #312e81 100%)' : '#6b7280'),
                                                    opacity: (todayRecord || !isTimeValid) ? 0.8 : 1,
                                                    boxShadow: isTimeValid && !todayRecord ? '0 10px 30px -5px rgba(67, 56, 202, 0.5)' : 'none'
                                                }}
                                                startIcon={checkingIn ? <CircularProgress size={22} color="inherit" /> : <span className="material-icons">check_circle</span>}
                                            >
                                                {checkingIn ? 'Đang xử lý...' : (!isTimeValid ? 'NGOÀI GIỜ' : (todayRecord ? 'BẠN ĐÃ ĐIỂM DANH' : 'XÁC THỰC ĐIỂM DANH'))}
                                            </Button>
                                        )}
                                    </Box>
                                </Box>
                            </Paper>
                        </Grid>

                        <Grid item xs={12} md={5}>
                            <Stack spacing={3}>
                                <Paper sx={{ p: { xs: 2, md: 3 }, borderRadius: 3, boxShadow: 2 }}>
                                    <Box sx={{ display: 'flex', alignItems: 'center', gap: 1, mb: 2 }}>
                                        <Box sx={{ p: 1, borderRadius: 2, bgcolor: '#f0fdf4', color: '#16a34a' }}>
                                            <span className="material-icons">today</span>
                                        </Box>
                                        <Typography variant="h6" sx={{ fontWeight: 600 }}>Hôm Nay</Typography>
                                    </Box>

                                    {todayRecord ? (
                                        <Box>
                                            <Grid container spacing={2} sx={{ mb: 2 }}>
                                                <Grid item xs={12}>
                                                    <Paper variant="outlined" sx={{ p: { xs: 1.5, md: 2 }, textAlign: 'center', borderRadius: 2, bgcolor: '#f0fdf4', borderColor: '#bbf7d0' }}>
                                                        <Typography variant="caption" color="textSecondary" sx={{ fontSize: '0.9rem' }}>
                                                            Thời gian điểm danh thành công
                                                        </Typography>
                                                        <Typography variant="h6" sx={{ fontWeight: 800, color: '#16a34a', fontSize: { xs: '1.25rem', md: '1.5rem' }, mt: 0.5 }}>
                                                            {todayRecord.gioVao || '--:--'}
                                                        </Typography>
                                                    </Paper>
                                                </Grid>
                                            </Grid>
                                            <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                                                <Chip
                                                    label={todayRecord.trangThai}
                                                    size="small"
                                                    color={todayRecord.trangThai === 'Có Mặt' ? 'success' : todayRecord.trangThai === 'Đi Muộn' ? 'warning' : 'default'}
                                                />
                                                <Typography variant="caption" color="textSecondary">{todayRecord.ghiChu}</Typography>
                                            </Box>

const FaceCheckIn = ({ user, onVerified, mode = 'VERIFY' }) => {
    const iframeRef = useRef(null);
    const [status, setStatus] = useState('Đang khởi tạo Camera...');
    const { employees, setEmployees, user: loggedInUser } = React.useContext(DataContext);

    const FACE_URL = 'https://dangnhapdiemdanh.web.app/face.html';

    const handleIframeLoad = () => {
        const currentEmp = employees.find(e => e.maNV === user.maNV) || user;
        iframeRef.current?.contentWindow?.postMessage({
            type: 'INIT',
            maNV: currentEmp.maNV,
            faceData: currentEmp.face_data || null,
            role: loggedInUser?.role || 'EMPLOYEE',
            mode: mode 
        }, '*');
        setStatus('');
    };

    useEffect(() => {
        const handleMessage = (e) => {
            const data = e.data || {};
            
            // XỬ LÝ LƯU KHUÔN MẶT (ENROLL)
            if (data.type === 'ENROLL' && data.descriptor) {
                setStatus('Đang lưu dữ liệu...');
                callServer('saveFaceData', data.maNV, data.descriptor).then(res => {
                    setStatus(res.success ? '✅ Đã lưu khuôn mặt thành công!' : '❌ Lỗi: ' + res.message);
                    iframeRef.current?.contentWindow?.postMessage({ type: 'ENROLL_RESULT', success: res.success, message: res.message }, '*');
                    
                    if (res.success) {
                        const updatedEmployees = employees.map(emp => 
                            emp.maNV === data.maNV ? { ...emp, face_data: data.descriptor } : emp
                        );
                        setEmployees(updatedEmployees);
                        setTimeout(() => onVerified(), 1500); 
                    }
                });
            }
            
            // XỬ LÝ XÁC THỰC (VERIFY)
            if (data.type === 'VERIFIED') {
                setStatus('✅ Xác thực thành công! Đang ghi nhận...');
                setTimeout(() => onVerified(), 1500); 
            }
            
            if (data.type === 'FAILED') {
                setStatus('❌ Khuôn mặt không khớp! Vui lòng ấn Thử Lại.');
            }
        };
        
        window.addEventListener('message', handleMessage);
        return () => window.removeEventListener('message', handleMessage);
    }, [user.maNV, onVerified, employees, setEmployees]);

    return (
        <Box sx={{ display: 'flex', flexDirection: 'column', height: '100%', bgcolor: '#000' }}>

            </Box>

            {status && (
                <Typography variant="subtitle2" sx={{ textAlign: 'center', p: 1.5, fontWeight: 600, color: status.includes('❌') ? '#fca5a5' : '#6ee7b7', bgcolor: '#111827' }}>
                    {status}
                </Typography>
            )}
            
            <Box sx={{ flexGrow: 1, position: 'relative', overflow: 'hidden' }}>
                <iframe
                    ref={iframeRef}
                    src={FACE_URL}
                    onLoad={handleIframeLoad}
                    style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', border: 'none' }}
                    title="Face Scanner"
                    allow="camera *; microphone *"
