    <style>
        body {
            margin: 0;
            background-color: #f3f4f6;
            /* Modern gray background */
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Scrollbar */

            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        /* GPS Pulse Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.5); opacity: 1; }
            80%, 100% { transform: scale(2.5); opacity: 0; }
        }
        @keyframes pulse-dot {
            0% { transform: scale(0.8); }
            50% { transform: scale(1); }
            100% { transform: scale(0.8); }
        }
        .gps-pulse-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gps-pulse-ring {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.3);
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        .gps-pulse-ring.error {
            background: rgba(239, 68, 68, 0.3);
        }
        .gps-pulse-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            animation: pulse-dot 1.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
            z-index: 1;
        }
        .gps-pulse-dot.error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up { animation: fadeInUp 0.5s ease forwards; }
    </style>

        // --- API SERVER CALL ---
// Trỏ về "Nhà kho" Google Apps Script
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxmfBEq7A4pVPTlgyXTXNlVel-OLpCF77WNzBLLdFdlIjQKCP3kWLXMGoNBEq35_61p/exec';

const callServer = async (func, ...args) => {
    try {
        const response = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: func, args: args })
        });
        
        const json = await response.json();
        if (json.success) {
            return json.data;
        } else {
            throw new Error(json.error);
        }
    } catch (err) {
        console.error(`[API Error] calling ${func}:`, err);
        throw err;
    }
};

        // Helper: getAllData returns JSON string, needs parsing

                    setItems(positions);
                }
                setLoading(false); // Data is loaded via App component's getAllData
            }, [departments, positions, fetchFunc]);


            const handleSubmit = () => {
                const payload = { [idField]: form.id, [nameField]: form.name, moTa: form.desc };

                // Optimistic UI Update
                const tempId = Date.now();
                const newItem = { ...payload, [idField]: form.id || `temp-${tempId}` };

                if (fetchFunc === 'getDepartments') {
                    setDepartments(prev => [newItem, ...prev]);
                } else if (fetchFunc === 'getPositions') {
                    setPositions(prev => [newItem, ...prev]);
                }

                setOpen(false); setForm({ id: '', name: '', desc: '' });
                setToast({ open: true, msg: 'Đang xử lý...' });

                callServer(addFunc, payload).then(() => {
                    setToast({ open: true, msg: 'Thành công!' });
                    // Re-fetch all data to ensure consistency, or update context directly if server returns full object
                    fetchAllData().then(data => {
                        if (fetchFunc === 'getDepartments') setDepartments(data.departments);
                        if (fetchFunc === 'getPositions') setPositions(data.positions);
                    });
                }).catch(() => {
                    setToast({ open: true, msg: 'Lỗi khi thêm!' });
                    // Revert optimistic update
                    if (fetchFunc === 'getDepartments') {
                        setDepartments(prev => prev.filter(item => item[idField] !== newItem[idField]));
                    } else if (fetchFunc === 'getPositions') {
                        setPositions(prev => prev.filter(item => item[idField] !== newItem[idField]));

                                                                                        <Stack spacing={1}>

                                                                                                        <Typography variant="body2" noWrap sx={{ fontWeight: 500 }}>{e.hoTen}</Typography>

                    <Dialog open={open} onClose={() => setOpen(false)} maxWidth="xs" fullWidth PaperProps={{ sx: { borderRadius: 3 } }}>

                        <DialogContent>
                            <Stack spacing={2} sx={{ mt: 1 }}>
                                <TextField label="Mã CV" fullWidth size="small" value={form.maCV} onChange={(e) => setForm({ ...form, maCV: e.target.value })} />
                                <TextField label="Tên Chức Vụ" fullWidth size="small" value={form.tenCV} onChange={(e) => setForm({ ...form, tenCV: e.target.value })} />
                                <TextField label="Mô Tả" fullWidth multiline rows={2} size="small" value={form.moTa} onChange={(e) => setForm({ ...form, moTa: e.target.value })} />
                            </Stack>
                        </DialogContent>
                        <DialogActions sx={{ p: 2 }}>
                            <Button onClick={() => setOpen(false)} color="inherit">Hủy</Button>
                            <Button variant="contained" onClick={handleSubmit} disabled={!form.maCV || !form.tenCV}>Lưu lại</Button>
                        </DialogActions>
                    </Dialog>
                    <Snackbar open={toast.open} autoHideDuration={3000} onClose={() => setToast({ ...toast, open: false })}>
                        <Alert severity="success" variant="filled">{toast.msg}</Alert>
                    </Snackbar>
                </Box>
            );
        };

        // --- OPTIMIZED EMPLOYEES ---
        const EmployeeList = () => {
            const { employees, setEmployees, confirmAction, departments, positions } = React.useContext(DataContext);
            const [openForm, setOpenForm] = useState(false);
            const [openDetail, setOpenDetail] = useState(false);
            const [scanUser, setScanUser] = useState(null); // Quản lý xem đang quét mặt ai
const openFaceScan = (emp) => setScanUser(emp); // Hàm mở camera
            const [mode, setMode] = useState('add'); // 'add' or 'edit'
            const [selectedEmp, setSelectedEmp] = useState(null);

            // Search State
            const [searchTerm, setSearchTerm] = useState('');

            const [form, setForm] = useState({ maNV: '', hoTen: '', email: '', phongBan: '', chucVu: '', ngayVaoLam: '', username: '', password: '', avatar: '', gioiTinh: 'Nam', namSinh: '', soDienThoai: '', queQuan: '' });
            const [toast, setToast] = useState({ open: false, msg: '' });
            const isMobile = useMediaQuery(theme.breakpoints.down('sm'));

            // Filtered Employees
            const filteredEmployees = useMemo(() => {
                if (!searchTerm) return employees;
                const lowerTerm = searchTerm.toLowerCase();
                return employees.filter(emp =>
                    (emp.hoTen && emp.hoTen.toLowerCase().includes(lowerTerm)) ||
                    (emp.maNV && emp.maNV.toLowerCase().includes(lowerTerm))
                );
            }, [employees, searchTerm]);

            // Reset form
            const resetForm = () => {
                setForm({ maNV: '', hoTen: '', email: '', phongBan: '', chucVu: '', ngayVaoLam: '', username: '', password: '', avatar: '', gioiTinh: 'Nam', namSinh: '', soDienThoai: '', queQuan: '' });
                setMode('add');
                setSelectedEmp(null);
            };

            // Handle Add/Edit Submit
            const handleSubmit = () => {
                if (mode === 'add') {
                    // OPTIMISTIC ADD
                    const newEmp = { ...form, maNV: 'Đang tạo...' };
                    const prev = [...employees];
                    setEmployees(prev => [newEmp, ...prev]);
                    setOpenForm(false);
                    setToast({ open: true, msg: 'Đang thêm...' });
                    resetForm();

                    callServer('addEmployee', form).then(() => {
                        setToast({ open: true, msg: 'Thêm thành công!' });
                        fetchAllData().then(data => setEmployees(data.employees));
                    }).catch(() => {
                        setEmployees(prev);
                        setToast({ open: true, msg: 'Lỗi khi thêm!' });
                    });
                } else {
                    // OPTIMISTIC EDIT
                    const prev = [...employees];
                    const updatedEmp = { ...form }; // form has maNV
                    setEmployees(prev => prev.map(e => e.maNV === updatedEmp.maNV ? updatedEmp : e));
                    setOpenForm(false);
                    setToast({ open: true, msg: 'Đang cập nhật...' });
                    resetForm();

                    callServer('updateEmployee', updatedEmp).then(() => {
                        setToast({ open: true, msg: 'Cập nhật thành công!' });
                    }).catch(() => {
                        setEmployees(prev);
                        setToast({ open: true, msg: 'Lỗi cập nhật!' });
                    });
                }
            };

            // Handle Delete
            const handleDelete = (maNV) => {
                const performDelete = () => {
                    const prev = [...employees];
                    setEmployees(prev => prev.filter(e => e.maNV !== maNV));
                    setToast({ open: true, msg: 'Đang xóa...' });

                    callServer('deleteEmployee', maNV).then(() => {
                        setToast({ open: true, msg: 'Đã xóa thành công!' });
                    }).catch(() => {
                        setEmployees(prev);
                        setToast({ open: true, msg: 'Lỗi khi xóa!' });
                    });
                };
                confirmAction('Xóa Nhân Viên', `Bạn có chắc chắn muốn xóa nhân viên ${maNV}?`, performDelete);
            };

            const openEdit = (emp) => {
                setForm({
                    ...emp,
                    ngayVaoLam: emp.ngayVaoLam ? emp.ngayVaoLam.split('T')[0] : '',
                    namSinh: emp.namSinh ? emp.namSinh.split('T')[0] : ''
                });
                setMode('edit');
                setOpenForm(true);
            };

            const openView = (emp) => {
                setSelectedEmp(emp);
                setOpenDetail(true);
            };

            const EmployeeCard = ({ emp }) => (

                    <CardContent>
                        <Box sx={{ display: 'flex', alignItems: 'center', gap: 2, mb: 2 }}>
                            <Avatar src={emp.avatar} sx={{ bgcolor: theme.palette.primary.main }}>{emp.hoTen ? emp.hoTen.charAt(0) : '?'}</Avatar>
                            <Box>
                                <Typography variant="subtitle1" fontWeight="bold">{emp.hoTen}</Typography>
                                <Typography variant="caption" color="textSecondary">{emp.email}</Typography>

                        <Divider sx={{ mb: 2 }} />
                        <Grid container spacing={1} sx={{ mb: 2 }}>
                            <Grid item xs={6}><Typography variant="caption" color="textSecondary">Mã NV</Typography><Typography variant="body2">{emp.maNV}</Typography></Grid>

                        </Grid>
                        <Box sx={{ display: 'flex', gap: 1, justifyContent: 'flex-end' }}>
                            <IconButton size="small" color="primary" onClick={() => openView(emp)}><span className="material-icons">visibility</span></IconButton>
                            <IconButton size="small" color="info" onClick={() => openEdit(emp)}><span className="material-icons">edit</span></IconButton>
                            <IconButton size="small" color="error" onClick={() => handleDelete(emp.maNV)}><span className="material-icons">delete</span></IconButton>
                        </Box>
                    </CardContent>
                </Card>
            );

            // Row Component for Collapsible Table
            const Row = ({ emp, openView, openEdit, handleDelete }) => {
                const [open, setOpen] = useState(false);
                const { attendance } = React.useContext(DataContext);
                const [filterMonth, setFilterMonth] = useState(new Date().getMonth() + 1);

                // Calculate Monthly Stats
                const monthlyStats = useMemo(() => {
                    const currentYear = new Date().getFullYear();
                    const empAtt = attendance.filter(a => {
                        if (a.maNV !== emp.maNV) return false;
                        const d = new Date(a.date);
                        return d.getMonth() + 1 === filterMonth && d.getFullYear() === currentYear;
                    });

                    const late = empAtt.filter(a => a.trangThai === 'Đi Muộn').length;
                    const absent = empAtt.filter(a => a.trangThai === 'Vắng').length;
                    const totalViolations = late + absent;

                    return { late, absent, totalViolations, records: empAtt.filter(a => a.trangThai === 'Đi Muộn' || a.trangThai === 'Vắng') };
                }, [attendance, emp.maNV, filterMonth]);

                return (
                    <React.Fragment>
                        <TableRow sx={{ '& > *': { borderBottom: 'unset' } }} hover>
                            <TableCell>
                                <IconButton aria-label="expand row" size="small" onClick={() => setOpen(!open)}>
                                    <span className="material-icons">{open ? 'keyboard_arrow_up' : 'keyboard_arrow_down'}</span>
                                </IconButton>
                            </TableCell>
                            <TableCell><Typography variant="body2" fontWeight="bold">{emp.maNV}</Typography></TableCell>
                            <TableCell>
                                <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5 }}>
                                    <Avatar src={emp.avatar} sx={{ width: 32, height: 32, bgcolor: theme.palette.primary.main }}>{emp.hoTen ? emp.hoTen.charAt(0) : '?'}</Avatar>
                                    <Box>
                                        <Typography variant="body2" fontWeight="500">{emp.hoTen}</Typography>
                                        <Typography variant="caption" color="textSecondary">{emp.email}</Typography>
                                    </Box>
                                </Box>
                            </TableCell>
                            <TableCell>
                                <Typography variant="body2">{emp.phongBan}</Typography>
                                <Typography variant="caption" color="textSecondary">{emp.chucVu}</Typography>
                            </TableCell>
                            <TableCell align="center">
                                <Typography variant="body2" fontWeight="bold" color="primary">
                                    {emp.stats?.daysOff || 0} / {emp.stats?.maxLeaves || 12}
                                </Typography>
                            </TableCell>
                            <TableCell align="center"><Typography variant="body2">{emp.stats?.total || 0}</Typography></TableCell>
                            <TableCell align="center">
                                <Box sx={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 0.5 }}>
                                    <Chip label={`Duyệt: ${emp.stats?.approved || 0}`} size="small" color="success" variant="outlined" sx={{ height: 20, fontSize: 10 }} />
                                    <Chip label={`Từ chối: ${emp.stats?.rejected || 0}`} size="small" color="error" variant="outlined" sx={{ height: 20, fontSize: 10 }} />
                                </Box>
                            </TableCell>
                            <TableCell align="right">
    {/* Thêm nút quét mặt vào đây */}
    <IconButton color="secondary" size="small" onClick={() => openFaceScan(emp)}>
        <span className="material-icons">face_retouching_natural</span>
    </IconButton>
    <IconButton color="info" size="small" onClick={() => openEdit(emp)}><span className="material-icons">edit</span></IconButton>
    <IconButton color="error" size="small" onClick={() => handleDelete(emp.maNV)}><span className="material-icons">delete</span></IconButton>
</TableCell>
                        </TableRow>
                        <TableRow>
                            <TableCell style={{ paddingBottom: 0, paddingTop: 0 }} colSpan={8}>
                                <Collapse in={open} timeout="auto" unmountOnExit>
                                    <Box sx={{ margin: 2, p: 2, bgcolor: '#f9fafb', borderRadius: 2 }}>
                                        <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', mb: 2 }}>
                                            <Typography variant="h6" gutterBottom component="div" sx={{ fontSize: '1rem', fontWeight: 'bold' }}>
                                                Chi Tiết Vi Phạm - Tháng {filterMonth}
                                            </Typography>
                                            <FormControl size="small" sx={{ minWidth: 120 }}>
                                                <Select value={filterMonth} onChange={(e) => setFilterMonth(e.target.value)} sx={{ bgcolor: 'white' }}>
                                                    {[...Array(12)].map((_, i) => <MenuItem key={i + 1} value={i + 1}>Tháng {i + 1}</MenuItem>)}
                                                </Select>
                                            </FormControl>
                                        </Box>

                                        <Grid container spacing={2} sx={{ mb: 2 }}>
                                            <Grid item xs={4}>
                                                <Paper sx={{ p: 1.5, textAlign: 'center', bgcolor: '#fef3c7' }} variant="outlined">
                                                    <Typography variant="caption" color="textSecondary">Đi Muộn</Typography>
                                                    <Typography variant="h6" color="#d97706">{monthlyStats.late}</Typography>
                                                </Paper>
                                            </Grid>
                                            <Grid item xs={4}>
                                                <Paper sx={{ p: 1.5, textAlign: 'center', bgcolor: '#fee2e2' }} variant="outlined">
                                                    <Typography variant="caption" color="textSecondary">Vắng Mặt</Typography>
                                                    <Typography variant="h6" color="#dc2626">{monthlyStats.absent}</Typography>
                                                </Paper>
                                            </Grid>
                                            <Grid item xs={4}>
                                                <Paper sx={{ p: 1.5, textAlign: 'center', bgcolor: '#e0f2fe' }} variant="outlined">
                                                    <Typography variant="caption" color="textSecondary">Tổng Vi Phạm</Typography>
                                                    <Typography variant="h6" color="#0284c7">{monthlyStats.totalViolations}</Typography>
                                                </Paper>
                                            </Grid>
                                        </Grid>

                                        <Typography variant="subtitle2" sx={{ mb: 1, fontWeight: 'bold' }}>Nhật Ký Vi Phạm</Typography>
                                        {monthlyStats.records.length === 0 ? (
                                            <Typography variant="body2" color="textSecondary" sx={{ fontStyle: 'italic' }}>Không có ghi nhận vi phạm trong tháng này.</Typography>
                                        ) : (
                                            <Table size="small" aria-label="purchases">
                                                <TableHead>
                                                    <TableRow>
                                                        <TableCell>Ngày</TableCell>
                                                        <TableCell>Loại Vi Phạm</TableCell>
                                                        <TableCell>Ghi Chú</TableCell>
                                                    </TableRow>
                                                </TableHead>
                                                <TableBody>
                                                    {monthlyStats.records.map((historyRow) => (
                                                        <TableRow key={historyRow.date}>
                                                            <TableCell component="th" scope="row">{new Date(historyRow.date).toLocaleDateString('vi-VN')}</TableCell>
                                                            <TableCell>
                                                                <Chip
                                                                    label={historyRow.trangThai}
                                                                    size="small"
                                                                    sx={{
                                                                        bgcolor: historyRow.trangThai === 'Đi Muộn' ? '#fef3c7' : '#fee2e2',
                                                                        color: historyRow.trangThai === 'Đi Muộn' ? '#d97706' : '#dc2626',
                                                                        fontWeight: 'bold'
                                                                    }}
                                                                />
                                                            </TableCell>
                                                            <TableCell>{historyRow.ghiChu || '-'}</TableCell>
                                                        </TableRow>
                                                    ))}
                                                </TableBody>
                                            </Table>
                                        )}
                                    </Box>
                                </Collapse>
                            </TableCell>
                        </TableRow>
                    </React.Fragment>
                );
            };




            return (
                <Box>
                    <Box sx={{ display: 'flex', flexDirection: isMobile ? 'column' : 'row', justifyContent: 'space-between', alignItems: isMobile ? 'stretch' : 'center', mb: 3, gap: 2 }}>

                            <TextField
                                placeholder="Tìm kiếm (Tên/Mã NV)..."

                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                InputProps={{
                                    startAdornment: <span className="material-icons" style={{ color: '#9ca3af', marginRight: 8 }}>search</span>,
                                    sx: { bgcolor: 'white', borderRadius: 2 }

                            />
                            <Button variant="contained" startIcon={<span className="material-icons">person_add</span>} onClick={() => { resetForm(); setOpenForm(true); }}>Thêm NV</Button>
                        </Box>
                    </Box>
                    {filteredEmployees.length === 0 ? <Box sx={{ display: 'flex', justifyContent: 'center', p: 4 }}><Typography align="center" color="textSecondary">{searchTerm ? 'Không tìm thấy kết quả' : 'Chưa có dữ liệu'}</Typography></Box> : (
                        isMobile ? (
                            <Box>
                                {filteredEmployees.map((emp, i) => <EmployeeCard key={i} emp={emp} />)}
                            </Box>
                        ) : (
                            <Paper sx={{ overflow: 'hidden' }}>
                                <TableContainer>
                                    <Table>
                                        <TableHead>
                                            <TableRow>
                                                <TableCell />
                                                <TableCell>Mã NV</TableCell>
                                                <TableCell>Họ Tên / Email</TableCell>
                                                <TableCell>Phòng Ban / Chức Vụ</TableCell>
                                                <TableCell align="center">Ngày Nghỉ</TableCell>
                                                <TableCell align="center">Số Đơn</TableCell>
                                                <TableCell align="center">Kết Quả</TableCell>
                                                <TableCell align="right">Thao Tác</TableCell>
                                            </TableRow>
                                        </TableHead>
                                        <TableBody>
                                            {filteredEmployees.length === 0 ? (
                                                <TableRow><TableCell colSpan={8} align="center" sx={{ py: 3, color: 'text.secondary' }}>{searchTerm ? 'Không tìm thấy kết quả' : 'Chưa có dữ liệu nhân viên'}</TableCell></TableRow>
                                            ) : filteredEmployees.map((emp) => (
                                                <Row key={emp.maNV} emp={emp} openView={openView} openEdit={openEdit} handleDelete={handleDelete} />
                                            ))}
                                        </TableBody>
                                    </Table>
                                </TableContainer>
                            </Paper>
                        )
                    )}

                    {/* ADD / EDIT DIALOG */}
                    <Dialog open={openForm} onClose={() => setOpenForm(false)} maxWidth="sm" fullWidth PaperProps={{ sx: { borderRadius: 3 } }}>
                        <DialogTitle>{mode === 'add' ? 'Thêm Nhân Viên Mới' : 'Cập Nhật Nhân Viên'}</DialogTitle>
                        <DialogContent>
                            <Grid container spacing={2} sx={{ mt: 0 }}>
                                {mode === 'edit' && <Grid item xs={12}><TextField label="Mã NV" fullWidth size="small" value={form.maNV} disabled /></Grid>}

                                {/* Avatar Upload */}
                                <Grid item xs={12} sx={{ display: 'flex', alignItems: 'center', gap: 2 }}>
                                    <Box sx={{ position: 'relative' }}>
                                        <Avatar src={form.avatar} sx={{ width: 64, height: 64, bgcolor: '#e0e0e0' }} />
                                        <IconButton
                                            color="primary"
                                            aria-label="upload picture"
                                            component="label"
                                            sx={{ position: 'absolute', bottom: -10, right: -10, bgcolor: 'white', '&:hover': { bgcolor: '#f5f5f5' } }}
                                        >
                                            <input hidden accept="image/*" type="file" onChange={(e) => {
                                                const file = e.target.files[0];
                                                if (file) {
                                                    const reader = new FileReader();
                                                    reader.onloadend = () => {
                                                        setForm(prev => ({ ...prev, avatar: reader.result }));
                                                    };
                                                    reader.readAsDataURL(file);
                                                }
                                            }} />
                                            <span className="material-icons" style={{ fontSize: 20 }}>photo_camera</span>
                                        </IconButton>
                                    </Box>
                                    <Typography variant="body2" color="textSecondary">Tải lên ảnh chân dung</Typography>
                                </Grid>

                                <Grid item xs={6}><TextField label="Số Điện Thoại" fullWidth size="small" value={form.soDienThoai} onChange={(e) => setForm({ ...form, soDienThoai: e.target.value })} /></Grid>

                                            <MenuItem value="Nam">Nam</MenuItem>
                                            <MenuItem value="Nữ">Nữ</MenuItem>

        // --- CALENDAR VIEW ---
        const CalendarView = () => {
            const { employees } = React.useContext(DataContext);
            const [currentDate, setCurrentDate] = useState(moment());
            const [holidays, setHolidays] = useState([]);
            const [attendance, setAttendance] = useState([]);
            const [localLeaves, setLocalLeaves] = useState([]);
            const [selectedDay, setSelectedDay] = useState(null);
            const [openDialog, setOpenDialog] = useState(false);

            useEffect(() => {
                const year = currentDate.year();
                const month = currentDate.month() + 1;
                callServer('getCalendarEvents', month, year).then(res => {
                    if (res) {
                        setHolidays(res.holidays || []);
                        setAttendance(res.attendance || []);
                        setLocalLeaves(res.leaves || []);
                    }
                }).catch(console.error);
            }, [currentDate]);

            // Calendar Logic
            const startOfMonth = currentDate.clone().startOf('month');
            const endOfMonth = currentDate.clone().endOf('month');
            const emptySlots = startOfMonth.day() === 0 ? 6 : startOfMonth.day() - 1;

            const daysInMonth = currentDate.daysInMonth();

            const days = [];
            for (let i = 0; i < emptySlots; i++) days.push(null);
            for (let i = 1; i <= daysInMonth; i++) {
                days.push(currentDate.clone().date(i));
            }

            const prevMonth = () => setCurrentDate(prev => prev.clone().subtract(1, 'months'));
            const nextMonth = () => setCurrentDate(prev => prev.clone().add(1, 'months'));
            const goToToday = () => setCurrentDate(moment());

            const getEventsForDay = (dateMoment) => {
                if (!dateMoment) return { leaves: [], holiday: null, attendanceIssues: [], summary: { leave: 0, late: 0, absent: 0 } };

                const dateStr = dateMoment.format('YYYY-MM-DD');

                // Holiday Check
                const holiday = holidays.find(h => h.date === dateStr);

                // Leave Check
                // Leave Check
                const dayLeaves = localLeaves.filter(l => {
                    if (!l.trangThai || l.trangThai.trim() !== 'Đã Duyệt') return false;
                    // Backend sends YYYY-MM-DD strings. dateStr is also YYYY-MM-DD.
                    // String comparison is sufficient and robust for yyyy-mm-dd format.
                    return dateStr >= l.tuNgay && dateStr <= l.denNgay;
                });

                // Attendance Check
                const dayAtt = attendance.filter(a => a.date === dateStr);
                const issues = dayAtt.filter(a => a.trangThai === 'Vắng' || a.trangThai === 'Đi Muộn');

                return {
                    leaves: dayLeaves,
                    holiday,
                    attendanceIssues: issues,
                    summary: {
                        leave: dayLeaves.length,
                        late: issues.filter(x => x.trangThai === 'Đi Muộn').length,
                        absent: issues.filter(x => x.trangThai === 'Vắng').length,
                    }
                };
            };

            const handleDayClick = (dateMoment) => {
                if (!dateMoment) return;
                const events = getEventsForDay(dateMoment);
                setSelectedDay({
                    date: dateMoment.toDate(), // keep for dialog title
                    ...events
                });
                setOpenDialog(true);
            };

            const dayNames = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];

            return (
                <Box>
                    <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', mb: 3 }}>
                        <Typography variant="h5" color="textPrimary">Lịch Làm Việc</Typography>
                        <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                            <Button size="small" variant="outlined" onClick={goToToday} sx={{ mr: 1 }}>Hôm nay</Button>
                            <IconButton onClick={prevMonth}><span className="material-icons">chevron_left</span></IconButton>
                            <Typography variant="h6" sx={{ minWidth: 140, textAlign: 'center' }}>Tháng {currentDate.format('M / YYYY')}</Typography>
                            <IconButton onClick={nextMonth}><span className="material-icons">chevron_right</span></IconButton>
                        </Box>
                    </Box>

                    <Paper sx={{ p: 2, borderRadius: 3 }}>
                        <Grid container spacing={1} sx={{ mb: 1 }}>
                            {dayNames.map((d, i) => (
                                <Grid item xs={1.7} key={i}>
                                    <Box sx={{ p: 1, textAlign: 'center', fontWeight: 'bold', color: '#6b7280', bgcolor: '#f3f4f6', borderRadius: 1 }}>{d}</Box>
                                </Grid>
                            ))}
                        </Grid>

                        <Grid container spacing={1}>
                            {days.map((dateMoment, i) => {
                                const { holiday, summary } = getEventsForDay(dateMoment);
                                const isToday = dateMoment && dateMoment.isSame(moment(), 'day');
                                const isWeekend = dateMoment && (dateMoment.day() === 0 || dateMoment.day() === 6);

                                return (
                                    <Grid item xs={1.7} key={i}>
                                        <Paper
                                            variant="outlined"
                                            sx={{
                                                height: 110,
                                                p: 1,
                                                bgcolor: !dateMoment ? 'transparent' : (isToday ? '#eff6ff' : '#fff'),
                                                borderColor: isToday ? 'primary.main' : '#e5e7eb',
                                                borderStyle: !dateMoment ? 'none' : 'solid',
                                                cursor: dateMoment ? 'pointer' : 'default',
                                                display: 'flex',
                                                flexDirection: 'column',
                                                overflow: 'hidden',
                                                transition: 'all 0.2s',
                                                '&:hover': { bgcolor: dateMoment ? '#f9fafb' : 'transparent', boxShadow: dateMoment ? 1 : 0 }
                                            }}
                                            onClick={() => handleDayClick(dateMoment)}
                                        >
                                            {dateMoment && (
                                                <>
                                                    <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.5 }}>
                                                        <Typography variant="body2" fontWeight={isToday ? 'bold' : 'normal'} color={isToday ? 'primary' : isWeekend ? 'error' : 'textPrimary'}>
                                                            {dateMoment.date()}
                                                        </Typography>
                                                    </Box>

                                                    <Box sx={{ display: 'flex', flexDirection: 'column', gap: 0.5 }}>
                                                        {holiday && (
                                                            <Chip label={holiday.name} size="small" sx={{ height: 20, fontSize: 10, bgcolor: '#fee2e2', color: '#dc2626', fontWeight: 600 }} />
                                                        )}

                                                        {/* SUMMARY CHIPS */}
                                                        {summary.leave > 0 && (
                                                            <Chip label={`${summary.leave} Nghỉ`} size="small" sx={{ height: 20, fontSize: 10, bgcolor: '#fff7ed', color: '#c2410c', border: '1px solid #ffedd5', justifyContent: 'flex-start', px: 0.5, '& .MuiChip-label': { px: 1 } }} />
                                                        )}
                                                        {summary.late > 0 && (
                                                            <Chip label={`${summary.late} Muộn`} size="small" sx={{ height: 20, fontSize: 10, bgcolor: '#fef9c3', color: '#854d0e', border: '1px solid #facc15', justifyContent: 'flex-start', px: 0.5, '& .MuiChip-label': { px: 1 } }} />
                                                        )}
                                                        {summary.absent > 0 && (
                                                            <Chip label={`${summary.absent} Vắng`} size="small" sx={{ height: 20, fontSize: 10, bgcolor: '#fee2e2', color: '#991b1b', border: '1px solid #fca5a5', justifyContent: 'flex-start', px: 0.5, '& .MuiChip-label': { px: 1 } }} />
                                                        )}
                                                    </Box>
                                                </>
                                            )}
                                        </Paper>
                                    </Grid>
                                );
                            })}
                        </Grid>
                    </Paper>

                    {/* DETAIL DIALOG */}
                    <Dialog open={openDialog} onClose={() => setOpenDialog(false)} maxWidth="xs" fullWidth PaperProps={{ sx: { borderRadius: 3 } }}>
                        <DialogTitle sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                            <span className="material-icons" style={{ color: '#3b82f6' }}>calendar_today</span>
                            {selectedDay?.date && `Ngày ${selectedDay.date.getDate()} tháng ${selectedDay.date.getMonth() + 1}`}
                        </DialogTitle>
                        <Divider />
                        <DialogContent>
                            {selectedDay?.holiday && (
                                <Box sx={{ mb: 2, p: 1.5, bgcolor: '#fef2f2', borderRadius: 2, color: '#dc2626', display: 'flex', alignItems: 'center', gap: 1 }}>
                                    <span className="material-icons" style={{ fontSize: 20 }}>celebration</span>
                                    <Typography variant="subtitle2" fontWeight="bold">{selectedDay.holiday.name}</Typography>
                                </Box>
                            )}

                            {/* LEAVES LIST */}
                            {selectedDay?.leaves.length > 0 && (
                                <Box sx={{ mb: 2 }}>
                                    <Typography variant="subtitle2" sx={{ mb: 1, fontWeight: 'bold' }}>Nghỉ Phép ({selectedDay.leaves.length})</Typography>
                                    <List dense sx={{ bgcolor: '#fff7ed', borderRadius: 2 }}>
                                        {selectedDay.leaves.map((l, i) => {
                                            const emp = employees.find(e => e.maNV === l.maNV);
                                            return (
                                                <ListItem key={i}>
                                                    <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5 }}>
                                                        <Avatar sx={{ width: 28, height: 28, fontSize: 12, bgcolor: '#f97316' }}>{emp?.hoTen?.charAt(0)}</Avatar>
                                                        <Box>
                                                            <Typography variant="body2" fontWeight="600">{emp?.hoTen}</Typography>
                                                            <Typography variant="caption" display="block" color="textSecondary">{l.loaiNghi}</Typography>
                                                        </Box>
                                                    </Box>
                                                </ListItem>
                                            );
                                        })}
                                    </List>
                                </Box>
                            )}

                            {/* ATTENDANCE ISSUES LIST */}
                            {selectedDay?.attendanceIssues.length > 0 && (
                                <Box>
                                    <Typography variant="subtitle2" sx={{ mb: 1, fontWeight: 'bold' }}>Vắng / Đi Muộn ({selectedDay.attendanceIssues.length})</Typography>
                                    <List dense sx={{ bgcolor: '#fef2f2', borderRadius: 2 }}>
                                        {selectedDay.attendanceIssues.map((a, i) => {
                                            const emp = employees.find(e => e.maNV === a.maNV);
                                            const isLate = a.trangThai === 'Đi Muộn';
                                            return (
                                                <ListItem key={i}>
                                                    <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5 }}>
                                                        <Avatar sx={{ width: 28, height: 28, fontSize: 12, bgcolor: isLate ? '#eab308' : '#ef4444' }}>{emp?.hoTen?.charAt(0)}</Avatar>
                                                        <Box>
                                                            <Typography variant="body2" fontWeight="600">{emp?.hoTen}</Typography>
                                                            <Typography variant="caption" display="block" color="textSecondary">{isLate ? 'Đi Muộn' : 'Vắng mặt'}</Typography>
                                                        </Box>
                                                    </Box>
                                                </ListItem>
                                            );
                                        })}
                                    </List>
                                </Box>
                            )}

                            {/* EMPTY STATE */}
                            {(!selectedDay?.leaves.length && !selectedDay?.attendanceIssues.length && !selectedDay?.holiday) && (
                                <Box sx={{ p: 4, textAlign: 'center', color: 'text.secondary' }}>
                                    <Typography variant="body2">Không có sự kiện đặc biệt hôm nay.</Typography>
                                </Box>
                            )}

                        </DialogContent>
                        <DialogActions>
                            <Button onClick={() => setOpenDialog(false)}>Đóng</Button>
                        </DialogActions>
                    </Dialog>
                </Box>
            );
        };

        // --- TIMEKEEPING VIEW ---
        const Timekeeping = () => {
            const { employees, leaves } = React.useContext(DataContext);
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [attendanceData, setAttendanceData] = useState({}); // { [maNV]: { trangThai, gioVao, gioRa, ghiChu } }
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState({ open: false, msg: '' });

            // Fetch attendance for date
            useEffect(() => {
                setLoading(true);
                const dateStr = selectedDate.toISOString().split('T')[0];
                callServer('getAttendance', dateStr).then(data => {
                    const mapping = {};
                    data.forEach(x => mapping[x.maNV] = x);
                    setAttendanceData(mapping);
                    setLoading(false);
                }).catch(() => setLoading(false));
            }, [selectedDate]);

            const handleDateChange = (days) => {
                const newDate = new Date(selectedDate);
                newDate.setDate(selectedDate.getDate() + days);
                setSelectedDate(newDate);
            };

            const getEmployeeLeaveStatus = (maNV) => {
                const dateStr = selectedDate.toISOString().split('T')[0];
                const checkDate = new Date(selectedDate);
                checkDate.setHours(0, 0, 0, 0);

                return leaves.find(l => {
                    if (l.maNV !== maNV || l.trangThai !== 'Đã Duyệt') return false;
                    const start = new Date(l.tuNgay); start.setHours(0, 0, 0, 0);
                    const end = new Date(l.denNgay); end.setHours(0, 0, 0, 0);
                    return checkDate >= start && checkDate <= end;
                });
            };

            const handleStatusChange = (maNV, newStatus) => {
                setAttendanceData(prev => ({
                    ...prev,
                    [maNV]: { ...prev[maNV], maNV, trangThai: newStatus }
                }));
            };

            const handleInputChange = (maNV, field, value) => {
                setAttendanceData(prev => ({
                    ...prev,
                    [maNV]: { ...prev[maNV], maNV, [field]: value }
                }));
            };

            const markAllPresent = () => {
                const newData = { ...attendanceData };
                employees.forEach(e => {
                    const leave = getEmployeeLeaveStatus(e.maNV);
                    // Only mark present if not already marked and not on leave
                    if (!newData[e.maNV] && !leave) {
                        newData[e.maNV] = { maNV: e.maNV, trangThai: 'Có Mặt', gioVao: '08:00', gioRa: '17:30', ghiChu: '' };
                    }
                });
                setAttendanceData(newData);
            };

            const handleSave = () => {
                setLoading(true);
                const dateStr = selectedDate.toISOString().split('T')[0];
                // Convert mapping to array
                const records = Object.values(attendanceData).map(x => ({
                    maNV: x.maNV,
                    trangThai: x.trangThai || 'Vắng',
                    gioVao: x.gioVao || '',
                    gioRa: x.gioRa || '',
                    ghiChu: x.ghiChu || ''
                }));

                callServer('saveAttendance', dateStr, records).then(() => {
                    setToast({ open: true, msg: 'Đã lưu chấm công!' });
                    setLoading(false);
                }).catch(() => {
                    setToast({ open: true, msg: 'Lỗi khi lưu!' });
                    setLoading(false);
                });
            };

            const isSameDate = (d1, d2) => d1.getDate() === d2.getDate() && d1.getMonth() === d2.getMonth() && d1.getFullYear() === d2.getFullYear();
            const today = new Date();
            const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
            const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);

            return (
                <Box>
                    <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', mb: 3 }}>
                        <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                            <IconButton onClick={() => handleDateChange(-1)} size="small"><span className="material-icons">chevron_left</span></IconButton>
                            <Typography variant="h5" color="textPrimary">Chấm Công {selectedDate.toLocaleDateString('vi-VN')}</Typography>
                            <IconButton onClick={() => handleDateChange(1)} size="small"><span className="material-icons">chevron_right</span></IconButton>
                        </Box>
                        <Box sx={{ display: 'flex', gap: 1 }}>
                            <Button variant={isSameDate(selectedDate, yesterday) ? "contained" : "outlined"} onClick={() => setSelectedDate(yesterday)}>Hôm Qua</Button>
                            <Button variant={isSameDate(selectedDate, today) ? "contained" : "outlined"} onClick={() => setSelectedDate(today)}>Hôm Nay</Button>
                            <Button variant={isSameDate(selectedDate, tomorrow) ? "contained" : "outlined"} onClick={() => setSelectedDate(tomorrow)}>Ngày Mai</Button>
                        </Box>
                    </Box>

                    <Paper sx={{ p: 2, mb: 3, borderRadius: 3 }}>
                        <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', mb: 2 }}>
                            <Typography variant="subtitle1" fontWeight="bold">Danh sách nhân viên</Typography>
                            <Box sx={{ display: 'flex', gap: 1 }}>
                                <Button variant="contained" color="primary" onClick={markAllPresent}>Chấm công tất cả</Button>
                                <Button variant="contained" color="success" onClick={handleSave} disabled={loading}>
                                    {loading ? <CircularProgress size={24} color="inherit" /> : 'Lưu Dữ Liệu'}
                                </Button>
                            </Box>
                        </Box>

                        <TableContainer sx={{ maxHeight: '60vh' }}>
                            <Table stickyHeader size="small">
                                <TableHead>
                                    <TableRow>
                                        <TableCell>Nhân Viên</TableCell>
                                        <TableCell>Trạng Thái</TableCell>
                                        <TableCell>Giờ Vào - Ra</TableCell>
                                        <TableCell>Ghi Chú</TableCell>
                                    </TableRow>
                                </TableHead>
                                <TableBody>
                                    {employees.length === 0 ? (
                                        <TableRow><TableCell colSpan={4} align="center" sx={{ py: 3, color: 'text.secondary' }}>Chưa có dữ liệu nhân viên để chấm công</TableCell></TableRow>
                                    ) : employees.map(emp => {
                                        const record = attendanceData[emp.maNV] || {};
                                        const leave = getEmployeeLeaveStatus(emp.maNV);
                                        const status = leave ? 'NghiPhep' : (record.trangThai || '');

                                        return (
                                            <TableRow key={emp.maNV} hover>
                                                <TableCell>
                                                    <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5 }}>
                                                        <Avatar sx={{ width: 32, height: 32 }}>{emp.hoTen.charAt(0)}</Avatar>
                                                        <Box>
                                                            <Typography variant="subtitle2">{emp.hoTen}</Typography>
                                                            <Typography variant="caption" color="textSecondary">{emp.maNV}</Typography>
                                                        </Box>
                                                    </Box>
                                                </TableCell>
                                                <TableCell>
                                                    <Box sx={{ display: 'flex', gap: 0.5 }}>
                                                        <Chip
                                                            label="Có mặt"
                                                            clickable
                                                            color={status === 'Có Mặt' ? 'success' : 'default'}
                                                            onClick={() => !leave && handleStatusChange(emp.maNV, 'Có Mặt')}
                                                            variant={status === 'Có Mặt' ? 'filled' : 'outlined'}
                                                            sx={{ opacity: leave ? 0.5 : 1 }}
                                                        />
                                                        <Chip
                                                            label="Đi muộn"
                                                            clickable
                                                            color={status === 'Đi Muộn' ? 'warning' : 'default'}
                                                            onClick={() => !leave && handleStatusChange(emp.maNV, 'Đi Muộn')}
                                                            variant={status === 'Đi Muộn' ? 'filled' : 'outlined'}
                                                            sx={{ opacity: leave ? 0.5 : 1 }}
                                                        />
                                                        {leave ? (
                                                            <Chip label="Nghỉ Phép" color="info" variant="filled" />
                                                        ) : (
                                                            <Chip
                                                                label="Vắng"
                                                                clickable
                                                                color={status === 'Vắng' ? 'error' : 'default'}
                                                                onClick={() => handleStatusChange(emp.maNV, 'Vắng')}
                                                                variant={status === 'Vắng' ? 'filled' : 'outlined'}
                                                            />
                                                        )}
                                                    </Box>
                                                </TableCell>
                                                <TableCell>
                                                    <Box sx={{ display: 'flex', gap: 1, alignItems: 'center' }}>
                                                        <TextField
                                                            type="time"
                                                            size="small"
                                                            variant="standard"
                                                            value={record.gioVao || ''}
                                                            onChange={(e) => handleInputChange(emp.maNV, 'gioVao', e.target.value)}
                                                            disabled={status !== 'Có Mặt' && status !== 'Đi Muộn'}
                                                        />
                                                        <Typography>-</Typography>
                                                        <TextField
                                                            type="time"
                                                            size="small"
                                                            variant="standard"
                                                            value={record.gioRa || ''}
                                                            onChange={(e) => handleInputChange(emp.maNV, 'gioRa', e.target.value)}
                                                            disabled={status !== 'Có Mặt' && status !== 'Đi Muộn'}
                                                        />
                                                    </Box>
                                                </TableCell>
                                                <TableCell>
                                                    <TextField
                                                        size="small"
                                                        variant="standard"
                                                        placeholder="..."
                                                        value={record.ghiChu || (leave ? leave.lyDo : '')}
                                                        onChange={(e) => handleInputChange(emp.maNV, 'ghiChu', e.target.value)}
                                                    />
                                                </TableCell>
                                            </TableRow>
                                        );
                                    })}
                                </TableBody>
                            </Table>
                        </TableContainer>
                    </Paper>
                    <Snackbar open={toast.open} autoHideDuration={3000} onClose={() => setToast({ ...toast, open: false })}><Alert severity={toast.msg.includes('Lỗi') ? 'error' : 'success'} variant="filled">{toast.msg}</Alert></Snackbar>
                </Box>
            );
        };

        // --- GPS SETTINGS COMPONENT (ADMIN) ---
        const GPSSettings = () => {
            const [form, setForm] = useState({ latitude: '', longitude: '', radius: 200, address: '' });
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [toast, setToast] = useState({ open: false, msg: '', severity: 'success' });
            const [detecting, setDetecting] = useState(false);

            useEffect(() => {
                callServer('getOfficeLocation').then(res => {
                    if (res) {
                        setForm({
                            latitude: res.latitude || '',
                            longitude: res.longitude || '',
                            radius: res.radius || 200,
                            address: res.address || ''
                        });
                    }
                    setLoading(false);
                }).catch(() => setLoading(false));
            }, []);

            const handleDetectLocation = () => {
                if (!navigator.geolocation) {
                    setToast({ open: true, msg: 'Trình duyệt không hỗ trợ GPS', severity: 'error' });
                    return;
                }
                setDetecting(true);
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        setForm(prev => ({
                            ...prev,
                            latitude: pos.coords.latitude.toFixed(6),
                            longitude: pos.coords.longitude.toFixed(6)
                        }));
                        setDetecting(false);
                        setToast({ open: true, msg: 'Đã lấy tọa độ hiện tại!', severity: 'success' });
                    },
                    (err) => {
                        setDetecting(false);
                        setToast({ open: true, msg: 'Không thể lấy vị trí: ' + err.message, severity: 'error' });
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            };

            const handleSave = () => {
                if (!form.latitude || !form.longitude) {
                    setToast({ open: true, msg: 'Vui lòng nhập tọa độ', severity: 'error' });
                    return;
                }
                setSaving(true);
                callServer('saveOfficeLocation', {
                    latitude: parseFloat(form.latitude),
                    longitude: parseFloat(form.longitude),
                    radius: parseInt(form.radius),
                    address: form.address
                }).then(res => {
                    setSaving(false);
                    if (res && res.success) {
                        setToast({ open: true, msg: 'Đã lưu cài đặt GPS!', severity: 'success' });
                    } else {
                        setToast({ open: true, msg: 'Lỗi khi lưu!', severity: 'error' });
                    }
                }).catch(() => {
                    setSaving(false);
                    setToast({ open: true, msg: 'Lỗi kết nối!', severity: 'error' });
                });
            };

            const mapUrl = form.latitude && form.longitude
                ? `https://maps.google.com/maps?q=${form.latitude},${form.longitude}&z=17&output=embed`
                : null;

            if (loading) return <Box sx={{ display: 'flex', justifyContent: 'center', p: 10 }}><CircularProgress /></Box>;

            return (
                <Box>
                    <Box sx={{ mb: { xs: 2, md: 4 } }}>
                        <Typography variant="h5" sx={{ color: '#111827', fontWeight: 700, fontSize: { xs: '1.25rem', md: '1.5rem' } }}>Cài Đặt Chấm Công GPS</Typography>
                        <Typography variant="body2" color="textSecondary" sx={{ mt: 0.5 }}>Thiết lập tọa độ văn phòng để nhân viên tự chấm công bằng GPS</Typography>
                    </Box>

                    <Grid container spacing={{ xs: 2, md: 3 }}>
                        {/* Settings Form */}
                        <Grid item xs={12} md={5}>
                            <Paper sx={{ p: { xs: 2, md: 3 }, borderRadius: 3, boxShadow: 2 }}>
                                <Box sx={{ display: 'flex', alignItems: 'center', gap: 1, mb: 3 }}>
                                    <Box sx={{ p: 1, borderRadius: 2, bgcolor: '#eff6ff', color: '#3b82f6' }}>
                                        <span className="material-icons">settings_suggest</span>
                                    </Box>
                                    <Typography variant="h6" sx={{ fontWeight: 600 }}>Tọa Độ Văn Phòng</Typography>
                                </Box>

                                <Stack spacing={2.5}>
                                    <TextField
                                        label="Địa chỉ văn phòng"
                                        fullWidth
                                        size="small"
                                        value={form.address}
                                        onChange={(e) => setForm({ ...form, address: e.target.value })}
                                        placeholder="VD: 123 Nguyễn Huệ, Q1, TP.HCM"
                                        InputProps={{
                                            startAdornment: <span className="material-icons" style={{ color: '#9ca3af', marginRight: 8, fontSize: 20 }}>location_on</span>
                                        }}
                                    />

                                    <Grid container spacing={2}>
                                        <Grid item xs={6}>
                                            <TextField
                                                label="Vĩ độ (Latitude)"
                                                fullWidth
                                                size="small"
                                                type="number"
                                                value={form.latitude}
                                                onChange={(e) => setForm({ ...form, latitude: e.target.value })}
                                                inputProps={{ step: '0.000001' }}
                                            />
                                        </Grid>
                                        <Grid item xs={6}>
                                            <TextField
                                                label="Kinh độ (Longitude)"
                                                fullWidth
                                                size="small"
                                                type="number"
                                                value={form.longitude}
                                                onChange={(e) => setForm({ ...form, longitude: e.target.value })}
                                                inputProps={{ step: '0.000001' }}
                                            />
                                        </Grid>
                                    </Grid>

                                    <Button
                                        variant="outlined"
                                        color="secondary"
                                        fullWidth
                                        startIcon={detecting ? <CircularProgress size={20} /> : <span className="material-icons">gps_fixed</span>}
                                        onClick={handleDetectLocation}
                                        disabled={detecting}
                                    >
                                        {detecting ? 'Đang xác định...' : 'Lấy tọa độ hiện tại'}
                                    </Button>

                                    <Box>
                                        <Typography variant="subtitle2" sx={{ mb: 1, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 1 }}>
                                            <span className="material-icons" style={{ fontSize: 18, color: '#f59e0b' }}>radar</span>
                                            Bán kính cho phép: <Chip label={`${form.radius}m`} size="small" color="primary" />
                                        </Typography>
                                        <Slider
                                            value={form.radius}
                                            onChange={(e, val) => setForm({ ...form, radius: val })}
                                            min={50}
                                            max={1000}
                                            step={50}
                                            marks={[
                                                { value: 50, label: '50m' },
                                                { value: 200, label: '200m' },
                                                { value: 500, label: '500m' },
                                                { value: 1000, label: '1km' }
                                            ]}
                                            valueLabelDisplay="auto"
                                            valueLabelFormat={(v) => `${v}m`}
                                        />
                                    </Box>

                                    <Alert severity="info" variant="outlined" sx={{ borderRadius: 2 }}>
                                        <Typography variant="caption">Nhân viên cần ở trong bán kính <b>{form.radius}m</b> từ văn phòng để chấm công.</Typography>
                                    </Alert>

                                    <Button
                                        variant="contained"
                                        color="success"
                                        size="large"
                                        fullWidth
                                        startIcon={saving ? <CircularProgress size={20} color="inherit" /> : <span className="material-icons">save</span>}
                                        onClick={handleSave}
                                        disabled={saving || !form.latitude || !form.longitude}
                                        sx={{ py: 1.5, fontWeight: 700, fontSize: '1rem' }}
                                    >
                                        {saving ? 'Đang lưu...' : 'Lưu Cài Đặt'}

// --- GPS CHECK-IN COMPONENT (EMPLOYEE) ---
const GPSCheckIn = () => {
    // Thêm 'employees' vào Context để kiểm tra xem nhân viên đã đăng ký mặt chưa
    const { user, employees } = React.useContext(DataContext); 
    const [gpsStatus, setGpsStatus] = useState('idle'); // idle, loading, success, error
    const [userLocation, setUserLocation] = useState(null);
    const [officeLocation, setOfficeLocation] = useState(null);
    const [distance, setDistance] = useState(null);
    const [checkingIn, setCheckingIn] = useState(false);
    const [todayRecord, setTodayRecord] = useState(null);
    const [result, setResult] = useState(null);
    const [toast, setToast] = useState({ open: false, msg: '', severity: 'success' });
    const [currentTime, setCurrentTime] = useState(new Date());

    const [showFaceScanner, setShowFaceScanner] = useState(false);

    // Cập nhật đồng hồ mỗi giây
    useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
    }, []);

    // Tải vị trí văn phòng & lịch sử điểm danh hôm nay
    useEffect(() => {
        callServer('getOfficeLocation').then(res => {
            if (res) setOfficeLocation(res);
        });
        if (user?.maNV) {
            callServer('getMyAttendanceToday', user.maNV).then(res => {
                if (res) setTodayRecord(res);
            });
        }
    }, [user]);

    // Tính toán khoảng cách (Haversine)
    const calcDistance = (lat1, lng1, lat2, lng2) => {
        const toRad = (deg) => deg * Math.PI / 180;
        const R = 6371000;
        const dLat = toRad(lat2 - lat1);
        const dLng = toRad(lng2 - lng1);
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    };

    // Lấy vị trí GPS ngầm
    const detectLocation = useCallback(() => {
        if (!navigator.geolocation) {
            setGpsStatus('error');
            return;
        }
        setGpsStatus('loading');
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const loc = { latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: pos.coords.accuracy };
                setUserLocation(loc);
                setGpsStatus('success');
                if (officeLocation && officeLocation.latitude) {
                    const dist = calcDistance(loc.latitude, loc.longitude, officeLocation.latitude, officeLocation.longitude);
                    setDistance(Math.round(dist));
                }
            },
            (err) => {
                setGpsStatus('error');
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }, [officeLocation]);

    // Tự động tìm GPS khi mở màn hình
    useEffect(() => {
        if (officeLocation) detectLocation();
    }, [officeLocation]);

    const isInRange = distance !== null && officeLocation && distance <= officeLocation.radius;
    const isMobile = useMediaQuery(theme.breakpoints.down('sm'));

    // ==========================================
    // LUỒNG XỬ LÝ MỚI: QUÉT MẶT TRƯỚC -> GPS SAU
    // ==========================================

    const handleCheckInClick = () => {
        // Kiểm tra xem nhân viên đã được Admin đăng ký khuôn mặt chưa
        const currentEmp = employees.find(e => e.maNV === user.maNV) || user;
        if (!currentEmp.face_data) {
            setToast({ open: true, msg: '❌ Bạn chưa được đăng ký khuôn mặt! Vui lòng liên hệ Admin.', severity: 'error' });
            return;
        }
        
        // Đã có dữ liệu mặt -> Luôn mở Camera đầu tiên
        setShowFaceScanner(true);
    };

    const handleFaceVerified = () => {
        setShowFaceScanner(false); // Tắt popup camera

        // Sau khi mặt khớp, bắt đầu kiểm duyệt GPS
        if (!userLocation || gpsStatus !== 'success') {
            setToast({ open: true, msg: '❌ Chưa lấy được tọa độ GPS. Vui lòng bật định vị và thử lại.', severity: 'error' });
            return;
        }
        
        if (!isInRange) {
            setToast({ open: true, msg: `❌ Bạn đang ở ngoài phạm vi (${Math.round(distance)}m > ${officeLocation.radius}m). Hãy di chuyển lại gần văn phòng!`, severity: 'error' });
            return;
        }

        // GPS hợp lệ -> Ghi nhận lên máy chủ
        executeCheckInOnServer();
    };

    const executeCheckInOnServer = () => {
        setCheckingIn(true);
        callServer('gpsCheckIn', user.maNV, userLocation.latitude, userLocation.longitude)
            .then(res => {
                setCheckingIn(false);
                setResult(res);
                if (res.success) {
                    setToast({ open: true, msg: res.message, severity: 'success' });
                    // Tải lại lịch sử để hiện giờ ra/vào mới
                    callServer('getMyAttendanceToday', user.maNV).then(r => {
                        if (r) setTodayRecord(r);
                    });
                } else {
                    setToast({ open: true, msg: res.message, severity: 'error' });
                }
            })
            .catch(err => {
                setCheckingIn(false);
                setToast({ open: true, msg: 'Lỗi kết nối máy chủ', severity: 'error' });
            });
    };

    return (
        <Box>

                <Typography variant="body2" color="textSecondary" sx={{ mt: 0.5 }}>Hệ thống yêu cầu xác thực kép để đảm bảo tính chính xác</Typography>
            </Box>

            <Grid container spacing={{ xs: 2, md: 3 }}>
                <Grid item xs={12} md={7}>
                    <Paper sx={{
                        borderRadius: { xs: 3, md: 4 }, overflow: 'hidden', boxShadow: 3,
                        background: 'linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%)',
                        color: 'white', position: 'relative'
                    }}>
                        <Box sx={{ position: 'absolute', top: -30, right: -30, width: 200, height: 200, borderRadius: '50%', bgcolor: 'rgba(255,255,255,0.05)', display: { xs: 'none', sm: 'block' } }} />
                        <Box sx={{ position: 'absolute', bottom: -50, left: -50, width: 250, height: 250, borderRadius: '50%', bgcolor: 'rgba(255,255,255,0.03)', display: { xs: 'none', sm: 'block' } }} />

                        <Box sx={{ p: { xs: 2.5, sm: 3, md: 4 }, position: 'relative', zIndex: 1 }}>
                            {/* Đồng hồ */}
                            <Box sx={{ textAlign: 'center', mb: { xs: 2.5, md: 4 } }}>
                                <Typography sx={{ fontWeight: 800, letterSpacing: { xs: 1, md: 2 }, fontFamily: 'monospace', fontSize: { xs: '2rem', sm: '2.5rem', md: '3.5rem' }, lineHeight: 1.1 }}>
                                    {currentTime.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                                </Typography>
                                <Typography variant="body2" sx={{ opacity: 0.7, mt: { xs: 0.5, md: 1 }, fontSize: { xs: '0.75rem', md: '0.875rem' } }}>
                                    {currentTime.toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                                </Typography>
                            </Box>

                            {/* Trạng thái GPS */}
                            <Box sx={{ display: 'flex', flexDirection: 'column', alignItems: 'center', mb: { xs: 2.5, md: 4 } }}>
                                <div className="gps-pulse-wrapper" style={{ marginBottom: 16 }}>
                                    {gpsStatus === 'success' && <div className={`gps-pulse-ring ${isInRange ? '' : 'error'}`} />}
                                    {gpsStatus === 'loading' ? (
                                        <CircularProgress size={40} sx={{ color: 'white' }} />
                                    ) : (
                                        <div className={`gps-pulse-dot ${gpsStatus === 'success' && isInRange ? '' : 'error'}`} style={{ width: 40, height: 40 }} />
                                    )}
                                </div>

                                {gpsStatus === 'idle' && <Typography variant="body2" sx={{ opacity: 0.7 }}>Đang khởi tạo GPS...</Typography>}
                                {gpsStatus === 'loading' && <Typography variant="body2" sx={{ opacity: 0.7 }}>Đang xác định vị trí...</Typography>}

                                        </Typography>
                                    </Box>

                            </Box>

                            {/* Nút bấm điểm danh */}
                            <Box sx={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>

                                            ? 'linear-gradient(135deg, #10b981 0%, #059669 100%)'
                                            : 'linear-gradient(135deg, #6b7280 0%, #4b5563 100%)',
                                        boxShadow: gpsStatus === 'success' && isInRange ? '0 10px 30px -5px rgba(16, 185, 129, 0.5)' : 'none',
                                        '&:hover': {
                                            background: gpsStatus === 'success' && isInRange ? 'linear-gradient(135deg, #059669 0%, #047857 100%)' : undefined,
                                            boxShadow: gpsStatus === 'success' && isInRange ? '0 15px 35px -5px rgba(16, 185, 129, 0.6)' : 'none'

                                    startIcon={checkingIn

        // --- SALARY BOARD COMPONENT ---
        const SalaryBoard = () => {
            const [month, setMonth] = useState(new Date().getMonth() + 1);
            const [year, setYear] = useState(new Date().getFullYear());
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [generating, setGenerating] = useState(false);
