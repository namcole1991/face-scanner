<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <title>HRMS - Quản Lý Nhân Sự</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script crossorigin src="https://unpkg.com/@mui/material@5.15.0/umd/material-ui.development.js"></script>
    <script crossorigin src="https://unpkg.com/@emotion/react@11.11.0/dist/emotion-react.umd.min.js"></script>
    <script crossorigin src="https://unpkg.com/@emotion/styled@11.11.0/dist/emotion-styled.umd.min.js"></script>

    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/vi.min.js"></script>

    <script crossorigin src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        body { margin: 0; background-color: #f3f4f6; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        @keyframes pulse-ring { 0% { transform: scale(0.5); opacity: 1; } 80%, 100% { transform: scale(2.5); opacity: 0; } }
        @keyframes pulse-dot { 0% { transform: scale(0.8); } 50% { transform: scale(1); } 100% { transform: scale(0.8); } }
        .gps-pulse-wrapper { position: relative; display: flex; align-items: center; justify-content: center; }
        .gps-pulse-ring { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: rgba(16, 185, 129, 0.3); animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        .gps-pulse-ring.error { background: rgba(239, 68, 68, 0.3); }
        .gps-pulse-dot { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); animation: pulse-dot 1.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite; z-index: 1; }
        .gps-pulse-dot.error { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in-up { animation: fadeInUp 0.5s ease forwards; }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef, Fragment } = React;
        
        const firebaseConfig = {
          apiKey: "AIzaSyCDNcizfDP75nS-x9f6lw6ww_KeVyJrASg",
          authDomain: "dangnhapdiemdanh.firebaseapp.com",
          projectId: "dangnhapdiemdanh",
          storageBucket: "dangnhapdiemdanh.firebasestorage.app",
          messagingSenderId: "384744808587",
          appId: "1:384744808587:web:15ff256e9f654d9e2ab48e"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        const {
            createTheme, ThemeProvider, CssBaseline, AppBar, Toolbar, Typography, Button, Container, Box,
            Paper, Table, TableBody, TableCell, TableContainer, TableHead, TableRow, Grid, Card, CardContent, Chip, IconButton,
            Dialog, DialogTitle, DialogContent, DialogActions, TextField, Select, MenuItem, FormControl, InputLabel, CircularProgress, Alert, Snackbar,
            Drawer, List, ListItem, ListItemIcon, ListItemText, ListItemButton, Divider, useMediaQuery, Avatar, Stack, Zoom, Collapse, Backdrop, Slider, LinearProgress
        } = MaterialUI;

        const theme = createTheme({
            palette: {
                primary: { main: '#4338ca', light: '#6366f1', dark: '#312e81', contrastText: '#fff' },
                secondary: { main: '#0ea5e9' },
                background: { default: '#f3f4f6', paper: '#ffffff' },
                text: { primary: '#1f2937', secondary: '#6b7280' },
                success: { main: '#10b981', contrastText: '#ffffff' },
                warning: { main: '#f59e0b' },
                error: { main: '#ef4444' },
            },
            typography: {
                fontFamily: '"Inter", "Roboto", "Helvetica", "Arial", sans-serif',
                h4: { fontWeight: 700, letterSpacing: '-0.02em' },
                h5: { fontWeight: 600, letterSpacing: '-0.01em' },
                h6: { fontWeight: 600 },
                subtitle1: { fontWeight: 500 },
                button: { fontWeight: 600, textTransform: 'none' },
            },
            components: {
                MuiPaper: { styleOverrides: { rounded: { borderRadius: 12 } } },
                MuiButton: { styleOverrides: { root: { borderRadius: 8, padding: '8px 16px' } } },
                MuiCard: { styleOverrides: { root: { borderRadius: 16 } } },
                MuiTableCell: { styleOverrides: { head: { backgroundColor: '#f9fafb', color: '#374151', fontWeight: 600 } } },
            },
        });

        // --- API SERVER CALL ---
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxmfBEq7A4pVPTlgyXTXNlVel-OLpCF77WNzBLLdFdlIjQKCP3kWLXMGoNBEq35_61p/exec';

        const callServer = async (func, ...args) => {
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: func, args: args })
                });
                const json = await response.json();
                if (json.success) return json.data;
                else throw new Error(json.error);
            } catch (err) {
                console.error(`[API Error] calling ${func}:`, err);
                throw err;
            }
        };

        const fetchAllData = () => callServer('getAllData').then(raw => typeof raw === 'string' ? JSON.parse(raw) : raw);

        const Icons = { Dashboard: 'dashboard', Employees: 'people', Departments: 'business', Positions: 'badge', Leave: 'event_note', Menu: 'menu', Add: 'add', Delete: 'delete', Edit: 'edit', Check: 'check', Close: 'close', Logout: 'logout' };

        const drawerWidth = 260;

        const MainLayout = ({ children, setView, currentView, user, setUser, settings }) => {
            const [mobileOpen, setMobileOpen] = useState(false);
            const isMobile = useMediaQuery(theme.breakpoints.down('md'));

            const handleDrawerToggle = () => setMobileOpen(!mobileOpen);

            const allMenuItems = [
                { id: 'dashboard', label: 'Tổng quan', icon: Icons.Dashboard, roles: ['ADMIN'] },
                { id: 'timekeeping', label: 'Chấm công', icon: 'fact_check', roles: ['ADMIN'] },
                { id: 'gps_checkin', label: 'Chấm công GPS', icon: 'my_location', roles: ['EMPLOYEE'] },
                { id: 'calendar', label: 'Lịch làm việc', icon: 'calendar_month', roles: ['ADMIN'] },
                { id: 'employees', label: 'Nhân sự', icon: Icons.Employees, roles: ['ADMIN'] },
                { id: 'departments', label: 'Phòng ban', icon: Icons.Departments, roles: ['ADMIN'] },
                { id: 'positions', label: 'Chức vụ', icon: Icons.Positions, roles: ['ADMIN'] },
                { id: 'leave', label: 'Nghỉ phép', icon: Icons.Leave, roles: ['ADMIN', 'EMPLOYEE'] },
                { id: 'salary_settings', label: 'Cài đặt lương', icon: 'payments', roles: ['ADMIN'] },
                { id: 'salary_calculation', label: 'Bảng lương', icon: 'account_balance_wallet', roles: ['ADMIN'] },
                { id: 'gps_settings', label: 'Cài đặt GPS', icon: 'settings_suggest', roles: ['ADMIN'] },
            ];

            const menuItems = allMenuItems.filter(item => item.roles.includes(user?.role || 'ADMIN'));

            const handleLogout = () => {
                localStorage.removeItem('hrms_user');
                setUser(null);
                setView('dashboard');
            };

            const drawerContent = (
                <Box sx={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
                    <Box sx={{ p: 3, display: 'flex', alignItems: 'center', gap: 2 }}>
                        <Box sx={{ p: 1, bgcolor: theme.palette.primary.main, color: '#fff', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <span className="material-icons">business</span>
                        </Box>
                        <Typography variant="h6" color="textPrimary" sx={{ fontWeight: 700, lineHeight: 1.2 }}>{settings?.company_name || 'HRMS System'}</Typography>
                    </Box>
                    <Divider sx={{ mb: 2 }} />
                    <List sx={{ px: 2, flexGrow: 1 }}>
                        {menuItems.map((item) => (
                            <ListItem key={item.id} disablePadding sx={{ mb: 1 }}>
                                <ListItemButton selected={currentView === item.id} onClick={() => { setView(item.id); if (isMobile) setMobileOpen(false); }} sx={{ borderRadius: 2, '&.Mui-selected': { bgcolor: theme.palette.primary.main, color: '#fff', '&:hover': { bgcolor: theme.palette.primary.dark }, '& .material-icons': { color: '#fff' } } }}>
                                    <ListItemIcon sx={{ minWidth: 40, color: currentView === item.id ? 'inherit' : theme.palette.text.secondary }}><span className="material-icons" style={{ fontSize: 24 }}>{item.icon}</span></ListItemIcon>
                                    <ListItemText primary={item.label} primaryTypographyProps={{ fontWeight: currentView === item.id ? 600 : 500 }} />
                                </ListItemButton>
                            </ListItem>
                        ))}
                    </List>
                    <Box sx={{ p: 2 }}>
                        <Card variant="outlined" sx={{ bgcolor: '#f8fafc', border: 'none' }}>
                            <CardContent sx={{ p: 2, '&:last-child': { pb: 2 } }}>
                                <Box sx={{ display: 'flex', alignItems: 'center', gap: 2, mb: 1 }}>
                                    <Avatar sx={{ width: 32, height: 32, bgcolor: theme.palette.secondary.main, fontSize: 14 }}>{user?.name ? user.name.charAt(0) : 'U'}</Avatar>
                                    <Box sx={{ overflow: 'hidden' }}>
                                        <Typography variant="subtitle2" noWrap>{user?.name || 'User'}</Typography>
                                        <Typography variant="caption" color="textSecondary" noWrap>{user?.username || ''}</Typography>
                                    </Box>
                                </Box>
                                <Button size="small" color="error" fullWidth variant="outlined" startIcon={<span className="material-icons">logout</span>} onClick={handleLogout}>Đăng xuất</Button>
                            </CardContent>
                        </Card>
                    </Box>
                </Box>
            );

            return (
                <Box sx={{ display: 'flex' }}>
                    <AppBar position="fixed" sx={{ width: { md: `calc(100% - ${drawerWidth}px)` }, ml: { md: `${drawerWidth}px` }, boxShadow: 'none', bgcolor: 'rgba(255,255,255,0.8)', backdropFilter: 'blur(8px)', borderBottom: '1px solid #e5e7eb', color: theme.palette.text.primary }}>
                        <Toolbar>
                            <IconButton color="inherit" edge="start" onClick={handleDrawerToggle} sx={{ mr: 2, display: { md: 'none' } }}><span className="material-icons">{Icons.Menu}</span></IconButton>
                            <Box sx={{ flexGrow: 1 }} />
                            <IconButton color="default"><span className="material-icons" style={{ color: '#6b7280' }}>notifications</span></IconButton>
                        </Toolbar>
                    </AppBar>
                    <Box component="nav" sx={{ width: { md: drawerWidth }, flexShrink: { md: 0 } }}>
                        <Drawer variant="temporary" open={mobileOpen} onClose={handleDrawerToggle} ModalProps={{ keepMounted: true }} sx={{ display: { xs: 'block', md: 'none' }, '& .MuiDrawer-paper': { boxSizing: 'border-box', width: drawerWidth } }}>{drawerContent}</Drawer>
                        <Drawer variant="permanent" sx={{ display: { xs: 'none', md: 'block' }, '& .MuiDrawer-paper': { boxSizing: 'border-box', width: drawerWidth, borderRight: '1px solid #e5e7eb' } }} open>{drawerContent}</Drawer>
                    </Box>
                    <Box component="main" sx={{ flexGrow: 1, p: 3, width: { md: `calc(100% - ${drawerWidth}px)` }, mt: 8, minHeight: '100vh' }}>
                        <Container maxWidth="xl">{children}</Container>
                    </Box>
                </Box>
            );
        };

        const DataContext = React.createContext(null);

        // --- DASHBOARD COMPONENT ---
        const Dashboard = () => {
            const { stats, loading } = React.useContext(DataContext);
            const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: ReTooltip, Legend, PieChart, Pie, Cell, AreaChart, Area, ResponsiveContainer, ComposedChart } = Recharts;
            const COLORS = ['#0088FE', '#00C49F', '#FFBB28', '#FF8042', '#8884d8', '#82ca9d'];

            const StatCard = ({ title, value, sub, color, icon }) => (
                <Card sx={{ height: '100%', position: 'relative', overflow: 'hidden', boxShadow: 3 }}>
                    <Box sx={{ position: 'absolute', top: 0, right: 0, width: 100, height: 100, background: `linear-gradient(135deg, transparent 40%, ${color}20 100%)`, borderRadius: '0 0 0 100%' }} />
                    <CardContent>
                        <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', mb: 2 }}>
                            <Box sx={{ p: 1.5, borderRadius: 2, bgcolor: `${color}15`, color: color }}><span className="material-icons" style={{ fontSize: 28 }}>{icon}</span></Box>
                        </Box>
                        <Typography variant="h4" sx={{ fontWeight: 700, mb: 0.5 }}>{value}</Typography>
                        <Typography variant="body2" color="textSecondary" sx={{ mb: 1 }}>{title}</Typography>
                        <Typography variant="caption" sx={{ color: color, fontWeight: 600 }}>{sub}</Typography>
                    </CardContent>
                </Card>
            );

            const ChartBox = ({ title, children }) => (
                <Paper sx={{ p: 3, height: 320, display: 'flex', flexDirection: 'column', borderRadius: 3, boxShadow: 2 }}>
                    <Typography variant="h6" sx={{ mb: 2, fontWeight: 600, fontSize: '1rem', color: '#374151' }}>{title}</Typography>
                    <Box sx={{ flexGrow: 1, minHeight: 0 }}><ResponsiveContainer width="100%" height="100%">{children}</ResponsiveContainer></Box>
                </Paper>
            );

            return (
                <Box>
                    <Box sx={{ mb: 4 }}>
                        <Typography variant="h4" sx={{ color: '#111827', fontWeight: 700 }}>Tổng Quan Nhân Sự</Typography>
                    </Box>
                    {loading ? <Box sx={{ display: 'flex', justifyContent: 'center', p: 10 }}><CircularProgress /></Box> : (
                        <Grid container spacing={3}>
                            <Grid item xs={12} sm={6} md={3}><StatCard title="Tổng Nhân Viên" value={stats.totalEmployees} sub="Chính thức" color="#4338ca" icon="groups" /></Grid>
                            <Grid item xs={12} sm={6} md={3}><StatCard title="Có Mặt Hôm Nay" value={stats.presentToday} sub="Đang làm việc" color="#10b981" icon="check_circle" /></Grid>
                            <Grid item xs={12} sm={6} md={3}><StatCard title="Nghỉ Phép" value={stats.onLeaveToday} sub="Đã được duyệt" color="#f59e0b" icon="beach_access" /></Grid>
                            <Grid item xs={12} sm={6} md={3}><StatCard title="Chờ Duyệt" value={stats.pendingLeaves} sub="Cần xử lý ngay" color="#ef4444" icon="pending_actions" /></Grid>

                            <Grid item xs={12} md={8}>
                                <ChartBox title="Biến Động Nhân Sự (12 tháng qua)">
                                    <AreaChart data={stats.charts.growth}>
                                        <defs><linearGradient id="colorGrowth" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#8884d8" stopOpacity={0.8} /><stop offset="95%" stopColor="#8884d8" stopOpacity={0} /></linearGradient></defs>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{ fontSize: 12 }} />
                                        <YAxis axisLine={false} tickLine={false} />
                                        <ReTooltip contentStyle={{ borderRadius: 8, border: 'none', boxShadow: '0 4px 12px rgba(0,0,0,0.1)' }} />
                                        <Area type="monotone" dataKey="value" stroke="#8884d8" fillOpacity={1} fill="url(#colorGrowth)" />
                                    </AreaChart>
                                </ChartBox>
                            </Grid>
                            <Grid item xs={12} md={4}>
                                <ChartBox title="Trạng Thái Đơn Từ">
                                    <PieChart>
                                        <Pie data={stats.charts.leaveStatus} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value">
                                            {stats.charts.leaveStatus.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color || COLORS[index % COLORS.length]} />)}
                                        </Pie>
                                        <ReTooltip /><Legend verticalAlign="bottom" height={36} />
                                    </PieChart>
                                </ChartBox>
                            </Grid>
                        </Grid>
                    )}
                </Box>
            );
        };

        // --- DEPARTMENT MANAGER ---
        const DepartmentManager = () => {
            const { departments, setDepartments, employees, confirmAction } = React.useContext(DataContext);
            const [open, setOpen] = useState(false);
            const [form, setForm] = useState({ maPB: '', tenPB: '', moTa: '' });
            const [toast, setToast] = useState({ open: false, msg: '' });
            const isMobile = useMediaQuery(theme.breakpoints.down('sm'));
            const [expanded, setExpanded] = useState(null);

            const deptStats = useMemo(() => {
                const stats = {};
                employees.forEach(e => {
                    if (!stats[e.phongBan]) stats[e.phongBan] = [];
                    stats[e.phongBan].push(e);
                });
                return stats;
            }, [employees]);

            const handleSubmit = () => {
                const newItem = { ...form };
                setDepartments(prev => [...prev, newItem]);
                setOpen(false); setForm({ maPB: '', tenPB: '', moTa: '' });
                setToast({ open: true, msg: 'Đang thêm...' });

                callServer('addDepartment', newItem).then(() => {
                    setToast({ open: true, msg: 'Thêm thành công!' });
                    fetchAllData().then(data => setDepartments(data.departments));
                }).catch(() => {
                    setToast({ open: true, msg: 'Lỗi khi thêm!' });
                    setDepartments(prev => prev.filter(d => d.maPB !== newItem.maPB));
                });
            };

            const handleDelete = (id) => {
                const performDelete = () => {
                    const prev = [...departments];
                    setDepartments(prev => prev.filter(d => d.maPB !== id));
                    setToast({ open: true, msg: 'Đang xóa...' });
                    callServer('deleteDepartment', id).then(() => setToast({ open: true, msg: 'Đã xóa!' })).catch(() => { setDepartments(prev); setToast({ open: true, msg: 'Lỗi khi xóa!' }); });
                };
                confirmAction('Xác nhận xóa', 'Bạn có chắc chắn muốn xóa phòng ban này?', performDelete);
            };

            const toggleExpand = (maPB) => {
                setExpanded(expanded === maPB ? null : maPB);
            };

            const getGroupedEmployees = (maPB, deptName) => {
                const emps = deptStats[deptName] || [];
                if (emps.length === 0) return null;
                const groups = {};
                emps.forEach(e => {
                    const pos = e.chucVu || 'Khác';
                    if (!groups[pos]) groups[pos] = [];
                    groups[pos].push(e);
                });
                return groups;
            };

            return (
                <Box>
                    <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', mb: 3 }}>
                        <Typography variant="h5" color="textPrimary">Quản Lý Phòng Ban</Typography>
                        <Button variant="contained" startIcon={<span className="material-icons">add</span>} onClick={() => setOpen(true)}>Thêm mới</Button>
                    </Box>
                    <Paper sx={{ overflow: 'hidden' }}>
                        <TableContainer>
                            <Table>
                                <TableHead>
                                    <TableRow>
                                        <TableCell>Mã PB</TableCell><TableCell>Tên Phòng</TableCell><TableCell>Mô Tả</TableCell><TableCell align="right">Thao Tác</TableCell>
                                    </TableRow>
                                </TableHead>
                                <TableBody>
                                    {departments.map((row) => (
                                        <TableRow key={row.maPB} hover>
                                            <TableCell>{row.maPB}</TableCell>
                                            <TableCell sx={{ fontWeight: 600 }}>{row.tenPB}</TableCell>
                                            <TableCell>{row.moTa}</TableCell>
                                            <TableCell align="right"><IconButton color="error" onClick={() => handleDelete(row.maPB)}><span className="material-icons">delete</span></IconButton></TableCell>
                                        </TableRow>
                                    ))}
                                </TableBody>
                            </Table>
                        </TableContainer>
                    </Paper>
                    <Dialog open={open} onClose={() => setOpen(false)} maxWidth="xs" fullWidth>
                        <DialogTitle>Thêm Phòng Ban</DialogTitle>
                        <DialogContent>
                            <Stack spacing={2} sx={{ mt: 1 }}>
                                <TextField label="Mã PB" fullWidth size="small" value={form.maPB} onChange={(e) => setForm({ ...form, maPB: e.target.value })} />
                                <TextField label="Tên Phòng" fullWidth size="small" value={form.tenPB} onChange={(e) => setForm({ ...form, tenPB: e.target.value })} />
                            </Stack>
                        </DialogContent>
                        <DialogActions><Button onClick={() => setOpen(false)}>Hủy</Button><Button onClick={handleSubmit}>Lưu</Button></DialogActions>
                    </Dialog>
                    <Snackbar open={toast.open} autoHideDuration={3000} onClose={() => setToast({ ...toast, open: false })}><Alert severity="success">{toast.msg}</Alert></Snackbar>
                </Box>
            );
        };

        // --- POSITION MANAGER ---
        const PositionManager = () => {
            const { positions, setPositions, confirmAction } = React.useContext(DataContext);
            const [open, setOpen] = useState(false);
            const [form, setForm] = useState({ maCV: '', tenCV: '', moTa: '' });

            const handleSubmit = () => {
                const newItem = { ...form };
                setPositions(prev => [...prev, newItem]);
                setOpen(false); setForm({ maCV: '', tenCV: '', moTa: '' });
                callServer('addPosition', newItem).then(() => fetchAllData().then(data => setPositions(data.positions)));
            };

            const handleDelete = (id) => {
                confirmAction('Xóa', 'Xóa chức vụ?', () => {
                    const prev = [...positions];
                    setPositions(prev => prev.filter(p => p.maCV !== id));
                    callServer('deletePosition', id).catch(() => setPositions(prev));
                });
            };

            return (
                <Box>
                    <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 3 }}><Typography variant="h5">Chức Vụ</Typography><Button variant="contained" onClick={() => setOpen(true)}>Thêm</Button></Box>
                    <Paper><TableContainer><Table><TableHead><TableRow><TableCell>Mã</TableCell><TableCell>Tên</TableCell><TableCell>Xóa</TableCell></TableRow></TableHead><TableBody>{positions.map(p => <TableRow key={p.maCV}><TableCell>{p.maCV}</TableCell><TableCell>{p.tenCV}</TableCell><TableCell><IconButton color="error" onClick={() => handleDelete(p.maCV)}><span className="material-icons">delete</span></IconButton></TableCell></TableRow>)}</TableBody></Table></TableContainer></Paper>
                    <Dialog open={open} onClose={() => setOpen(false)}><DialogTitle>Thêm</DialogTitle><DialogContent><TextField label="Mã" value={form.maCV} onChange={e=>setForm({...form, maCV: e.target.value})} /><TextField label="Tên" value={form.tenCV} onChange={e=>setForm({...form, tenCV: e.target.value})} /></DialogContent><DialogActions><Button onClick={handleSubmit}>Lưu</Button></DialogActions></Dialog>
                </Box>
            );
        };

        // --- BỘ NÕA AI: FACE CHECK IN ---
        const FaceCheckIn = ({ user, mode = 'VERIFY', onSuccess }) => {
            const iframeRef = useRef(null);
            const [status, setStatus] = useState('Đang khởi tạo Camera...');
            const { employees, user: loggedInUser } = React.useContext(DataContext);

            const FACE_URL = 'https://namcole1991-web.github.io/face-scanner/face.html';

            const handleIframeLoad = () => {
                const currentEmp = employees.find(e => e.maNV === user.maNV) || user;
                iframeRef.current?.contentWindow?.postMessage({
                    type: 'INIT',
                    maNV: currentEmp.maNV,
                    faceData: currentEmp.face_data || null,
                    role: loggedInUser?.role || 'EMPLOYEE',
                    mode: mode // Truyền mode sang iframe (ENROLL hoặc VERIFY)
                }, '*');
                setStatus('');
            };

            useEffect(() => {
                const handleMessage = (e) => {
                    const data = e.data || {};
                    
                    if (data.type === 'ENROLL' && data.descriptor) {
                        setStatus('Đang lưu dữ liệu...');
                        callServer('saveFaceData', data.maNV, data.descriptor).then(res => {
                            setStatus(res.success ? '✅ Đã lưu khuôn mặt thành công!' : '❌ Lỗi: ' + res.message);
                            iframeRef.current?.contentWindow?.postMessage({ type: 'ENROLL_RESULT', success: res.success, message: res.message }, '*');
                            if (res.success) {
                                setTimeout(() => { if(onSuccess) onSuccess(); }, 1500); 
                            }
                        });
                    }
                    
                    if (data.type === 'VERIFIED') {
                        setStatus('✅ Xác thực thành công! Đang ghi nhận...');
                        setTimeout(() => { if(onSuccess) onSuccess(); }, 1500);
                    }
                    
                    if (data.type === 'FAILED') {
                        setStatus('❌ Khuôn mặt không khớp! Vui lòng ấn Xác Thực Lại.');
                    }
                };
                window.addEventListener('message', handleMessage);
                return () => window.removeEventListener('message', handleMessage);
            }, [user.maNV, onSuccess]);

            return (
                <Box sx={{ display: 'flex', flexDirection: 'column', height: '100%', bgcolor: '#000' }}>
                    {status && (
                        <Typography variant="subtitle2" sx={{ textAlign: 'center', p: 1.5, fontWeight: 600, color: status.includes('❌') ? '#fca5a5' : '#6ee7b7', bgcolor: '#111827' }}>
                            {status}
                        </Typography>
                    )}
                    <Box sx={{ flexGrow: 1, position: 'relative', overflow: 'hidden' }}>
                        <iframe
                            ref={iframeRef}
                            src={FACE_URL}
                            onLoad={handleIframeLoad}
                            style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', border: 'none' }}
                            title="Face Scanner"
                            allow="camera; microphone"
                        />
                    </Box>
                </Box>
            );
        };

        // --- TRẠM KIỂM SOÁT TÂN BINH (BẮT BUỘC ĐĂNG KÝ MẶT LẦN ĐẦU) ---
        const ForceEnrollmentScreen = ({ user, onEnrolled }) => {
            return (
                <Box sx={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', bgcolor: '#111827', p: {xs: 0, sm: 2} }}>
                    <Card sx={{ maxWidth: 500, width: '100%', height: {xs: '100vh', sm: 'auto'}, borderRadius: {xs: 0, sm: 4}, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
                        <Box sx={{ p: 3, textAlign: 'center', bgcolor: '#1f2937', color: '#fff' }}>
                            <span className="material-icons" style={{ fontSize: 48, color: '#3b82f6', marginBottom: 8 }}>face_retouching_natural</span>
                            <Typography variant="h6">Đăng Ký Khuôn Mặt</Typography>
                            <Typography variant="body2" sx={{ opacity: 0.8, mt: 1 }}>Đây là lần đầu đăng nhập, hệ thống cần thu thập dữ liệu khuôn mặt của bạn để phục vụ cho việc điểm danh.</Typography>
                        </Box>
                        <Box sx={{ flexGrow: 1, position: 'relative', minHeight: 400 }}>
                            <FaceCheckIn user={user} mode="ENROLL" onSuccess={onEnrolled} />
                        </Box>
                    </Card>
                </Box>
            );
        };

        // --- EMPLOYEE LIST (ADMIN) ---
        const EmployeeList = () => {
            const { employees, setEmployees, departments, positions } = React.useContext(DataContext);
            const [searchTerm, setSearchTerm] = useState('');
            const [scanUser, setScanUser] = useState(null); 
            const isMobile = useMediaQuery(theme.breakpoints.down('sm'));

            const filteredEmployees = employees.filter(emp => (emp.hoTen || '').toLowerCase().includes(searchTerm.toLowerCase()));

            return (
                <Box>
                    <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 3 }}>
                        <Typography variant="h5">Nhân Viên</Typography>
                        <TextField size="small" placeholder="Tìm..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                    </Box>
                    <Paper>
                        <TableContainer>
                            <Table>
                                <TableHead><TableRow><TableCell>Mã</TableCell><TableCell>Tên</TableCell><TableCell>Trạng Thái</TableCell><TableCell align="right">Quét Mặt</TableCell></TableRow></TableHead>
                                <TableBody>
                                    {filteredEmployees.map(emp => (
                                        <TableRow key={emp.maNV}>
                                            <TableCell>{emp.maNV}</TableCell>
                                            <TableCell>{emp.hoTen}</TableCell>
                                            <TableCell>{emp.face_data ? <Chip label="Đã có mặt" color="success" size="small"/> : <Chip label="Chưa có" color="error" size="small"/>}</TableCell>
                                            <TableCell align="right">
                                                <IconButton color="secondary" onClick={() => setScanUser(emp)}><span className="material-icons">face_retouching_natural</span></IconButton>
                                            </TableCell>
                                        </TableRow>
                                    ))}
                                </TableBody>
                            </Table>
                        </TableContainer>
                    </Paper>

                    <Dialog 
                        open={!!scanUser} 
                        disableEscapeKeyDown={true}
                        onClose={(event, reason) => { if (reason !== 'backdropClick' && reason !== 'escapeKeyDown') setScanUser(null); }} 
                        fullScreen={isMobile}
                        maxWidth="sm" 
                        fullWidth 
                        PaperProps={{ sx: { borderRadius: isMobile ? 0 : 3, bgcolor: '#000', m: isMobile ? 0 : 2 } }}
                    >
                        {!isMobile && <DialogTitle sx={{ textAlign: 'center', pb: 1, color: '#fff' }}>Đăng Ký Mặt - {scanUser?.hoTen}</DialogTitle>}
                        <DialogContent sx={{ p: 0, height: isMobile ? '100vh' : '550px', overflow: 'hidden' }}>
                            {scanUser && <FaceCheckIn user={scanUser} mode="ENROLL" onSuccess={() => setScanUser(null)} />}
                        </DialogContent>
                        <DialogActions sx={{ justifyContent: 'center', p: 2, bgcolor: '#111827' }}>
                            <Button onClick={() => setScanUser(null)} color="error" variant="contained" sx={{ width: '100%', maxWidth: 300 }}>Đóng Camera</Button>
                        </DialogActions>
                    </Dialog>
                </Box>
            );
        };

        // --- LEAVE REQUESTS ---
        const LeaveRequests = () => {
            const { leaves } = React.useContext(DataContext);
            return <Box><Typography variant="h5">Nghỉ Phép</Typography><Paper sx={{p:3, mt:2}}>{leaves.length} đơn</Paper></Box>;
        };

        // --- TIMEKEEPING ---
        const Timekeeping = () => <Box><Typography variant="h5">Chấm Công Admin</Typography></Box>;

        // --- CALENDAR VIEW ---
        const CalendarView = () => <Box><Typography variant="h5">Lịch Làm Việc</Typography></Box>;

        // --- SALARY SETTINGS ---
        const SalarySettings = () => <Box><Typography variant="h5">Cài Đặt Lương</Typography></Box>;

        // --- SALARY BOARD ---
        const SalaryBoard = () => <Box><Typography variant="h5">Bảng Lương</Typography></Box>;

        // --- GPS SETTINGS (ADMIN) ---
        const GPSSettings = () => {
            const [form, setForm] = useState({ latitude: '', longitude: '', radius: 200, address: '' });
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState({ open: false, msg: '' });

            useEffect(() => {
                callServer('getOfficeLocation').then(res => {
                    if (res) setForm({ latitude: res.latitude || '', longitude: res.longitude || '', radius: res.radius || 200, address: res.address || '' });
                    setLoading(false);
                });
            }, []);

            const handleSave = () => {
                callServer('saveOfficeLocation', { latitude: parseFloat(form.latitude), longitude: parseFloat(form.longitude), radius: parseInt(form.radius), address: form.address })
                    .then(() => setToast({ open: true, msg: 'Đã lưu' }));
            };

            const mapUrl = form.latitude && form.longitude ? `https://maps.google.com/maps?q=${form.latitude},${form.longitude}&hl=vi&z=16&output=embed` : null;

            if(loading) return <CircularProgress />;

            return (
                <Box>
                    <Typography variant="h5" sx={{mb: 3}}>Cài Đặt GPS</Typography>
                    <Grid container spacing={3}>
                        <Grid item xs={12} md={5}>
                            <Paper sx={{p:3}}>
                                <Stack spacing={2}>
                                    <TextField label="Vĩ độ" value={form.latitude} onChange={e=>setForm({...form, latitude: e.target.value})} />
                                    <TextField label="Kinh độ" value={form.longitude} onChange={e=>setForm({...form, longitude: e.target.value})} />
                                    <Button variant="contained" onClick={handleSave}>Lưu GPS</Button>
                                </Stack>
                            </Paper>
                        </Grid>
                        <Grid item xs={12} md={7}>
                            <Paper sx={{ height: 400, overflow: 'hidden' }}>
                                {mapUrl ? <iframe src={mapUrl} width="100%" height="100%" frameBorder="0" style={{border:0}}></iframe> : <Typography sx={{p:3}}>Chưa có tọa độ</Typography>}
                            </Paper>
                        </Grid>
                    </Grid>
                    <Snackbar open={toast.open} autoHideDuration={3000} onClose={()=>setToast({open:false, msg:''})}><Alert severity="success">{toast.msg}</Alert></Snackbar>
                </Box>
            );
        };

        // --- GPS CHECK IN (EMPLOYEE) ---
        const GPSCheckIn = () => {
            const { user, employees } = React.useContext(DataContext); 
            const [showFaceScanner, setShowFaceScanner] = useState(false);
            const isMobile = useMediaQuery(theme.breakpoints.down('sm'));
            const [toast, setToast] = useState({ open: false, msg: '' });

            const handleCheckInClick = () => {
                setShowFaceScanner(true);
            };

            const handleFaceVerified = () => {
                setShowFaceScanner(false);
                setToast({ open: true, msg: '✅ Xác thực thành công! Đang lưu GPS...' });
                callServer('gpsCheckIn', user.maNV, 0, 0); // Đây là hàm mock GPS, gọi thật thì thêm navigator.geolocation
            };

            return (
                <Box>
                    <Typography variant="h5" sx={{ mb: 3 }}>Chấm Công (Xác Thực Mặt)</Typography>
                    <Paper sx={{ p: 4, textAlign: 'center' }}>
                        <Button variant="contained" size="large" onClick={handleCheckInClick}>BẤM VÀO ĐÂY ĐỂ ĐIỂM DANH</Button>
                    </Paper>

                    <Dialog 
                        open={showFaceScanner} 
                        disableEscapeKeyDown={true} 
                        onClose={(event, reason) => { if (reason !== 'backdropClick' && reason !== 'escapeKeyDown') setShowFaceScanner(false); }}
                        fullScreen={isMobile} 
                        maxWidth="sm" 
                        fullWidth 
                        PaperProps={{ sx: { borderRadius: isMobile ? 0 : 3, bgcolor: '#000', m: isMobile ? 0 : 2 } }}
                    >
                        {!isMobile && <DialogTitle sx={{ textAlign: 'center', pb: 1, color: '#fff' }}>Xác Thực Khuôn Mặt</DialogTitle>}
                        <DialogContent sx={{ p: 0, height: isMobile ? '100vh' : '550px', overflow: 'hidden' }}>
                            {showFaceScanner && <FaceCheckIn user={user} mode="VERIFY" onSuccess={handleFaceVerified} />}
                        </DialogContent>
                        <DialogActions sx={{ justifyContent: 'center', p: 2, bgcolor: '#111827' }}>
                            <Button onClick={() => setShowFaceScanner(false)} color="error" variant="contained" sx={{ borderRadius: 2, width: '100%', maxWidth: 300 }}>Hủy / Đóng</Button>
                        </DialogActions>
                    </Dialog>

                    <Snackbar open={toast.open} autoHideDuration={3000} onClose={()=>setToast({open:false, msg:''})}><Alert severity={toast.msg.includes('❌')?'error':'success'}>{toast.msg}</Alert></Snackbar>
                </Box>
            );
        };

        // --- LOGIN COMPONENT ---
        const Login = ({ onSuccess }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            const handleLogin = () => {
                setLoading(true);
                callServer('login', username, password).then(res => {
                    setLoading(false);
                    if (res.success) onSuccess(res);
                    else alert('Đăng nhập thất bại');
                }).catch(() => setLoading(false));
            };

            return (
                <Box sx={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', bgcolor: '#f3f4f6' }}>
                    <Card sx={{ p: 4, width: 350, textAlign: 'center' }}>
                        <Typography variant="h5" sx={{ mb: 3 }}>Đăng Nhập</Typography>
                        <Stack spacing={2}>
                            <TextField label="Username" value={username} onChange={e=>setUsername(e.target.value)} />
                            <TextField label="Password" type="password" value={password} onChange={e=>setPassword(e.target.value)} />
                            <Button variant="contained" onClick={handleLogin} disabled={loading}>Vào</Button>
                        </Stack>
                    </Card>
                </Box>
            );
        };

        const GlobalLoading = ({ open }) => (
            <Backdrop sx={{ color: '#fff', zIndex: 9999 }} open={open}><CircularProgress color="inherit" /></Backdrop>
        );

        // --- MAIN APP ---
        const App = () => {
            const [view, setView] = useState('dashboard');
            const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('hrms_user')));
            const [data, setData] = useState({ stats: {charts:{}}, employees: [], leaves: [], departments: [], positions: [], attendance: [], settings: {} });
            const [loading, setLoading] = useState(false);

            const fetchData = () => {
                setLoading(true);
                fetchAllData().then(res => {
                    if (res) setData({
                        stats: res.dashboardStats || {}, employees: res.employees || [], leaves: res.leaves || [],
                        departments: res.departments || [], positions: res.positions || [], attendance: res.attendance || [], settings: res.settings || {}
                    });
                    setLoading(false);
                });
            };

            useEffect(() => {
                if (user) { fetchData(); setView(user.role === 'EMPLOYEE' ? 'gps_checkin' : 'dashboard'); }
            }, [user]);

            if (!user) return <ThemeProvider theme={theme}><CssBaseline /><Login onSuccess={(res) => { const userData = { ...res.user, role: res.role }; localStorage.setItem('hrms_user', JSON.stringify(userData)); setUser(userData); }} /></ThemeProvider>;

            const ctxValue = { ...data, loading, setLoading, setEmployees: (d) => setData(p => ({...p, employees: d})), setLeaves: (d) => setData(p => ({...p, leaves: d})), setDepartments: (d) => setData(p => ({...p, departments: d})), setPositions: (d) => setData(p => ({...p, positions: d})), confirmAction: (t,c,act)=> {if(window.confirm(c)) act();}, user };

            // CHẶN NHÂN VIÊN CHƯA CÓ KHUÔN MẶT BẮT BUỘC ĐĂNG KÝ
            const isDataLoaded = data.employees && data.employees.length > 0;
            const currentEmp = data.employees.find(e => e.maNV === user.maNV);
            const needsEnrollment = user.role !== 'ADMIN' && isDataLoaded && currentEmp && (!currentEmp.face_data || currentEmp.face_data.trim() === '');

            if (needsEnrollment) {
                return (
                    <DataContext.Provider value={ctxValue}>
                        <ThemeProvider theme={theme}>
                            <CssBaseline />
                            <ForceEnrollmentScreen user={user} onEnrolled={fetchData} />
                            <GlobalLoading open={loading} />
                        </ThemeProvider>
                    </DataContext.Provider>
                );
            }

            return (
                <DataContext.Provider value={ctxValue}>
                    <ThemeProvider theme={theme}>
                        <CssBaseline />
                        <MainLayout setView={setView} currentView={view} user={user} setUser={setUser} settings={data.settings}>
                            {user.role === 'ADMIN' && view === 'dashboard' && <Dashboard />}
                            {user.role === 'ADMIN' && view === 'timekeeping' && <Timekeeping />}
                            {user.role === 'ADMIN' && view === 'calendar' && <CalendarView />}
                            {user.role === 'ADMIN' && view === 'employees' && <EmployeeList />}
                            {user.role === 'ADMIN' && view === 'departments' && <DepartmentManager />}
                            {user.role === 'ADMIN' && view === 'positions' && <PositionManager />}
                            {user.role === 'ADMIN' && view === 'salary_settings' && <SalarySettings />}
                            {user.role === 'ADMIN' && view === 'salary_calculation' && <SalaryBoard />}
                            {user.role === 'ADMIN' && view === 'gps_settings' && <GPSSettings />}
                            {user.role === 'EMPLOYEE' && view === 'gps_checkin' && <GPSCheckIn />}
                            {['leave'].includes(view) && <LeaveRequests />}
                        </MainLayout>
                        <GlobalLoading open={loading} />
                    </ThemeProvider>
                </DataContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
